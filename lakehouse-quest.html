e across invocations","Tools perform a single, well-defined operation and are generally stateless","Agents cannot call tools","Tools always require an MCP server"],"answer":1,"explain":"Tools perform single, well-defined operations and are generally stateless, while agents maintain state as they iteratively solve open-ended tasks.","source":"docs.databricks.com/aws/en/agents/concepts"},{"id":"QB21","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"In MLflow 3 evaluation, which scorers can run WITHOUT ground truth?","options":["Correctness and RetrievalSufficiency","Only custom code-based scorers","All built-in judges automatically","RelevanceToQuery, Safety, and RetrievalGroundedness"],"answer":3,"explain":"RelevanceToQuery, Safety, and RetrievalGroundedness need no ground truth; Correctness and RetrievalSufficiency require ground truth expectations.","source":"docs.databricks.com/aws/en/mlflow3/genai/agent-eval-migration"},{"id":"QB22","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"What is a recommended source for building agent evaluation datasets?","options":["Real production traces captured with MLflow Tracing","Randomly generated noise rows","The agent's system prompt text","Warehouse audit logs only"],"answer":0,"explain":"If you have captured traces from your application, you can use them to create an evaluation dataset based on real-world scenarios, optionally enriched with expert labels.","source":"docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/build-eval-dataset"},{"id":"QB23","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"What is the maximum number of tables or views a Genie Agent can include?","options":["5","10","30","Unlimited"],"answer":2,"explain":"Genie Agent limits allow adding up to 30 tables or views to a single agent.","source":"docs.databricks.com/aws/en/genie-agents/set-up"},{"id":"QB24","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Which compute resource does a Genie Agent require to process queries?","options":["An all-purpose cluster","A pro or serverless SQL warehouse","A Model Serving endpoint","A Lakebase instance"],"answer":1,"explain":"Genie Agents require a pro or serverless SQL warehouse, and creators need at least CAN USE permission on it.","source":"docs.databricks.com/aws/en/genie-agents/set-up"},{"id":"QB25","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"When compacting a long agent trajectory, what should the summary prioritize preserving?","options":["Exact wording of every tool output","Raw embedding vectors","Full error stack traces","Goals, decisions, and major discoveries"],"answer":3,"explain":"Compaction keeps high-fidelity essentials — goals, decisions, and key discoveries — while discarding exact wording and superseded reasoning.","source":"docs.databricks.com/aws/en/agents/concepts"},{"id":"QB26","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"With on-behalf-of-user authentication, what must an app include for each managed MCP server it accesses?","options":["The corresponding OAuth scope for that server","A hardcoded personal access token","A dedicated workspace","Its own embedding model"],"answer":0,"explain":"When connecting using on-behalf-of-user authentication, include the OAuth scope corresponding to each managed MCP server the application needs.","source":"docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp"},{"id":"QB27","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Why do managed MCP servers fit enterprise governance requirements?","options":["They bypass Unity Catalog for performance","They replicate data outside the metastore","Unity Catalog enforces permissions so agents and users only access granted tools and data","They disable monitoring by default"],"answer":2,"explain":"Managed MCP servers are governed: Unity Catalog enforces permissions so agents and users reach only the tools and data they are granted, viewable in Unity AI Gateway.","source" itor"},{"id":"QB31","cert":"CE","domain":"Context Engineering","difficulty":3,"q":"Which statement matches Databricks' memory scaling findings for agents?","options":["Memory always increases cost with no accuracy benefit","Semantic memory stores raw conversation logs","Accumulated context can improve agent accuracy and efficiency over time","Memory scaling only works for single-user agents"],"answer":2,"explain":"Databricks research on memory scaling shows that as an agent accumulates context, its accuracy and efficiency can improve.","source":"docs.databricks.com/aws/en/agents/custom-agents/stateful-agents"},{"id":"QB32","cert":"CE","domain":"Context Engineering","difficulty":3,"q":"Which pairing of memory types is correct?","options":["Episodic memory distills rules; semantic memory stores raw logs","Episodic memory captures raw interactions; semantic memory distills facts and rules","Both store only embeddings","Episodic memory holds system prompts; semantic memory holds schemas"],"answer":1,"explain":"Episodic memory captures raw interactions like conversation logs and feedback; semantic memory distills them into reusable facts and rules.","source":"docs.databricks.com/aws/en/agents/custom-agents/stateful-agents"},{"id":"QB33","cert":"CE","domain":"Context Engineering","difficulty":3,"q":"Users with different data access rights query the same retrieval-backed agent over sensitive tables. What is the governed approach?","options":["Grant the agent full SELECT on everything","Redact at the application layer only","Use on-behalf-of-user authentication so Unity Catalog permissions govern each retrieval","Disable retrieval for all users"],"answer":2,"explain":"Governed access means the agent acts with the user's identity so Unity Catalog permissions determine what data can enter that user's context.","source":"docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp"},{"id":"QB34","cert":"CE","domain":"Context Engineering","difficulty":3,"q":"What does the AI Search reranker do in a query?","options":["Runs a second-stage model over initial candidate results to improve relevance","Rebuilds the entire vector index","Converts keywords into embeddings","Deduplicates the source Delta table"],"answer":0,"explain":"AI Search supports reranking as a second-stage step over the initial candidate set to tune retrieval quality.","source":"docs.databricks.com/aws/en/ai-search/query-ai-search"},{"id":"QB35","cert":"CE","domain":"Context Engineering","difficulty":3,"q":"A Genie Agent repeatedly applies a wrong metric definition. What is the strongest fix per tuning guidance?","options":["Add more unrelated tables to the agent","Add a verified answer or a metric/business-rule instruction","Upgrade to a larger SQL warehouse","Remove instructions to shorten context"],"answer":1,"explain":"Tuning Genie quality means adding metrics, business rules, and verified answers so trusted definitions override the model's defaults.","source":"docs.databricks.com/aws/en/genie-agents/tune-quality"}];

function shuffle(arr,rng){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor((rng?rng():Math.random())*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function mulberry32(seed){
  return function(){
    seed|=0;seed=(seed+0x6D2B79F5)|0;
    var t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function seedFromString(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}

var audioCtx=null;
function ensureAudio(){
  if(audioCtx)return true;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    audioCtx=new AC();
    return true;
  }catch(e){return false;}
}
function beep(freq,dur,type,gain){
  if(!sndOn||!ensureAudio())return;
  try{
    if(audioCtx.state==="suspended")audioCtx.resume();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||"square";o.frequency.value=freq;
    g.gain.setValueAtTime(gain||0.06,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ============ embers background ============ */
var bg=$("bg"),bctx=bg.getContext("2d"),DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var embers=[];
function resizeBg(){
  bg.width=Math.floor(window.innerWidth*DPR);
  bg.height=Math.floor(window.innerHeight*DPR);
  bg.style.width=window.innerWidth+"px";
  bg.style.height=window.innerHeight+"px";
  bctx.setTransform(DPR,0,0,DPR,0,0);
  initEmbers();
}
function initEmbers(){
  var n=Math.min(60,Math.floor((window.innerWidth*window.innerHeight)/26000));
  embers=[];
  for(var i=0;i<n;i++)embers.push(newEmber(true));
}
function newEmber(anywhere){
  var cyan=Math.random()<0.3;
  return {
    x:Math.random()*window.innerWidth,
    y:anywhere?Math.random()*window.innerHeight:window.innerHeight+10,
    r:1+Math.random()*2.4,
    v:6+Math.random()*16,
    drift:(Math.random()-0.5)*10,
    a:0.15+Math.random()*0.45,
    c:cyan?"0,181,226":"255,120,60"
  };
}
var lastEmberT=0;
function emberFrame(t){
  var dt=lastEmberT?Math.min(0.05,(t-lastEmberT)/1000):0.016;
  lastEmberT=t;
  bctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for(var i=0;i<embers.length;i++){
    var p=embers[i];
    p.y-=p.v*dt;
    p.x+=Math.sin(t/1400+i)*p.drift*dt;
    if(p.y<-12)embers[i]=newEmber(false);
    bctx.beginPath();
    bctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bctx.fillStyle="rgba("+p.c+","+p.a+")";
    bctx.shadowColor="rgba("+p.c+",0.8)";
    bctx.shadowBlur=8;
    bctx.fill();
    bctx.shadowBlur=0;
  }
  requestAnimationFrame(emberFrame);
}
window.addEventListener("resize",resizeBg);
resizeBg();
requestAnimationFrame(emberFrame);

/* ============ question pools ============ */
function poolFor(cert){
  var c=CERTS[cert];
  var src=c.pool||cert;
  var out=[];
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];
    if(q.cert!==src)continue;
    if(c.maxDiff&&q.difficulty>c.maxDiff)continue;
    out.push(q);
  }
  return out;
}
function zoneQuestions(cert,domain){
  var pool=poolFor(cert),out=[];
  for(var i=0;i<pool.length;i++){if(pool[i].domain===domain)out.push(pool[i]);}
  return out;
}

/* ============ readiness ============ */
function domainReadiness(cert,domain){
  var qs=zoneQuestions(cert,domain);
  if(!qs.length)return {pct:0,acc:0,cov:0,total:0};
  var c=0,w=0,answered=0;
  for(var i=0;i<qs.length;i++){
    var st=stats[qs[i].id];
    if(st&&(st.c||st.w)){
      c+=st.c||0;w+=st.w||0;answered++;
    }
  }
  var acc=(c+w)===0?0:c/(c+w);
  var cov=answered/qs.length;
  return {pct:Math.round(acc*cov*100),acc:Math.round(acc*100),cov:Math.round(cov*100),total:qs.length,answered:answered,correct:c};
}
function certReadiness(cert){
  var ds=CERTS[cert].domains,total=0,weighted=0;
  for(var i=0;i<ds.length;i++){
    var r=domainReadiness(cert,ds[i]);
    total+=r.total;weighted+=r.pct*r.total;
  }
  return total===0?0:Math.round(weighted/total);
}
function readinessTag(pct){
  if(pct<40)return {cls:"red",word:"NOT READY",color:"#ff4757"};
  if(pct<=70)return {cls:"orange",word:"GETTING THERE",color:"#ffc247"};
  return {cls:"green",word:"EXAM READY",color:"#2fd66f"};
}
function ringSVG(pct,color,size){
  size=size||74;
  var r=(size/2)-6,c=2*Math.PI*r,off=c*(1-clamp(pct,0,100)/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+" "+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" '+
    'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+
    'transform="rotate(-90 '+size/2+" "+size/2+')"/>'+'</svg>';
}

/* ============ battle core ============ */
function buildDeck(qs,n,prioritizeRevenge){
  var deck=[],rest=qs.slice(),rv=[];
  if(prioritizeRevenge){
    for(var i=0;i<qs.length;i++){
      if(revenge[qs[i].id]){rv.push(qs[i]);}
    }
    deck=shuffle(rv);
    rest=qs.filter(function(q){return !revenge[q.id];});
  }
  var need=Math.min(n,qs.length);
  if(deck.length<need)deck=deck.concat(shuffle(rest).slice(0,need-deck.length));
  else deck=deck.slice(0,need);
  return deck;
}
function startZone(cert,domain,isRevenge){
  var qs=zoneQuestions(cert,domain);
  var deck=buildDeck(qs,Math.min(12,qs.length),true);
  if(!deck.length)return;
  battle={
    mode:"zone",cert:cert,domain:domain,
    bossName:BOSS_NAMES[domain]||"ZONE GUARDIAN",
    deck:deck,idx:0,bossHp:0,bossMax:0,
    playerHp:100,playerMax:100,
    streak:0,meter:0,armed:false,overdrive:0,
    speedChain:0,speedMult:1,
    correctCount:0,wrongCount:0,critCount:0,dmgDealt:0,fastCount:0,
    qLimit:0,qStart:0,answered:false,timerRaf:0,tauntT:0
  };
  var est=0;
  for(var i=0;i<deck.length;i++)est+=10+deck[i].difficulty*4;
  battle.bossMax=Math.round(est*1.15);battle.bossHp=battle.bossMax;
  showBattle();
}

function qTimeLimit(q){return 24+q.difficulty*8;}
function nextQuestion(){

function escapeHtml(s){

}
function domTag(d){return '<span class="tag">'+escapeHtml(d)+"</span>";}
function startTimer(){

function lockOptions(pickedIdx,rightIdx){

function floatDamage(unitId,text,color,big){
  var u=$(unitId);
  if(!u)return;
  var f=document.createElement("div");
  f.className="dmg";
  f.style.color=color||"#fff";
  f.style.fontSize=(big?30:20)+"px";
  f.style.left=(30+Math.random()*40)+"%";
  f.style.top="4px";
  f.textContent=text;
  u.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},1050);
}
function burst(unitId,color,n){
  var u=$(unitId);
  if(!u)return;
  var r=u.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(var i=0;i<(n||10);i++){
    var p=document.createElement("div");
    p.className="particle";
    p.style.background=color;
    p.style.left=cx+"px";p.style.top=cy+"px";
    document.body.appendChild(p);
    var ang=Math.random()*Math.PI*2,dist=40+Math.random()*90;
    var tx=cx+Math.cos(ang)*dist,ty=cy+Math.sin(ang)*dist;
    if(p.animate){
      p.animate([
        {transform:"translate(0,0) scale(1)",opacity:.95},
        {transform:"translate("+(tx-cx)+"px,"+(ty-cy)+"px) scale(.2)",opacity:0}
      ],{duration:420+Math.random()*320,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=(function(el){return function(){if(el.parentNode)el.parentNode.removeChild(el);};})(p);
    }else{setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},500);}
  }
}

/* ---- answer resolution ---- */
function onTimeout(){resolveAnswer(-1);}
function answer(pickedIdx){resolveAnswer(pickedIdx);}
function resolveAnswer(pickedIdx){
  var b=battle;
  if(!b||b.answered)return;
  b.answered=true;
  stopTimer();
  var q=b.deck[b.idx];
  var elapsed=(now()-b.qStart)/1000;
  var timeRatio=clamp(1-elapsed/b.qLimit,0,1);
  var correct=pickedIdx===q.answer;
  var st=stats[q.id];
  if(!st)st=stats[q.id]={c:0,w:0};
  lockOptions(pickedIdx,q.answer);
  if(correct){
    b.correctCount++;
    st.c=(st.c||0)+1;
    delete revenge[q.id];
    saveRevenge(revenge);
    var fast=elapsed<3;
    if(fast){b.fastCount++;b.speedChain++;b.speedMult=Math.min(2,1+0.1*b.speedChain);}
    else{b.speedChain=0;b.speedMult=1;}
    b.streak++;
    var armedHit=b.armed;
    if(armedHit){b.armed=false;b.meter=0;}
    else{
      b.meter=Math.min(100,b.meter+25);
      if(b.meter>=100)b.armed=true;
    }
    var mult=1;
    if(armedHit)mult*=2;
    if(b.streak>=3&&b.overdrive===0){b.overdrive=3;}
    var overdriveHit=b.overdrive>0;
    if(b.overdrive>0)b.overdrive--;
    if(overdriveHit)mult*=2;
    mult*=(1+0.5*timeRatio);
    mult*=(1+0.03*Math.min(b.streak,10));
    mult*=b.speedMult;
    var dmg=Math.round((10+q.difficulty*4)*mult);
    var crit=armedHit||overdriveHit||dmg>=40;
    if(crit)b.critCount++;
    b.dmgDealt+=dmg;
    b.bossHp=Math.max(0,b.bossHp-dmg);
    var fx=function(){
      floatDamage("u-boss",(crit?"CRIT ":"")+"-"+dmg,crit?"#ffc247":"#00B5E2",crit||dmg>=30);
      burst("u-boss",crit?"#ffc247":"#FF3621",crit?18:8);
    };
    if(crit){hitStop();setTimeout(fx,110);sndCrit();}
    else{fx();sndCorrect();}
    if(armedHit){floatDamage("u-boss","BRICK BREAKER!","#FF3621",true);}
    if(timeRatio<0.4){
      var slowDmg=Math.round((1-timeRatio)*14)+3;
      b.playerHp=Math.max(0,b.playerHp-slowDmg);
      setTimeout(function(){
        floatDamage("u-player","SLOW! -"+slowDmg,"#ff4757",false);
        burst("u-player","#ff4757",6);
        sndBossHit();
        renderHud();
      },420);
    }
    showExplain(true,q,dmg,crit);
  }else{
    b.wrongCount++;
    b.streak=0;b.meter=Math.max(0,b.meter-40);b.armed=false;
    b.speedChain=0;b.speedMult=1;b.overdrive=0;
    st.w=(st.w||0)+1;
    revenge[q.id]=1;
    saveRevenge(revenge);
    var special=pickedIdx>=0?(20+q.difficulty*4):26;
    special=Math.round(special*(1+0.3*(1-timeRatio)));
    b.playerHp=Math.max(0,b.playerHp-special);
    shakeScreen();
    bossTaunt();
    sndWrong();
    floatDamage("u-player",(pickedIdx>=0?"SPECIAL! ":"TIMEOUT! ")+"-"+special,"#ff4757",true);
    burst("u-player","#ff4757",16);
    showExplain(false,q,special,false);
  }
  saveStats(stats);
  renderHud();
}
function showExplain(win,q,dmg,crit){
  var v=$("exverdict");
  v.className=win?"win":"loss";
  v.textContent=win?(crit?"CRITICAL HIT · "+dmg+" DMG":"HIT · "+dmg+" DMG"):"BOSS SPECIAL · -"+dmg+" HP";
  $("exwhy").textContent=q.explain;

function lootTitle(b){

/* ============ exam sim ============ */
function examWeightsFor(cert){
  if(EXAM_WEIGHTS[cert])return EXAM_WEIGHTS[cert];
  var c=CERTS[cert],pool=poolFor(cert),w={},tot=0;
  c.domains.forEach(function(d){
    var n=zoneQuestions(cert,d).length;w[d]=n;tot+=n;
  });
  c.domains.forEach(function(d){w[d]=100*w[d]/tot;});
  return w;
}
function startExamSim(cert){
  var w=examWeightsFor(cert),TOTAL=20;
  var alloc={},assigned=0,remainders=[];
  Object.keys(w).forEach(function(d){
    var exact=TOTAL*w[d]/100;
    alloc[d]=Math.floor(exact);
    remainders.push({d:d,r:exact-alloc[d]});
    assigned+=alloc[d];
  });
  remainders.sort(function(a,b){return b.r-a.r;});
  var pools={};
  Object.keys(w).forEach(function(d){pools[d]=shuffle(zoneQuestions(cert,d));});
  var i=0;
  while(assigned<TOTAL&&remainders.length){
    var rr=remainders[i%remainders.length].d;
    if(alloc[rr]<pools[rr].length){alloc[rr]++;assigned++;}
    else{remainders.splice(i%remainders.length,1);i--;}
    i++;
    if(!remainders.length)break;
  }
  if(assigned<TOTAL){
    var flat=shuffle(poolFor(cert));
    var used={};
    Object.keys(alloc).forEach(function(d){pools[d].slice(0,alloc[d]).forEach(function(q){used[q.id]=true;});});
    for(var j=0;j<flat.length&&assigned<TOTAL;j++){
      if(used[flat[j].id])continue;
      pools[flat[j].domain]=pools[flat[j].domain]||[];
      pools[flat[j].domain].push(flat[j]);
      alloc[flat[j].domain]=(alloc[flat[j].domain]||0)+1;
      assigned++;
    }
  }
  var deck=[];
  Object.keys(alloc).forEach(function(d){
    deck=deck.concat(pools[d].slice(0,alloc[d]));
  });
  deck=shuffle(deck);
  if(!deck.length)return;
  exam={cert:cert,deck:deck.slice(0,TOTAL),idx:0,results:{},answered:false,qStart:0,timeLimit:60,timerRaf:0};
  $("exam-title").textContent=CERTS[cert].name+" · EXAM SIM";
  showScreen("screen-exam");
  nextExamQuestion();
}
function nextExamQuestion(){
  var e=exam;
  if(!e)return;
  if(e.idx>=e.deck.length){finishExam();return;}
  var q=e.deck[e.idx];
  e.answered=false;
  e.qStart=now();
  $("exam-expanel").classList.remove("on");
  $("exam-count").textContent=(e.idx+1)+"/"+e.deck.length;
  $("exam-fill").style.width=(100*e.idx/e.deck.length)+"%";
  $("exam-qtags").innerHTML=domTag(q.domain)+' <span class="tag diff">D'+q.difficulty+"</span>";
  $("exam-qtext").textContent=q.q;
  var opts=$("exam-opts");
  opts.innerHTML="";
  for(var i=0;i<q.options.length;i++){
    var btn=document.createElement("button");
    btn.type="button";btn.className="opt";
    btn.innerHTML='<span class="key">'+String.fromCharCode(65+i)+"</span><span>"+escapeHtml(q.options[i])+"</span>";
    (function(idx){btn.addEventListener("click",function(){answerExam(idx);});})(i);
    opts.appendChild(btn);
  }
  startExamTimer();
}
function startExamTimer(){
  var e=exam;
  if(e.timerRaf)cancelAnimationFrame(e.timerRaf);
  function tick(){
    if(!exam||exam.answered)return;
    var left=Math.max(0,exam.timeLimit-(now()-exam.qStart)/1000);
    $("exam-timer").textContent=Math.ceil(left)+"s";
    if(left<=0){answerExam(-1);return;}
    exam.timerRaf=requestAnimationFrame(tick);
  }
  e.timerRaf=requestAnimationFrame(tick);
}
function stopExamTimer(){if(exam&&exam.timerRaf){cancelAnimationFrame(exam.timerRaf);exam.timerRaf=0;}}
function answerExam(pickedIdx){
  var e=exam;
  if(!e||e.answered)return;
  e.answered=true;
  stopExamTimer();
  var q=e.deck[e.idx];
  var correct=pickedIdx===q.answer;
  var bs=$("exam-opts").children;
  for(var i=0;i<bs.length;i++){
    bs[i].disabled=true;
    if(i===q.answer)bs[i].classList.add("right");
    if(i===pickedIdx&&pickedIdx!==q.answer)bs[i].classList.add("wrongpick");
  }
  var st=stats[q.id];
  if(!st)st=stats[q.id]={c:0,w:0};
  if(correct){st.c=(st.c||0)+1;beep(660,.08,"square",.04);}
  else{st.w=(st.w||0)+1;beep(160,.18,"sawtooth",.05);}
  saveStats(stats);
  var dom=e.results[q.domain]||(e.results[q.domain]={c:0,t:0});
  dom.t++;if(correct)dom.c++;
  var v=$("exam-exverdict");
  v.className=correct?"win":"loss";
  v.style.fontSize="15px";v.style.fontWeight="800";
  v.textContent=correct?"CORRECT":"WRONG"+(pickedIdx<0?" (TIMEOUT)":"");
  var why=$("exam-exwhy");
  why.style.cssText="font-size:13.5px;line-height:1.5;white-space:pre-wrap;";
  why.textContent=q.explain+"\n["+q.source+"]";
  $("exam-expanel").classList.add("on");
  $("btn-exnext").textContent=(e.idx+1>=e.deck.length)?"SEE RESULTS ▶":"NEXT ▶";
}
function continueExam(){
  var e=exam;
  if(!e)return;
  e.idx++;
  if(e.idx>=e.deck.length){finishExam();return;}
  nextExamQuestion();
}
function finishExam(){
  var e=exam;
  stopExamTimer();
  if(!e)return;
  var total=e.deck.length,correct=0;
  Object.keys(e.results).forEach(function(d){correct+=e.results[d].c;});
  var score=Math.round(100*correct/total);
  var pass=score>=70;
  var prevBest=loadExamBest(e.cert);
  if(score>prevBest)saveExamBest(e.cert,score);
  var t=$("end-title");
  t.textContent=pass?"EXAM PASSED":"EXAM FAILED";
  t.style.color=pass?"var(--good)":"var(--bad)";
  t.style.textShadow=pass?"0 0 30px rgba(47,214,111,.6)":"0 0 30px rgba(255,71,87,.6)";
  $("end-loot").style.display="block";
  $("end-lootname").textContent=pass?"PROJECTED CERTIFIED":"STILL GRINDING";
  $("end-stats").innerHTML="Projected score <b>"+score+"%</b> ("+correct+"/"+total+") &middot; pass line <b>70%</b><br>"+
    (prevBest<0?"First attempt!":"Personal best: <b>"+Math.max(prevBest,score)+"%</b>")+
    "<br><b>Gap analysis by domain:</b>";
  var rows="";
  Object.keys(e.results).forEach(function(d){
    var r=e.results[d];
    var pct=Math.round(100*r.c/r.t);
    rows+="<tr><td>"+escapeHtml(d)+"</td><td class='num'>"+r.t+"</td><td class='num'>"+r.c+
      "</td><td class='num "+(pct>=70?"pass":"fail")+"'>"+pct+"%</td></tr>";
  });
  $("end-gap").innerHTML="<table class='gaptable'><tr><th>Domain</th><th class='num'>Q</th><th class='num'>Correct</th><th class='num'>Score</th></tr>"+rows+"</table>";
  var rv=$("btn-revenge"),ea=$("btn-exam-again");
rv.style.display="none";
  ea.style.display="";
  var ec=e.cert;
  ea.onclick=function(){startExamSim(ec);};
  $("btn-tomap").textContent="RETURN TO CERTS";
  if(pass)sndWin();else sndLose();
  showScreen("screen-end");
  exam=null;
}

/* ============ daily & misc buttons ============ */
function updateDailyUI(){
  var d=loadDaily();
  $("daily-streak").textContent=String(d.streak);
  var btn=$("btn-daily");
  if(d.last===todayStr()){btn.disabled=true;}
  else{btn.disabled=false;}
}
function resetAll(){
  if(!confirm("Erase ALL progress: stats, zones, revenge queue, exam bests?"))return;
  stats={};revenge={};cleared={};
  ["DEP","DEA","GAI","CE"].forEach(function(c){
    try{localStorage.removeItem("lq_examsim_best_"+c);}catch(e){}
  });
  saveStats(stats);saveRevenge(revenge);saveCleared(cleared);
  renderCerts();updateDailyUI();
}

/* ============ wiring ============ */
$("btn-continue").addEventListener("click",continueBattle);
$("btn-back").addEventListener("click",function(){renderCerts();showScreen("screen-cert");});
$("btn-examsim").addEventListener("click",function(){if(curCert)startExamSim(curCert);});
$("btn-revenge").addEventListener("click",revengeRestart);
$("btn-tomap").addEventListener("click",function(){
  if(curCert){renderMap();showScreen("screen-map");}
  else{renderCerts();showScreen("screen-cert");}
});
$("btn-daily").addEventListener("click",startDaily);
$("btn-snd").addEventListener("click",function(){
  sndOn=!sndOn;saveSoundPref(sndOn);
  $("btn-snd").innerHTML="&#9834; SOUND: "+(sndOn?"ON":"OFF");
});
$("btn-reset").addEventListener("click",resetAll);
$("btn-exnext").addEventListener("click",continueExam);
$("btn-examquit").addEventListener("click",function(){
  if(!confirm("Abandon exam sim? Progress for this attempt is lost."))return;
  stopExamTimer();exam=null;
  if(curCert){renderMap();showScreen("screen-map");}
  else{renderCerts();showScreen("screen-cert");}
});
document.addEventListener("keydown",function(e){
  if($("screen-battle").classList.contains("on")&&battle&&!battle.answered){
    var k=e.key.toUpperCase().charCodeAt(0);
    if(k>=65&&k<=69){
      var idx=k-65;
      var opts=$("opts").children;
      if(idx<opts.length){answer(idx);}
    }
  }else if($("screen-battle").classList.contains("on")&&battle&&battle.answered&&$("expanel").classList.contains("on")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();continueBattle();
  }else if($("screen-exam").classList.contains("on")&&exam&&!exam.answered){
    var k2=e.key.toUpperCase().charCodeAt(0);
    if(k2>=65&&k2<=69){
      var idx2=k2-65;
      var opts2=$("exam-opts").children;
      if(idx2<opts2.length){answerExam(idx2);}
    }
  }
});

/* ============ boot ============ */
$("btn-snd").innerHTML="&#9834; SOUND: "+(sndOn?"ON":"OFF");
renderCerts();
updateDailyUI();
</script>
</body>
</html>
