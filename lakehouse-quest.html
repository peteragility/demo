ng/foundation-models/external-models"},{"id":"Q810","cert":"GAI","domain":"Deployment","difficulty":3,"q":"A team configures two external models (e.g., an OpenAI model and an Anthropic model) inside a single serving endpoint. What additional configuration is required?","options":["Nothing extra — requests are routed randomly between the models","Each external model must be deployed to its own workspace first","A traffic_config must be provided defining the traffic routing percentage for each external model","The endpoint must be created with the provisioned_model_units field"],"answer":2,"explain":"When you configure multiple external models in one serving endpoint, you must provide a traffic_config that defines the traffic routing percentage for each. This enables A/B testing and gradual rollouts between providers.","source":"docs.databricks.com/en/machine-learning/foundation-models/external-models"},{"id":"Q811","cert":"GAI","domain":"Deployment","difficulty":1,"q":"Which Databricks Foundation Model APIs mode is recommended as the easiest way to get started accessing foundation models?","options":["Pay-per-token foundation model APIs","Provisioned throughput","AI Functions optimized models only","Bring-your-own Kubernetes inference cluster"],"answer":0,"explain":"Pay-per-token is the easiest way to start accessing foundation models on Databricks and is recommended for beginning your journey with Foundation Model APIs. Preconfigured pay-per-token endpoints appear at the top of the endpoint list in the Serving tab.","source":"docs.databricks.com/en/machine-learning/foundation-model-apis"},{"id":"Q812","cert":"GAI","domain":"Deployment","difficulty":2,"q":"Which statement about priority pay-per-token (priority mode) for Foundation Model APIs is correct?","options":["It requires a minimum one-year capacity commitment","It reserves dedicated GPUs in your workspace for your exclusive use","It is automatically applied to every request on supported endpoints","It is opt-in per request using the service_tier parameter set to \"priority\", requires no commitment, and bills at a higher per-token rate for more consistent latency under load"],"answer":3,"explain":"Priority pay-per-token is for latency-sensitive, real-time applications. You opt in per request with service_tier=\"priority\"; requests are admitted ahead of standard best-effort traffic for more consistent latency. There is no commitment, but the per-token rate is higher.","source":"docs.databricks.com/en/machine-learning/foundation-model-apis"},{"id":"Q813","cert":"GAI","domain":"Deployment","difficulty":2,"q":"Your production workload serves a fine-tuned variant of a supported model architecture, requires guaranteed throughput, and must meet HIPAA compliance. Which serving approach should you choose?","options":["Standard pay-per-token Foundation Model APIs","Provisioned throughput endpoints","An external model endpoint pointing at OpenAI","ai_query with AI Functions on a SQL warehouse"],"answer":1,"explain":"Provisioned throughput allocates dedicated inference capacity for consistent throughput and is recommended for production workloads needing high throughput, performance guarantees, fine-tuned models, or extra security requirements; these endpoints are available with compliance certifications like HIPAA. Pay-per-token is best-effort.","source":"docs.databricks.com/en/machine-learning/foundation-model-apis"},{"id":"Q814","cert":"GAI","domain":"Deployment","difficulty":3,"q":"You create a provisioned throughput endpoint via the REST API for a model that measures capacity in throughput bands. Which configuration is correct?","options":["Set only provisioned_model_units and POST to /api/2.0/serving-endpoints/pt","Set scale_to_zero_enabled=true and max_concurrency only","Set min_provisioned_throughput and max_provisioned_throughput on the served entity, using throughput_chunk_size from the get-model-optimization-info API to pick valid increments","Set traffic_config with 50/50 splits between two served entities"],"answer":2,"explain":"For throughput-band models you must specify min_provisioned_throughput and max_provisioned_throughput. Databricks recommends calling GET /api/2.0/serving-endpoints/get-model-optimization-info/{model}/{version}, which returns throughput_chunk_size, to compute valid multiples. Models measured in model units instead use provisioned_model_units with the /pt endpoint.","source":"docs.databricks.com/en/machine-learning/foundation-model-apis/deploy-prov-throughput-foundation-model-apis"},{"id":"Q815","cert":"GAI","domain":"Deployment","difficulty":1,"q":"What is Unity AI Gateway on Databricks?","options":["A governance control plane built on Unity Catalog that controls which AI services teams use, routes and manages AI traffic (rate limits, budgets, failover), applies guardrails, and monitors usage","A physical network appliance for private model hosting","A model fine-tuning service for open-source LLMs","A replacement for Model Serving that only proxies OpenAI requests"],"answer":0,"explain":"Unity AI Gateway is the Databricks governance solution for enterprise AI, built on Unity Catalog. It extends governance to runtime interactions between models, agents, MCP servers, and tools: access control via UC securables, traffic routing with rate limits/budgets/fallbacks, service policies (guardrails), and usage/cost monitoring from one control plane.","source":"docs.databricks.com/en/ai-gateway"},{"id":"Q816","cert":"GAI","domain":"Deployment","difficulty":3,"q":"Which statement about configuring rate limits in Unity AI Gateway is correct?","options":["Rate limits apply to all users, including those without permission to query the service","Rate limits can only be defined at the individual user level","Token-per-minute limits are enforced identically on MCP services and model services","Model services support requests-per-minute (QPM) and tokens-per-minute (TPM) limits, while MCP services support QPM limits only"],"answer":3,"explain":"Model services can set both QPM and TPM limits; MCP services only support QPM because token-based limits don't apply. Rate limits apply only to users with permission to query the service, can be set at service, per-user default, and custom (user/service-principal or group) levels, with a maximum of 20 rate limits per service.","source":"docs.databricks.com/en/ai-gateway/rate-limits"},{"id":"Q817","cert":"GAI","domain":"Deployment","difficulty":3,"q":"A client exceeds its configured Unity AI Gateway rate limit, and the principal has both a request-based (QPM) and a token-based (TPM) limit. What behavior does Databricks document?","options":["The request succeeds but is logged for review, and traffic is shaped transparently","The service returns HTTP 429 (Too Many Requests); clients should implement retry with exponential backoff, and when both limit types apply, the more restrictive limit is enforced","The request is queued until capacity recovers, so clients never see errors","The endpoint automatically scales up its compute to absorb the burst"],"answer":1,"explain":"When a rate limit is exceeded, the service returns HTTP 429 and clients should retry with exponential backoff. If a user or service principal has both a request-based and token-based limit, the more restrictive one is enforced. The service-level limit is a global maximum that blocks all traffic when exceeded.","source":"docs.databricks.com/en/ai-gateway/rate-limits"},{"id":"Q818","cert":"GAI","domain":"Deployment","difficulty":2,"q":"You call agents.deploy(uc_model_name, version) from the databricks.agents SDK to deploy a registered agent. Which of the following is NOT something deploy() does by default?","options":["Creates a model serving endpoint with automatic scaling and load balancing","Provisions short-lived credentials so the agent can access Databricks-managed resources like AI Search indexes and Unity Catalog functions","Enables the Review App, real-time MLflow tracing, and inference tables","Requires you to manually build and push a Docker image and configure a Spark cluster for the agent"],"answer":3,"explain":"deploy() automatically creates the serving endpoint, provisions secure short-lived authentication for Databricks-managed resources, enables the Review App for stakeholder feedback, real-time tracing to an MLflow experiment, (beta) production monitoring, and inference tables. No manual Docker/Spark cluster management is required.","source":"docs.databricks.com/en/agents/custom-agents/model-serving/deploy-agent"},{"id":"Q819","cert":"GAI","domain":"Deployment","difficulty":2,"q":"You call deploy() again with the same Unity Catalog model name (a new model version) as an existing agent deployment. What happens?","options":["The existing endpoint is deleted and recreated from scratch, causing downtime","The deploy fails until you manually delete the old model version","The new version is added to the existing serving endpoint and traffic shifts to it once ready, while the previous version keeps serving during the rollout","Traffic is split 50/50 permanently between the old and new versions"],"answer":2,"explain":"Calling deploy() with the same UC model name adds the new model version to the existing serving endpoint; traffic shifts after it is ready and the previous version continues serving during rollout, so updates do not interrupt in-flight traffic. For zero-downtime deployments, change only the UC model version.","source":"docs.databricks.com/en/agents/custom-agents/model-serving/deploy-agent"},{"id":"Q820","cert":"GAI","domain":"Deployment","difficulty":3,"q":"Where do real-time traces from a deployed agent's serving endpoint go, and what caveat applies?","options":["They write to the currently active MLflow experiment (set with mlflow.set_experiment()); if the experiment is associated with a Databricks Git folder, real-time tracing does not work by default","They are emailed to the endpoint creator every hour","They write only to the agent's Unity Catalog model version metadata","They are stored locally on the cluster's file system and lost after restart"],"answer":0,"explain":"Real-time tracing logs all agent interactions to the currently active MLflow experiment set with mlflow.set_experiment(); all agents in the endpoint share the same experiment, and traces also write to inference tables. Deploying from a notebook stored in a Git Folder breaks real-time tracing unless you set a non-Git-associated experiment first.","source":"docs.databricks.com/en/agents/custom-agents/model-serving/deploy-agent"},{"id":"Q821","cert":"GAI","domain":"Deployment","difficulty":2,"q":"A model serving endpoint fails while initializing — the container is being built and the endpoint appears stuck in 'Not Ready'. Which logs should you inspect first?","options":["The cluster's Spark event log","Model server container build logs, which capture the setup phase (downloading the model, installing dependencies, configuring the runtime)","The Unity Catalog audit log","Model server logs, which only capture runtime prediction traffic"],"answer":1,"explain":"Databricks provides two log types: container build logs (generated during endpoint initialization) are used to debug why an endpoint failed to start or is stuck during deployment; model server logs (generated at runtime) are used for prediction/query failures. Both are visible in the endpoint's Logs tab.","source":"docs.databricks.com/en/machine-learning/model-serving/manage-serving-endpoints"},{"id":"Q822","cert":"GAI","domain":"Deployment","difficulty":1,"q":"When should you log your model with a custom MLflow pyfunc model instead of a built-in MLflow flavor?","options":["Only when serving on GPU workload types","Only when the model is a scikit-learn model","When you have a custom model or need extra steps before or after inference","Never — Model Serving does not support pyfunc models"],"answer":2,"explain":"Databricks documents three logging techniques: autologging (easiest, less control), MLflow built-in flavors, and custom logging with pyfunc — used when you have a custom model or need extra pre/post-processing steps around inference. Model Serving fully supports MLflow pyfunc models.","source":"docs.databricks.com/en/machine-learning/model-serving/model-serving-intro"},{"id":"Q823","cert":"GAI","domain":"Deployment","difficulty":3,"q":"You want to programmatically retrieve a serving endpoint's OpenAPI query schema via GET /api/2.0/serving-endpoints/{name}/openapi. What are the requirements?","options":["Only endpoint CAN_MANAGE permission and a stopped endpoint","Inference tables must be enabled on the endpoint","The endpoint must serve at least two model versions","The served model must have a model signature logged, and the endpoint must be in a READY state"],"answer":3,"explain":"To get the model serving endpoint schema (an OpenAPI-spec JSON describing request/response formats), the served model must have a model signature logged and the endpoint must be READY. This is a key reason to always log signatures (and input examples) with MLflow.","source":"docs.databricks.com/en/machine-learning/model-serving/manage-serving-endpoints"},{"id":"Q824","cert":"GAI","domain":"Deployment","difficulty":2,"q":"How does Databricks describe short-term memory for agents backed by Lakebase?","options":["It captures context within a single conversation session using thread IDs and checkpointing, letting agents answer follow-ups with awareness of earlier turns","It extracts and stores key insights across multiple conversations to build a user knowledge base","It stores embeddings of all workspace documents for RAG","It is a Redis-compatible cache that expires after 24 hours"],"answer":0,"explain":"Lakebase is a fully managed Postgres backend for agent state and memory. Short-term memory captures context within a single conversation session using thread IDs and checkpointing; long-term memory extracts and stores insights across multiple conversations for personalization. Lakebase-backed memory works on Databricks Apps and Model Serving (with LangGraph time travel).","source":"docs.databricks.com/en/oltp/projects/state-management"},{"id":"Q825","cert":"GAI","domain":"Deployment","difficulty":2,"q":"What is an MCP Service in Databricks?","options":["A Databricks-hosted model registry for prompt templates","A Unity Catalog securable that registers an external MCP server, addressed by its three-level name (catalog.schema.mcp_service) and invoked through the Unity AI Gateway URL with EXECUTE permission","A Spark connector for streaming tool calls","A feature store table that caches tool outputs"],"answer":1,"explain":"An MCP Service is a Unity Catalog securable registering an external MCP server. Agents call it by its three-level name via its Unity AI Gateway URL; the gateway checks EXECUTE permission, applies tool selection and service policies, proxies with managed credentials, and logs usage to system tables.","source":"docs.databricks.com/en/agents/mcp-tools/mcp-services"},{"id":"Q826","cert":"GAI","domain":"Deployment","difficulty":1,"q":"How do you give an agent access to a Databricks-provided MCP Service such as the GitHub or Slack connector?","options":["Host the MCP server yourself on a dedicated VM and register its IP allowlist","Create a Unity Catalog HTTP connection with a service account key for each user","Grant EXECUTE on the built-in service (e.g., system.ai.github); no server to host and no connection to create","Add the tool's API key as an environment variable on the serving endpoint"],"answer":2,"explain":"Databricks provides ready-to-use MCP Services in the system.ai schema (slack, github, atlassian, google_drive, google_calendar, gmail, microsoft_365). You grant EXECUTE on the service — zero setup, no connection required. They ship with platform-managed tools and a built-in service policy (e.g., blocking write operations).","source":"docs.databricks.com/en/agents/mcp-tools/mcp-services"},{"id":"Q827","cert":"GAI","domain":"Deployment","difficulty":1,"q":"You need to run LLM batch inference over millions of rows in a Delta table directly from SQL. Which Databricks capability is designed for this?","options":["The Review App batch export feature","mlflow.deployments predict() with a for-loop in a driver notebook","Exporting the table to CSV and calling the provider's API","The ai_query SQL function (AI Functions), using AI Functions optimized models for batch inference workloads"],"answer":3,"explain":"AI Functions let you invoke model inference directly from SQL using ai_query, passing a serving endpoint or model name and a request expression per row. Databricks recommends AI Functions optimized models for batch inference workloads, and you can deploy batch inference pipelines around them.","source":"docs.databricks.com/en/large-language-models/batch-inference-pipelines"},{"id":"Q828","cert":"GAI","domain":"Deployment","difficulty":2,"q":"An engineer queries a deployed agent on Databricks Apps using a Personal Access Token (PAT) and gets a 302 redirect error. What is the correct fix?","options":["Use a Databricks OAuth token instead (e.g., from `databricks auth token`); querying agents deployed to Apps requires OAuth, and PATs result in a 302 redirect","Increase the endpoint's min_provisioned_concurrency","Re-register the agent in Unity Catalog with a new version","Disable authentication on the app in databricks.yml"],"answer":0,"explain":"You must use a Databricks OAuth token to query agents deployed to Databricks Apps; using a PAT results in a 302 redirect error. Obtain a token with `databricks auth token` and pass it as a Bearer token. (Model Serving endpoints themselves authenticate with a Databricks API token or OAuth.)","source":"docs.databricks.com/en/agents/custom-agents/debug-agent"},{"id":"Q901","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"A team is building a RAG application over thousands of PDF product manuals. According to Databricks guidance for unstructured data pipelines, what is the correct high-level order of the major pipeline stages?","options":["Ingest raw documents, embed them whole, chunk the embeddings, then parse the chunks before indexing","Ingest raw documents, parse and clean them, enrich/filter/deduplicate, chunk, embed the chunks, and create a vector index","Chunk the raw files first, parse the chunks, embed, index, and finally ingest everything into a Delta table","Create the vector index first, then ingest, parse, chunk, and embed documents as user queries arrive"],"answer":1,"explain":"The documented pipeline order is: corpus ingestion -> preprocessing (parsing, enrichment, deduplication, filtering) -> chunking -> embedding -> indexing and storage. Embedding happens after chunking, and indexing is the final stage.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q902","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"Which statement correctly describes the databricks-bge-large-en foundation model endpoint?","options":["It produces 768-dimensional vectors with an 8192-token embedding window","It produces 1024-dimensional vectors and natively supports over 100 languages","It maps English text to a 1024-dimensional normalized embedding with a 512-token embedding window","It produces 1024-dimensional non-normalized vectors with an 8192-token window"],"answer":2,"explain":"BAAI General Embedding (BGE) maps any text to a 1024-dimension embedding vector with an embedding window of 512 tokens; the endpoint serves the English version and generates normalized embeddings. GTE Large (En) is the 8192-token, non-normalized counterpart.","source":"docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models"},{"id":"Q903","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"Databricks best practice says raw source data for a RAG pipeline should be ingested and stored in a target table before processing. What is the primary reason?","options":["It preserves the original data for traceability and auditing, and lets you reprocess it later without re-fetching sources","It guarantees lower query latency at inference time","It automatically creates the vector index directly from the raw documents","It removes the need for chunking in downstream stages"],"answer":0,"explain":"As a best practice, raw source data should be ingested and stored in a target table; this ensures data preservation, traceability, and auditing, and supports scalable incremental ingestion.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q904","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A team splits manuals into chunks of exactly 512 characters using a character splitter. Retrieval quality is poor: chunks mix unrelated topics and cut sentences mid-thought. What does Databricks guidance say about fixed-size chunking?","options":["Fixed-size chunking is the recommended default for production RAG pipelines","Fixed-size chunking fails because it requires labeled training data","Splitting by an arbitrary number of characters or tokens is quick and easy to set up, but typically does not produce consistent semantically coherent chunks, and this approach rarely works for production-grade applications","Fixed-size chunking only works when it is combined with keyword-based search"],"answer":2,"explain":"Fixed-size chunking is fast to implement but rarely works for production-grade applications because chunk boundaries ignore semantic structure. Paragraph-based, format-specific, or semantic chunking strategies better preserve semantic coherence.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q905","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"When tuning chunk size for a RAG pipeline, which trade-off must the team balance?","options":["Smaller chunks may focus on specific details but lose surrounding contextual information; larger chunks may capture more context but can include irrelevant information and be computationally expensive","Smaller chunks are always more accurate and cheaper, so the smallest size is best","Larger chunks always improve retrieval precision while lowering cost","Chunk size has no impact on retrieval quality, only on storage consumption"],"answer":0,"explain":"Chunk size is an explicit trade-off documented by Databricks: smaller chunks focus on details but lose context; larger chunks capture more context but may contain irrelevant information and cost more to process.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q906","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"Why do Databricks RAG pipeline guidelines recommend including some overlap between adjacent chunks?","options":["Overlap reduces the total number of tokens sent to the embedding model","Overlap preserves continuity and context across chunk boundaries, so important information that would otherwise be split between chunks is not lost","Overlap is required for the AI Search index to stay in sync","Overlap removes the need for metadata extraction"],"answer":1,"explain":"Including overlap between adjacent chunks ensures continuity and context preservation across chunks, which can improve retrieval results.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q907","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"A corpus contains long consulting reports in which each section switches topics abruptly, with few natural paragraph boundaries. The team wants chunks aligned to topic shifts and is willing to invest more processing effort. Which chunking strategy fits best?","options":["Fixed-size chunking with 256-character chunks","Splitting only on markdown headers","Deduplicating the reports with MinHash, then embedding whole documents","Semantic chunking, which uses techniques such as topic modeling to identify semantically coherent boundaries based on topic shifts"],"answer":3,"explain":"Semantic chunking analyzes content/structure to determine chunk boundaries based on topic shifts. It is more involved than basic approaches but creates chunks aligned with the natural semantic divisions of the text.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q908","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A pipeline embeds chunks with databricks-bge-large-en, but some chunks are roughly 900 tokens. What happens and what should the team do?","options":["The endpoint returns a hard error and the pipeline job fails immediately","Chunks exceeding the model's 512-token maximum are truncated and can lose important information, so chunks should be kept within the limit or a model with a larger window (e.g., gte-large-en with 8192 tokens) should be chosen","The model automatically splits long chunks into multiple separate embeddings","Long chunks are embedded but produce 2048-dimensional vectors that break the index schema"],"answer":1,"explain":"Know the maximum token limit of your embedding model: if chunks exceed it they are truncated, potentially losing important information. bge-large-en-v1.5 has a 512-token limit; gte-large-en supports 8192 tokens.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q909","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"Chunks in the data pipeline were embedded with databricks-gte-large-en. At query time, which model must transform the user's retrieval query?","options":["Any general-purpose chat LLM, since all embeddings are interchangeable","databricks-bge-large-en, because all Databricks embedding models are normalized","The same embedding model that was used to embed the chunks in the data pipeline (gte-large-en)","The generation LLM, so the query and the answer share a representation"],"answer":2,"explain":"The retrieval query is transformed at query time using the same embedding model used to embed chunks in the data pipeline; mixing models makes vector comparisons meaningless.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q910","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A support bot receives queries like \"what does model HD7-8D do?\", where HD7-8D is an exact product SKU. Pure semantic search keeps missing the right manuals. What does Databricks recommend?","options":["Increase chunk size to 2,000 tokens so the SKU appears in more chunks","Fine-tune the embedding model on the SKU catalog","Disable retrieval and answer from the LLM's parametric knowledge","Use keyword-based or hybrid search, which handles exact identifiers and terms such as SKUs that are not well suited to pure similarity search"],"answer":3,"explain":"Keyword/hybrid search is recommended when source data has unique keywords such as SKUs or identifiers that are not well suited to pure semantic similarity search; hybrid search runs both and combines scores (e.g., via reranking).","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q911","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A team wants metadata filtering so that \"reports from 2023\" only searches 2023 documents. Per Databricks RAG guidance, what must be in place end-to-end?","options":["Only a change to the prompt template telling the LLM to ignore other years","Filter extraction in the query-understanding step, relevant metadata fields captured for each chunk in the data pipeline, and a retrieval step implemented to accept and apply the extracted filters","A separate vector index created for every document type","Hybrid search with reciprocal rank fusion enabled"],"answer":1,"explain":"Metadata filtering must be done in conjunction with changes to both query understanding (filter extraction) and metadata extraction in the data pipeline; the retrieval step must then apply the filters.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q912","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"A corpus assembled from multiple shared drives contains exact and near-duplicate documents. Which Databricks-recommended technique identifies near-duplicates based on document content?","options":["Locality-sensitive hashing with MinHash (Jaccard distance), available in Spark ML, followed by a similarity join to find and filter duplicates","Exact-string grouping on the file name column only","Embedding each document and clustering with k-means on 2 dimensions","Sorting documents by modification timestamp and keeping only the newest half"],"answer":0,"explain":"MinHash creates a hash per document based on the words it contains; similarity joins on those hashes efficiently identify duplicates and near duplicates. Highly redundant chunks left in the index degrade application performance.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q913","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"According to Databricks guidance for selecting an LLM for a RAG chain, what is the recommended starting approach?","options":["Always pick the largest closed-source model available, since capability is all that matters","Fine-tune a small model before measuring any baseline quality","Start with smaller, lightweight (often open-source) models and scale up only if evaluation shows quality gaps on cost, latency, and quality metrics","Route every step of the chain through the same frontier model for consistency"],"answer":2,"explain":"Start small and scale up as needed: smaller open-source alternatives can deliver satisfactory results at lower cost and faster inference times; monitor quality, latency, and cost as you change models.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q914","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A RAG chain includes a query-understanding step (classifying intent into a few categories) plus a final answer-generation step. What does Databricks recommend about model choice for these steps?","options":["Use the same expensive general-purpose model for every call to keep behavior consistent","Consider using different models for different steps: a more expensive general-purpose model may be overkill for tasks like determining the intent of a user query","Use the embedding model to perform intent classification","Only one LLM call per chain is ever allowed in production"],"answer":1,"explain":"When multiple chain steps need LLMs, consider different models per step; large general-purpose models are often overkill for simple tasks like intent classification, and task-specific smaller models can cut cost and latency.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q915","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"A compliance Q&A bot must give consistent, factually grounded answers from retrieved policy documents. How should the temperature parameter be set?","options":["Set temperature low (near 0) to reduce the randomness of generated text and make factual outputs more deterministic","Set temperature to 1.5 to maximize creative variety in answers","Temperature has no effect on factual consistency","Set temperature high so the model explores more sources during retrieval"],"answer":0,"explain":"Adjusting temperature controls the randomness of generated text. For factual, consistent outputs grounded in retrieved documents, use a low temperature; high values increase variety and hallucination risk.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q916","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"Which statement about the top_p (nucleus sampling) parameter is correct for Foundation Model APIs?","options":["top_p sets the maximum number of tokens in the model's response","top_p must always be set equal to the temperature value","top_p restricts how many retrieved chunks enter the prompt","top_p limits sampling to the smallest set of tokens whose cumulative probability exceeds the threshold; like temperature, a lower top_p makes output more focused and deterministic"],"answer":3,"explain":"top_p (nucleus sampling) and temperature both control the randomness of generated text; lower top_p restricts sampling to more probable tokens, yielding more focused output. max_tokens, not top_p, controls response length.","source":"docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference"},{"id":"Q917","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"When adding few-shot examples to a RAG prompt template, what does Databricks recommend?","options":["Build examples from query types the chain struggles with, create gold-standard responses for them, and cover a diverse, representative range of expected inference-time queries","Include as many examples as fit in the context window, regardless of diversity","Use random raw chat logs without reviewing their quality","Fine-tune the few-shot examples into the model before deploying"],"answer":0,"explain":"A useful way to build few-shot examples is to identify query types your chain struggles with, create gold-standard responses, and ensure examples are representative and diverse so the model generalizes to expected queries.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q918","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A team considers Chain-of-Thought (CoT) prompting for every query in a latency-sensitive support bot. What is the correct guidance?","options":["CoT is required for all production prompts regardless of query type","Consider CoT for complex, multi-step, or open-ended queries where direct answers are not readily apparent; for simple factual lookups it mainly adds latency and tokens without benefit","CoT only works when temperature is above 1.0","CoT prompting replaces the need for retrieval"],"answer":1,"explain":"Databricks guidance: for complex queries where direct answers aren't readily apparent, consider CoT, which breaks complicated questions into simpler sequential steps. It is not needed for simple queries and increases token usage/latency.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q919","cert":"GAI","domain":"Design & Data Prep","difficulty":1,"q":"In a chat completion request to a Foundation Model APIs endpoint, what is the purpose of separating the 'system' role from the 'user' role?","options":["The system role contains the retrieved documents, and the user role contains the embeddings","They are interchangeable; the API merges them into one string","The user role defines the assistant's persona, and the system role carries the question","The system message sets the assistant's behavior, role, and instructions (e.g., \"You are a helpful assistant\"), while the user message carries the actual request or question"],"answer":3,"explain":"In the OpenAI-compatible chat API used by Databricks, the system message defines the assistant's persona and instructions that shape all responses, while user messages carry each individual request.","source":"docs.databricks.com/aws/en/large-language-models/llm-serving-intro"},{"id":"Q920","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"Which post-processing/guardrail approach does Databricks suggest for defending against hallucinations in a RAG application?","options":["Silently return the raw retrieved chunks with no generated answer","Increase temperature so the model hedges its answers","Cross-reference the generated output with the retrieved documents and/or use an additional LLM to validate factual accuracy, with fallback mechanisms such as alternative responses or disclaimers","Train the embedding model on hallucinated examples so it recognizes them"],"answer":2,"explain":"Hallucination defense can be implemented as a post-processing step: cross-reference outputs with retrieved documents, use additional LLMs to validate factual accuracy, and build fallback mechanisms (alternative responses, disclaimers, human escalation).","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q921","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"Per the Databricks agent development lifecycle, what does evaluation-first design require a team to do before building?","options":["Deploy to production first and let real user feedback define the quality metrics","Align with stakeholders on use case, scope, and success criteria (accuracy, tone, citations, latency, cost) and failure modes, then build an evaluation set of representative questions with optional ground-truth answers to drive MLflow Evaluation and LLM judges","Write the production prompt first and never modify it afterward","Skip evaluation for RAG applications because retrieval guarantees correctness"],"answer":1,"explain":"Lifecycle phase 1 is understanding use case, scope, and success metrics, including what defines a good/bad response and production constraints. Evaluation sets (representative questions + optional ground truth) with MLflow Evaluation and LLM judges then power the measure-understand-improve loop.","source":"docs.databricks.com/aws/en/agents/agents-dev-lifecycle"},{"id":"Q922","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"Product documentation changes weekly and must be reflected in answers immediately; the team also wants the bot to adopt the company's house writing style. Which design follows Databricks guidance?","options":["Use RAG over the live documentation table for fresh, citable facts (re-indexing keeps answers current) and handle tone via prompting; fine-tuning is better suited to stable style/behavior or domain vocabulary, not rapidly changing knowledge","Fine-tune the LLM every week on the new documentation to refresh its knowledge","Fine-tune once on old documentation and disable retrieval","Paste the full documentation set into the system prompt of every request"],"answer":0,"explain":"Frequently changing knowledge is the classic RAG use case: updates flow in by re-processing and re-indexing data. Fine-tuning targets stable behavior, style, format, or domain-specific terminology; embedding fine-tuning is explicitly a last resort after cheaper optimizations.","source":"docs.databricks.com/aws/en/vector-search/vector-search-retrieval-quality"},{"id":"Q923","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A RAG corpus mixes English, Chinese, and German support articles, all embedded with databricks-bge-large-en. Non-English retrieval quality is poor. Why?","options":["The AI Search index rejects non-English text at sync time","The chunks are too small for multilingual data","bge-large-en serves the English version of the model; a multilingual corpus calls for a multilingual embedding model (e.g., Qwen3-Embedding supporting 100+ languages), and storing original-language metadata can help filtering","Multilingual documents must be machine-translated by the LLM before indexing"],"answer":2,"explain":"The databricks-bge-large-en endpoint serves the English version of BGE. For multilingual corpora, select an embedding model trained on those languages (Qwen3-Embedding covers 100+ languages); contextual metadata such as original language also aids retrieval.","source":"docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models"},{"id":"Q924","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"How do the medallion (bronze/silver/gold) layers typically map to a RAG data preparation pipeline on Databricks?","options":["Bronze holds the embeddings, silver holds raw PDFs, and gold holds prompt templates","All chunking, embedding, and raw storage happen together in gold","Bronze stores the vector index; silver and gold store evaluation sets","Bronze stores ingested raw documents; silver holds parsed, cleaned, deduplicated chunks enriched with metadata; gold holds the embedded Delta table that backs the AI Search index"],"answer":3,"explain":"Raw source data is ingested and stored first (bronze), then parsed, cleaned, deduplicated, filtered, and chunked with metadata (silver), and finally embedded into the Delta table that backs an AI Search index for low-latency similarity queries (gold).","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-data-pipeline-rag"},{"id":"Q925","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A company must stop credit card numbers and Social Security numbers from leaking through its LLM application's prompts and responses. Which Databricks capability directly addresses this?","options":["Increasing chunk overlap in the data pipeline","Setting temperature to 0 on the serving endpoint","AI Gateway PII detection on model serving endpoints, which can Block or Mask detected PII in requests and responses (Presidio-based categories include credit cards, emails, phone numbers, bank accounts, and SSNs)","Disabling the usage tracking system tables"],"answer":2,"explain":"AI Gateway guardrails include PII detection that can block or mask PII such as names, addresses, and credit card numbers in endpoint requests and responses. It uses Presidio with primarily U.S. PII categories, so additional protections may still be needed.","source":"docs.databricks.com/aws/en/ai-gateway/configure-ai-gateway-endpoints"},{"id":"Q926","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"A platform team wants the data assets that feed its RAG agents (tables, AI Search indexes, UC functions) to be discoverable, access-controlled, and reusable across teams. What does Databricks provide for this?","options":["Unity Catalog governance: agent data assets and tools are governed and versioned in Unity Catalog with grants controlling access, and Data Classification can automatically classify and tag sensitive data to drive controls such as attribute-based access control","Store everything in workspace-local notebooks with no central catalog","Rely on per-user personal access tokens as the only access control","Copy the assets into each team's scratch directory for isolation"],"answer":0,"explain":"In the agent development lifecycle, data assets and tools (AI Search indexes, UC Functions, tables) are governed and versioned in Unity Catalog, making them discoverable and reusable. Data Classification automatically tags sensitive data to support governance.","source":"docs.databricks.com/aws/en/agents/agents-dev-lifecycle"},{"id":"Q927","cert":"GAI","domain":"Design & Data Prep","difficulty":3,"q":"A RAG app retrieves 40 chunks of ~1,500 tokens each for every query, and the LLM now produces degraded answers on very long inputs. Which context-window management approach follows Databricks guidance?","options":["Send only the first 10 chunks regardless of relevance","Truncate the user question to a few tokens","Increase temperature so the model copes with long prompts","Retrieve fewer, better-targeted chunks: tune chunk size, apply metadata filtering, and/or rerank results (e.g., with a cross-encoder) so only the most relevant content enters the prompt, keeping retrieved data within the LLM's context while minimizing distracting information"],"answer":3,"explain":"Chunking exists so retrieved data fits in the LLM's context while minimizing distracting or irrelevant information. Reranking prioritizes the most relevant chunks given the query, and metadata filtering narrows the search space, together controlling prompt length.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"Q928","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"A support bot's query-understanding step must classify intent, extract entities, and rewrite the query. The team tried one giant prompt doing all three and gets mediocre results. What does Databricks advise?","options":["Keep everything in a single prompt but make it even longer and more detailed","Remove query understanding entirely and pass raw user text to retrieval","Perform entity extraction with the embedding model instead of an LLM","Break the logic into multiple focused LLM calls (e.g., intent classification, then entity extraction, then rewriting); it adds some latency but allows finer-grained control and often better retrieval quality"],"answer":3,"explain":"Databricks notes it is a generally applicable rule of thumb not to pack many complex logic steps into a single prompt: multiple LLM calls can yield better, more controllable results at the cost of some added latency.","source":"docs.databricks.com/aws/en/agents/tutorials/ai-cookbook/quality-rag-chain"},{"id":"QA01","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"A GenAI engineer is testing a RAG chatbot in a Databricks notebook using MLflow 2-style Agent Evaluation. Which mlflow.evaluate() parameter enables the Databricks agent evaluator that runs built-in LLM judges?","options":["evaluator=\"llm_judge\" together with framework=\"rag\"","model_type=\"databricks-agent\"","agent_framework=\"databricks-rag\"","evaluator_config={\"judges\": \"all\"}"],"answer":1,"explain":"Passing model_type=\"databricks-agent\" to mlflow.evaluate() enables Agent Evaluation, which applies built-in LLM judges (correctness, groundedness, safety, etc.) and returns per-row assessments plus aggregate quality, cost, and latency metrics. There is no 'llm_judge' evaluator or agent_framework parameter.","source":"docs.databricks.com/aws/en/agents/agent-evaluation"},{"id":"QA02","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"Which built-in LLM judge checks whether the agent's response is supported by the retrieved context rather than containing unsupported or invented information?","options":["groundedness","correctness","safety","chunk_relevance"],"answer":0,"explain":"groundedness judges whether the response is grounded in retrieved_context (required inputs: request, response, retrieved_context). correctness compares the response to a ground-truth expected_response, safety checks for harmful content, and chunk_relevance evaluates whether retrieved chunks are relevant to the request.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA03","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"Your team wants the built-in correctness judge to score agent responses during an evaluation run. Which field must the evaluation set include?","options":["retrieved_context","guidelines","expected_response","trace"],"answer":2,"explain":"The correctness judge requires request, response, and expected_response (ground truth). retrieved_context is needed for groundedness, guidelines for guideline_adherence, and a trace for cost/latency metrics.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA04","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"According to Databricks best practices, which three characteristics describe a good evaluation set (golden set) for a GenAI application?","options":["Static, minimal, and fully machine-generated","Adversarial-only, encrypted, and versioned weekly","As large as possible, random, and produced by the model itself","Representative, challenging, and continually updated"],"answer":3,"explain":"A good evaluation set is representative (reflects the range of production requests), challenging (includes difficult, diverse cases), and continually updated as usage patterns change. Databricks also recommends treating each sample like a unit test and including adversarial cases from malicious users.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/evaluation-set"},{"id":"QA05","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"AI Guardrails are enabled on a model serving endpoint. What happens when an incoming request violates a configured guardrail?","options":["The request is logged and forwarded to the model provider unchanged","The request is blocked and a default message is returned to the user","The endpoint automatically scales down and pauses traffic","The request is retried after automatic PII redaction"],"answer":1,"explain":"AI Guardrails enforce data compliance at the model serving endpoint level; bad requests and responses are blocked and a default message is returned to the user. Guardrails are not a redaction-and-retry mechanism.","source":"docs.databricks.com/aws/en/ai-gateway/overview-serving-endpoints"},{"id":"QA06","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"In Unity Catalog, how are AI assets such as registered models, SQL functions used as agent tools, and AI Search (vector) indexes governed?","options":["Only through workspace-level notebooks and job permissions","They must be exported to an external metastore before permissions apply","They are securable objects under the catalog.schema.object namespace, governed with the same permission model as tables","Only serving endpoints are governed; the underlying assets are not"],"answer":2,"explain":"Unity Catalog governs data and AI assets (tables, views, volumes, functions, models, and services) as securable objects in a three-level namespace, so the same privileges and policies used for data also govern models, functions, and vector indexes.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog"},{"id":"QA07","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"What is the primary purpose of the Databricks review app in the agent development workflow?","options":["Let stakeholders and subject-matter experts chat with a pre-production AI app and provide feedback or labels","Automatically fine-tune the underlying LLM using the collected chat logs","Deploy agents to production endpoints with traffic splitting","Generate embeddings for retrieval quality evaluation"],"answer":0,"explain":"The review app lets SMEs interact with a pre-production app, give feedback (e.g., thumbs up/down), and label traces or evaluation dataset records in labeling sessions. It is a human-in-the-loop tool, not a deployment, embedding, or fine-tuning tool.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/review-app"},{"id":"QA08","cert":"GAI","domain":"Eval & Governance","difficulty":1,"q":"Which system table, populated when AI Gateway usage tracking is enabled, captures token counts for each request to a serving endpoint?","options":["system.access.audit","system.query.history","system.lakehouse.monitoring_metrics","system.serving.endpoint_usage"],"answer":3,"explain":"Usage tracking automatically shares system.serving.endpoint_usage (token counts per request) and system.serving.served_entities (metadata for each served foundation model). Only account admins can query these tables.","source":"docs.databricks.com/aws/en/ai-gateway/configure-ai-gateway-endpoints"},{"id":"QA09","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"An evaluation set contains only request, response, and retrieved_context — no ground truth. Which retrieval judge runs to check whether at least one retrieved chunk is relevant to the request?","options":["context_sufficiency","chunk_relevance","correctness","guideline_adherence"],"answer":1,"explain":"Without ground truth, chunk_relevance judges whether there is at least one relevant chunk for the request. context_sufficiency requires expected_response (ground truth) and judges whether the retrieved context contains enough information to produce the expected answer.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA10","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"When ground truth IS provided in the evaluation set, in which order does Agent Evaluation determine the root cause of a row that fails overall quality?","options":["safety → correctness → groundedness → context_sufficiency","correctness → relevance_to_query → safety → guideline_adherence","context_sufficiency → groundedness → correctness → safety → guideline_adherence","chunk_relevance → groundedness → relevant_to_query → safety"],"answer":2,"explain":"With ground truth, the root cause is the first failing judge in the order context_sufficiency → groundedness → correctness → safety → guideline_adherence (then customer-defined judges). The ordering reflects causal correlation: if the retriever missed the right chunks, the generator will likely also fail. Option D is the ordering used when ground truth is NOT provided.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA11","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"In an MLflow evaluation run, what does the aggregate metric response/llm_judged/groundedness/rating/percentage represent?","options":["The percentage of questions for which the groundedness judge rated the response as yes","The average number of grounded tokens per response","A 0-1 relevance score averaged across retrieved chunks","The number of rows that failed all judges"],"answer":0,"explain":"Metrics ending in /rating/percentage are the percentage of input questions where that judge answered yes. Chunk-level averages (e.g., retrieval/llm_judged/chunk_relevance/precision/average) use the /average suffix instead.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA12","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"You ran mlflow.evaluate() on pre-generated outputs and noticed that total_token_count and latency_seconds are missing from the results. Why?","options":["Token and latency metrics require expected_response in the evaluation set","They are only computed for external model endpoints","Unity Catalog must be enabled on the workspace","Cost and latency are extracted from MLflow traces, which were unavailable because neither the model argument nor a trace column was provided"],"answer":3,"explain":"Token counts and latency are computed from the MLflow trace. A trace is automatically generated when the model argument is included in mlflow.evaluate(), or you can provide a trace column in the evaluation dataset; without a trace, cost and latency are not calculated.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA13","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"Which code correctly runs an MLflow 3 evaluation with built-in LLM judges on a GenAI application?","options":["mlflow.evaluate(data=ds, model=agent, model_type=\"databricks-agent\")","mlflow.judges.run(data=ds, judges=[\"correctness\", \"safety\"])","mlflow.genai.evaluate(data=ds, predict_fn=agent, scorers=[Correctness(), Safety()])","mlflow.evaluate(data=ds, extra_metrics=[Correctness(), Safety()])"],"answer":2,"explain":"MLflow 3 moves evaluation to the dedicated GenAI namespace: mlflow.genai.evaluate(data, predict_fn, scorers). Option A is the MLflow 2 / Agent Evaluation pattern (model_type=\"databricks-agent\"), and extra_metrics was the MLflow 2 mechanism for adding metrics.","source":"docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/concepts/scorers"},{"id":"QA14","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"You are setting up MLflow 3 production monitoring for a customer-facing agent. Following Databricks best practices, how should you configure sampling rates?","options":["Use sample_rate=1.0 for every scorer to guarantee full coverage","Use sample_rate=1.0 for critical scorers such as safety, and lower rates (0.05-0.2) for expensive LLM judges","Use sample_rate=0.05 for safety because it is a built-in judge","Sampling rates cannot be configured; all traces are always scored"],"answer":1,"explain":"Best practices: safety and security scorers at sample_rate=1.0 for full coverage; expensive, complex LLM judges at 0.05-0.2; moderate rates (0.3-0.5) during iterative development. Sampling is set via ScorerSamplingConfig when calling .start() after registering the scorer.","source":"docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/production-monitoring"},{"id":"QA15","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"Your compliance policy requires that any prompt containing a credit card number be rejected outright rather than altered or forwarded. Which AI Gateway configuration meets this requirement?","options":["Set PII detection to Block, which blocks requests when Presidio-detected PII such as card numbers is found","Set PII detection to Mask, which forwards the request with PII replaced","Set Safety filtering to Block, since it detects all PII categories","Enable trusted entities to whitelist legitimate card numbers"],"answer":0,"explain":"AI Gateway PII detection uses Presidio to detect U.S. PII categories (credit card numbers, email addresses, phone numbers, bank account numbers, SSNs) and supports Block or Mask actions. Block rejects the offending request (a default message is returned) so the data never reaches the provider; Safety filtering targets unsafe content, not PII.","source":"docs.databricks.com/aws/en/ai-gateway/configure-ai-gateway-endpoints"},{"id":"QA16","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"What does enabling AI Gateway inference tables (payload logging) on a serving endpoint provide?","options":["Automatic fine-tuning of the served model from production traffic","Encrypted storage of model weights in Unity Catalog","A replacement for account-level system audit logs","Automatic logging of requests and responses to Unity Catalog-managed Delta tables for monitoring, debugging, and compliance audits"],"answer":3,"explain":"Inference tables automatically log request/response payloads to Delta tables managed by Unity Catalog (data lands within an hour; payloads larger than 1 MiB are not logged). They support monitoring, debugging, compliance audits, and building training or evaluation corpora — they do not replace audit logs or fine-tune models.","source":"docs.databricks.com/aws/en/ai-gateway/inference-tables-serving-endpoints"},{"id":"QA17","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"During a review app labeling session, a subject-matter expert labels agent traces. Which assessment type can be synced back to an evaluation Dataset for use in future mlflow.evaluate() runs?","options":["Feedback labels such as thumbs up / thumbs down","Free-form comments on the response","Expectation labels such as expected_facts and guidelines","All assessment types, including comments"],"answer":2,"explain":"Assessments written to traces have two types: expectation (what a correct trace should contain, e.g., expected_facts or guidelines) — these can be synced to an evaluation dataset via sync_expectations() — and feedback (thumbs up/down, free-form comments), which is a human evaluation of a particular trace, is not used with evaluation datasets, and can be read with mlflow.search_traces().","source":"docs.databricks.com/aws/en/agents/agent-evaluation/review-app"},{"id":"QA18","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"Evaluation Datasets created with the databricks-agents SDK (datasets.create_dataset) are stored how, and how is access to them controlled?","options":["As MLflow artifacts governed by experiment permissions","As Delta tables in Unity Catalog, inheriting the table's permissions","As workspace files under /Repos","As encrypted Parquet files in cloud storage governed only by IAM"],"answer":1,"explain":"Datasets are backed by Delta tables in Unity Catalog (visible in Catalog Explorer) and inherit the permissions defined by the Delta table. They are linked to an MLflow experiment and can be used directly as input to mlflow.evaluate().","source":"docs.databricks.com/aws/en/agents/agent-evaluation/review-app"},{"id":"QA19","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"A notebook must query an AI Search (vector) index that was created by another team. Which privileges are required?","options":["USE CATALOG on the catalog, USE SCHEMA on the schema, and SELECT on the index","CREATE TABLE on the schema and MODIFY on the index","BROWSE on the metastore only","Owner privileges on the vector search endpoint"],"answer":0,"explain":"Querying an index requires USE CATALOG and USE SCHEMA on the parent catalog/schema plus SELECT on the index; creating an index requires CREATE TABLE privileges on the schema. AI Search indexes appear in and are governed by Unity Catalog.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"QA20","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"Which set of requirements applies to custom code-based scorers registered for MLflow 3 production monitoring?","options":["They must subclass the built-in Scorer class and run on a dedicated cluster","They must be defined in a standalone Python file under /Workspace so they can be serialized","They may reference global variables as long as all imports are inline","They must use the @scorer decorator, be defined in a Databricks notebook, and be self-contained with imports inside the function body"],"answer":3,"explain":"The monitoring service serializes @scorer decorator-based scorer functions for remote execution: they must be defined and registered from a Databricks notebook, be self-contained (all imports inline, no references to external variables/modules, no signature type hints that require imports). Class-based Scorer subclasses cannot be registered for production monitoring.","source":"docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/production-monitoring"},{"id":"QA21","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"An evaluation set has NO ground-truth labels. Which judge ordering does Agent Evaluation use to identify the root cause of a failed row?","options":["context_sufficiency → groundedness → correctness → safety","chunk_relevance → groundedness → relevant_to_query → safety → guideline_adherence","safety → chunk_relevance → groundedness → relevance_to_query","correctness → context_sufficiency → groundedness → guideline_adherence"],"answer":1,"explain":"Without ground truth, root cause is the first failing judge in the order chunk_relevance (is there at least 1 relevant chunk?) → groundedness → relevant_to_query → safety → guideline_adherence → custom judges. context_sufficiency and correctness both require expected_response as input, so they do not appear in this path.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QA22","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"In the new Unity AI Gateway, you attach built-in service policies (guardrails) to a model service. Which statement is correct?","options":["system.ai.block_jailbreak runs on responses only","system.ai.block_hallucination runs on requests only","system.ai.block_hallucination denies hallucinated responses (responses only), while system.ai.block_jailbreak denies prompt-injection attempts on requests only","All built-in policies automatically run on both input and output phases regardless of configuration"],"answer":2,"explain":"Built-in service policies: Unsafe Content (system.ai.block_unsafe_content) applies to input and/or output; Jailbreak (system.ai.block_jailbreak) applies to requests only; Hallucination (system.ai.block_hallucination) applies to responses only. Policies have a Phase (input = before the model, output = after the model) and a Rank — the lowest rank runs first on the request and last on the response.","source":"docs.databricks.com/aws/en/ai-gateway/moderate-tutorial"},{"id":"QA23","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"An endpoint with AI Guardrails enabled serves a model that uses function calling. How are the guardrails applied?","options":["Guardrails are not applied to the requests and intermediate responses of the function, but are applied to the final output response","Guardrails are applied to every intermediate function call request and response","Enabling function calling disables AI Guardrails entirely","Guardrails are applied only to the function/tool definitions"],"answer":0,"explain":"Per documented limitations: with function calling, guardrails are not applied to the requests and intermediate responses of the function, but they are applied to the final output response. Also note output guardrails are not supported for embeddings models or streaming, and AI guardrails are not available on custom model serving endpoints.","source":"docs.databricks.com/aws/en/ai-gateway/overview-serving-endpoints"},{"id":"QA24","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"Your team stores MLflow traces in Unity Catalog tables. A service principal granted ALL_PRIVILEGES on the schema still cannot read the trace tables. Why?","options":["Trace tables can only be read by workspace administrators","Traces are only accessible through the MLflow UI, never via SQL","The principal needs OWNER on the linked MLflow experiment","Unity Catalog trace tables require explicit MODIFY and SELECT grants; ALL_PRIVILEGES is not sufficient"],"answer":3,"explain":"Reading or writing MLflow traces stored in Unity Catalog requires USE_CATALOG on the catalog, USE_SCHEMA on the schema, and explicit MODIFY and SELECT on each trace table — ALL_PRIVILEGES alone is not sufficient. Traces are stored in OpenTelemetry format in UC tables and remain linked to an MLflow experiment for viewing.","source":"docs.databricks.com/aws/en/mlflow3/genai/tracing/trace-unity-catalog"},{"id":"QA25","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"You enable multi-turn judges for production monitoring of a customer-support chatbot. How does the monitoring service group and evaluate conversations?","options":["Each turn is scored as an independent trace with no session grouping","Traces are grouped by the mlflow.trace.session tag; judges like ConversationCompleteness and UserFrustration run after the conversation is considered complete (default 5-minute inactivity buffer), and assessments are attached to the first trace in the session","Conversations are grouped by request_id and evaluated on an hourly schedule","Multi-turn judges require expected responses to be provided for every turn"],"answer":1,"explain":"The monitoring job automatically groups traces into conversations based on the mlflow.trace.session tag. A conversation is considered complete when no new traces with that session ID are ingested for 5 minutes (configurable via an environment variable). Multi-turn judges such as ConversationCompleteness and UserFrustration assess quality patterns across the whole conversation, with assessments stored on the first trace in the session.","source":"docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/production-monitoring"},{"id":"QA26","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"After editing the system prompt of a production RAG app, the team wants to verify the change did not degrade quality before deploying. What is the recommended approach?","options":["Deploy the change and watch the safety judge dashboard in production for a week","Manually read a handful of sample responses and approve if they look acceptable","Re-run evaluation against the same fixed evaluation set with the same judges/scorers and compare aggregate metrics across evaluation runs in MLflow","Fine-tune the model on the new prompt and compare training loss"],"answer":2,"explain":"The evaluation set establishes a quality benchmark: treat samples like unit tests, rerun the evaluation on each change, and compare per-run aggregate metrics (e.g., response/llm_judged/correctness/rating/percentage, average latency, token counts) across evaluation runs in the MLflow UI to detect regressions. Using the same scorers in development and production keeps results consistent.","source":"docs.databricks.com/aws/en/agents/agent-evaluation"},{"id":"QA27","cert":"GAI","domain":"Eval & Governance","difficulty":3,"q":"Which statement reflects Databricks' guidance on responsible use of LLM judges in Agent Evaluation?","options":["LLM judge outputs should not be used to train, improve, or fine-tune an LLM, and judge quality is benchmarked against human raters using agreement metrics such as Cohen's Kappa","Judge rationales are recommended as training data for fine-tuning your model","LLM judges fully replace the need for human review of AI applications","Judge scores are guaranteed to match human ratings 100% of the time"],"answer":0,"explain":"The docs explicitly state that LLM judge outputs should not be used to train, improve, or fine-tune an LLM. Databricks measures and improves judge accuracy by comparing judges to human raters using Cohen's Kappa (inter-rater agreement), accuracy, F1, and false positive/negative rates. Human feedback via the review app remains part of the quality workflow.","source":"docs.databricks.com/aws/en/agents/agent-evaluation/llm-judge-metrics"},{"id":"QB01","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"What is the primary goal of context engineering for AI agents on Databricks?","options":["Fine-tune model weights with domain data","Expand the model's raw context window via infrastructure","Design, assemble, and govern the information agents receive at inference time","Compress training datasets for faster fine-tuning"],"answer":2,"explain":"Context engineering curates what enters the agent's context (instructions, retrieved knowledge, memory, tools) under governance — it is distinct from fine-tuning or infrastructure scaling.","source":"docs.databricks.com/aws/en/agents"},{"id":"QB02","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Databricks AI Search was formerly known by which name?","options":["Databricks Vector Search","Mosaic AI Semantic Store","Delta Search","Unity Catalog Index"],"answer":0,"explain":"AI Search is the renamed Databricks Vector Search, the platform-integrated similarity search service powering RAG and retrieval.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"QB03","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Genie Agents were previously named what?","options":["Genie Warehouses","Genie Spaces","Genie Catalogs","AI/BI Assistants"],"answer":1,"explain":"Genie Agents (domain-specific trusted data environments) were formerly called Genie Spaces.","source":"docs.databricks.com/aws/en/genie-agents/set-up"},{"id":"QB04","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Hybrid search in AI Search combines which two techniques?","options":["Full-text search and image recognition","ANN search and warehouse caching","SQL aggregation and reranking","Vector similarity search and keyword search"],"answer":3,"explain":"Hybrid keyword-similarity search matches exact query words (keyword) while also capturing semantic relationships (vector similarity), useful for identifiers like SKUs.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"QB05","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"What does MCP stand for in Databricks agent tooling?","options":["Managed Compute Protocol","Multi-Context Provider","Model Context Protocol","Model Control Pipeline"],"answer":2,"explain":"MCP is the open-source Model Context Protocol standard that connects AI agents to tools, resources, and prompts; Databricks supports managed, external, and custom MCP servers.","source":"docs.databricks.com/aws/en/agents/mcp-tools"},{"id":"QB06","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Who hosts and operates Databricks managed MCP servers?","options":["Databricks hosts them and manages authentication","The customer deploys them on personal Kubernetes","Third-party vendors host them exclusively","They run only inside notebook REPLs"],"answer":0,"explain":"Managed MCP servers need no setup: Databricks hosts the servers and manages authentication, with Unity Catalog enforcing permissions.","source":"docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp"},{"id":"QB07","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"In self-managed agent memory with LangGraph, what provides short-term (within-session) memory?","options":["Unity Catalog tags","Thread IDs with checkpointing backed by Lakebase","Embedding model endpoints","MLflow experiments"],"answer":1,"explain":"Short-term memory captures context within a single conversation session using thread IDs and checkpointing, persisted durably in Lakebase.","source":"docs.databricks.com/aws/en/agents/agent-memory/self-managed-memory"},{"id":"QB08","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"What is the purpose of long-term agent memory?","options":["Cache SQL warehouse query results","Store foundation model weights","Speed up embedding generation","Store key information across sessions to personalize interactions"],"answer":3,"explain":"Long-term memory extracts and stores key information across multiple conversations, personalizing responses based on past preferences.","source":"docs.databricks.com/aws/en/agents/agent-memory/self-managed-memory"},{"id":"QB09","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"What does context compaction do when a conversation nears the context window limit?","options":["Truncates only the newest messages","Summarizes the conversation contents and restarts with that summary","Moves all history into a Delta table","Automatically raises the model token limit"],"answer":1,"explain":"Compaction summarizes a long conversation and reinitiates the context window with the high-fidelity summary so the agent can continue with minimal degradation.","source":"docs.databricks.com/aws/en/agents/concepts"},{"id":"QB10","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Lakebase is best described as which kind of Databricks offering?","options":["A vector database","A streaming ingestion engine","A fully managed Postgres OLTP database","A feature store"],"answer":2,"explain":"Self-managed agent memory uses Lakebase, a fully managed Postgres OLTP database, as the durable state store for agents.","source":"docs.databricks.com/aws/en/agents/agent-memory/self-managed-memory"},{"id":"QB11","cert":"CE","domain":"Context Engineering","difficulty":1,"q":"Where must a Genie Agent's source data be registered?","options":["Unity Catalog","The workspace local filesystem","A Hive metastore outside the metastore hierarchy","An unregistered external S3 bucket"],"answer":0,"explain":"Technical requirements state the data for a Genie Agent must be registered to Unity Catalog.","source":"docs.databricks.com/aws/en/genie-agents/set-up"},{"id":"QB12","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"When should you choose self-managed agent memory (Lakebase) over managed agent memory?","options":["When you want Databricks to handle all memory infrastructure","When you need direct SQL access to memories or a custom schema","When you only need per-user memory governed by Unity Catalog","When you never use LangGraph or the OpenAI Agents SDK"],"answer":1,"explain":"Self-managed memory is for teams needing direct SQL access (e.g., integrating with data pipelines) or custom schemas; otherwise managed agent memory is governed by Unity Catalog with less overhead.","source":"docs.databricks.com/aws/en/agents/agent-memory/self-managed-memory"},{"id":"QB13","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Which deployment target supports Lakebase-backed checkpoints with LangGraph time travel to resume or fork conversations?","options":["Databricks SQL warehouses","AI Gateway endpoints","Delta Live Tables pipelines","Model Serving endpoints"],"answer":3,"explain":"Model Serving supports agents with Lakebase-backed checkpoints, enabling LangGraph time travel to resume or fork conversations from any checkpoint.","source":"docs.databricks.com/aws/en/oltp/projects/state-management"},{"id":"QB14","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Your RAG corpus is full of SKUs and error codes that pure similarity search keeps missing. What should you enable?","options":["A larger embedding model only","Longer document chunks","Hybrid query_type combining keyword and vector search","A lower num_results setting"],"answer":2,"explain":"Hybrid search is particularly useful when source data has unique keywords such as SKUs or identifiers that are not well suited to pure similarity search.","source":"docs.databricks.com/aws/en/vector-search/vector-search-retrieval-quality"},{"id":"QB15","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"According to Databricks' AI Search retrieval quality guide, what is described as your biggest lever for retrieval quality?","options":["Metadata filtering","Increasing endpoint compute size","Disabling index sync","Using only smaller chunks"],"answer":0,"explain":"The guide calls metadata filtering the biggest lever for retrieval quality, letting queries constrain results by fields like make, model, or year.","source":"docs.databricks.com/aws/en/vector-search/vector-search-retrieval-quality"},{"id":"QB16","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Which services do Databricks managed MCP servers expose out of the box?","options":["Slack, GitHub, and Google Drive","Genie, AI Search, Databricks SQL, and Unity Catalog functions","Only Unity Catalog functions","Exclusively external partner APIs"],"answer":1,"explain":"Ready-to-use managed MCP servers give agents governed access to Genie, AI Search, Databricks SQL, and Unity Catalog functions with no server to build or host.","source":"docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp"},{"id":"QB17","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"How do you host your own custom MCP server on Databricks?","options":["As a Delta table","Inside a Genie Agent","On an all-purpose cluster","As a Databricks App"],"answer":3,"explain":"You can host a custom MCP server as a Databricks app to expose your own tools to agents.","source":"docs.databricks.com/aws/en/agents/mcp-tools"},{"id":"QB18","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"In managed MCP servers, what are _meta parameters used for?","options":["Presetting deterministic configuration in agent code","LLM-generated dynamic tool call arguments","Billing and usage tags","OAuth token refresh intervals"],"answer":0,"explain":"Tool call arguments are generated dynamically by the LLM, while _meta parameters are configuration values you preset in agent code to set behavior deterministically.","source":"docs.databricks.com/aws/en/agents/mcp-tools/managed-mcp"},{"id":"QB19","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"Per Genie best practices, how should clarification-question instructions be written?","options":["Vaguely, so the model retains flexibility","Only as SQL comments in example queries","Explicitly, defining both triggering conditions and expected clarification behavior","In an external config file the agent cannot read"],"answer":2,"explain":"Write clear, specific instructions that define when to ask clarifications and what the follow-up should be, rather than vague guidance.","source":"docs.databricks.com/aws/en/genie-agents/best-practices"},{"id":"QB20","cert":"CE","domain":"Context Engineering","difficulty":2,"q":"What distinguishes a tool from an agent in Databricks agent concepts?","options":["Tools maintain stat
