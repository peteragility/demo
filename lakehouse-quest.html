<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LAKEHOUSE QUEST v4</title>
<style>
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg;}
:root{
  --bg:#0B0B0F; --panel:rgba(22,22,30,.62); --panel2:rgba(30,30,40,.72);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --org:#FF3621; --org-dim:#a52411; --cyan:#00B5E2; --cyan-dim:#0b6d86;
  --good:#2fd66f; --bad:#ff4757; --gold:#ffc247; --text:#eceff4; --muted:#9aa3b2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;touch-action:manipulation;}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;}
#game{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;
  max-width:880px;margin:0 auto;padding:10px;transition:filter .1s,transform .1s;}
#game.shake{animation:shake .35s;}
#game.hitstop{filter:contrast(1.5) brightness(1.35) saturate(1.4);transform:scale(1.015);}
@keyframes shake{
  0%,100%{transform:translate(0,0);}
  15%{transform:translate(-10px,5px);}30%{transform:translate(9px,-6px);}
  45%{transform:translate(-7px,-4px);}60%{transform:translate(6px,4px);}
  80%{transform:translate(-4px,2px);}
}
.screen{display:none;flex-direction:column;width:100%;flex:1;min-height:0;opacity:0;transform:translateY(14px);}
.screen.on{display:flex;opacity:1;transform:translateY(0);
  animation:screenin .32s cubic-bezier(.2,.8,.3,1);}
@keyframes screenin{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
/* ---------- brick logo + titles ---------- */
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px 0 2px;filter:drop-shadow(0 0 14px rgba(255,54,33,.5));}
.logo .row{display:flex;gap:5px;}
.logo .brick{width:14px;height:8px;background:linear-gradient(180deg,#ff5a3c,var(--org));
  box-shadow:0 0 8px rgba(255,54,33,.55);}
.logo .row:nth-child(2){transform:translateX(9px);}
.logo .row:nth-child(3){transform:translateX(0);}
h1.title{font-size:clamp(20px,5vw,38px);letter-spacing:.2em;margin:6px 0 2px;font-weight:800;text-align:center;
  background:linear-gradient(90deg,var(--org) 15%,#ff8a5c 50%,var(--cyan) 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--muted);font-size:11px;letter-spacing:.22em;text-align:center;margin-bottom:10px;}
/* ---------- glass panel + glow border ---------- */
.glass{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);}
.glow{position:relative;}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:17px;padding:1.5px;
  background:conic-gradient(from var(--ga),var(--org),var(--cyan),var(--org));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;animation:spinborder 3.2s linear infinite;pointer-events:none;}
@keyframes spinborder{to{--ga:360deg;}}
/* ---------- buttons ---------- */
.btn{min-height:44px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:12px;
  padding:10px 18px;font-size:14px;font-weight:700;letter-spacing:.08em;cursor:pointer;font-family:inherit;
  transition:box-shadow .15s,border-color .15s,transform .12s;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,181,226,.35);transform:translateY(-1px);}
.btn.primary{background:linear-gradient(180deg,#c1280f,#8f1c0a);border-color:var(--org);
  color:#fff;box-shadow:0 0 16px rgba(255,54,33,.35);}
.btn.primary:hover{box-shadow:0 0 26px rgba(255,54,33,.55);}
.btn.cy{background:linear-gradient(180deg,#043a4a,#032b38);border-color:var(--cyan);color:#a8ecff;}
.btn.ghost{border-color:var(--line);color:var(--muted);}
.btn.danger{border-color:var(--bad);color:#ffb3ba;}
.btn:disabled{opacity:.5;cursor:default;transform:none;}
.topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
/* ---------- cert picker ---------- */
.certgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;width:100%;}
.certcard{display:flex;flex-direction:column;gap:8px;padding:16px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s;min-height:44px;}
.certcard:hover{transform:translateY(-4px);border-color:var(--org);
  box-shadow:0 0 24px rgba(255,54,33,.35);}
.certcard .cnames{font-size:16px;font-weight:800;letter-spacing:.06em;}
.certcard .csub{font-size:11px;color:var(--muted);letter-spacing:.05em;}
.certcard .ringrow{display:flex;align-items:center;gap:12px;}
.ringwrap{position:relative;width:74px;height:74px;flex:none;}
.ringwrap .rlab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ringwrap .rpct{font-size:16px;font-weight:900;}
.ringwrap .rword{font-size:8px;letter-spacing:.1em;color:var(--muted);}
.certcard .cmeta{font-size:11px;color:var(--muted);line-height:1.5;}
.rtag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.12em;border-radius:6px;
  padding:3px 8px;border:1px solid;}
.rtag.red{color:#ff7b86;border-color:#ff4757;background:rgba(255,71,87,.1);}
.rtag.orange{color:#ffc247;border-color:var(--gold);background:rgba(255,194,71,.1);}
.rtag.green{color:#2fd66f;border-color:#2fd66f;background:rgba(47,214,111,.1);}
/* ---------- map ---------- */
.maphead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.maphead h2{margin:0;font-size:17px;letter-spacing:.12em;font-weight:800;}
.rpanel{padding:14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.dombars{flex:1;min-width:230px;display:flex;flex-direction:column;gap:6px;}
.dbar{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;font-size:11px;}
.dbar .dl{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:2px;letter-spacing:.03em;}
.dbar .dt{color:var(--text);font-weight:600;}
.dbar .track{height:7px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;}
.dbar .fill{display:block;height:100%;border-radius:5px;width:0;transition:width .6s;
  background:linear-gradient(90deg,var(--org),var(--cyan));}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding-bottom:14px;}
.hexnode{position:relative;cursor:pointer;min-height:104px;padding:18px 16px 12px;
  clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);
  background:var(--panel2);border:none;text-align:center;
  transition:transform .14s,filter .14s;}
.hexnode:hover{transform:translateY(-3px) scale(1.03);filter:drop-shadow(0 0 14px rgba(255,54,33,.6));}
.hexnode .hname{font-size:12px;font-weight:800;line-height:1.3;letter-spacing:.03em;}
.hexnode .hmeta{font-size:10.5px;color:var(--muted);margin-top:6px;}
.hexnode .hbar{height:5px;background:rgba(255,255,255,.08);border-radius:4px;margin:8px 18px 0;overflow:hidden;}
.hexnode .hbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--org),#ff8a5c);width:0;transition:width .5s;}
.hexnode.cleared{background:linear-gradient(180deg,#0d2b1c,#0a1f15);}
.hexnode.cleared .hbar i{background:linear-gradient(90deg,#188a5e,var(--good));}
.hexnode .star{position:absolute;top:8px;right:20px;font-size:11px;color:var(--gold);text-shadow:0 0 8px rgba(255,194,71,.8);}
.scrollwrap{flex:1;min-height:0;overflow-y:auto;width:100%;}
/* ---------- battle HUD ---------- */
.bhead{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.combatrow{display:flex;gap:10px;align-items:stretch;}
.unit{flex:1;padding:10px 14px;position:relative;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
.unit .uname{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px;}
.unit .taunt{font-size:10px;color:var(--bad);letter-spacing:.05em;}
.unit.boss .uname{color:var(--bad);text-shadow:0 0 10px rgba(255,71,87,.4);}
.unit.player .uname{color:var(--cyan);}
.hpwrap{height:15px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden;margin-top:7px;position:relative;}
.hpbar{height:100%;transition:width .45s cubic-bezier(.2,.8,.3,1);}
.unit.boss .hpbar{background:linear-gradient(90deg,#7a1420,var(--bad));}
.unit.player .hpbar{background:linear-gradient(90deg,#0c5a73,var(--cyan));}
.hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.06em;}
.meterrow{display:flex;align-items:center;gap:10px;}
.meterlabel{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--gold);min-width:74px;}
.combotrack{flex:1;height:11px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
#combo-fill{display:block;height:100%;width:0;transition:width .35s;border-radius:6px;
  background:linear-gradient(90deg,var(--org),var(--gold));}
#combo-fill.armed{background:linear-gradient(90deg,var(--gold),#fff);animation:pulseglow .5s infinite alternate;}
@keyframes pulseglow{from{filter:brightness(1);}to{filter:brightness(1.8);}}
#combo-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gold);min-height:15px;}
#combo-label.od{color:#7df9ff;text-shadow:0 0 12px rgba(0,181,226,.9);animation:pulseglow .4s infinite alternate;}
.timerwrap{height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-bottom:10px;}
#timerbar{height:100%;width:100%;background:linear-gradient(90deg,var(--cyan),var(--good));}
#timerbar.mid{background:linear-gradient(90deg,var(--gold),var(--org));}
#timerbar.low{background:linear-gradient(90deg,#a33,var(--bad));}
.qcard{padding:14px;margin:10px 0;}
.qtags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:10.5px;letter-spacing:.06em;}
.tag{border:1px solid var(--cyan-dim);color:var(--cyan);border-radius:7px;padding:2px 8px;}
.tag.diff{border-color:var(--gold);color:var(--gold);}
.tag.revenge{border-color:var(--bad);color:var(--bad);}
.qtext{font-size:clamp(14px,2.6vw,17px);line-height:1.45;font-weight:600;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:560px){.opts{grid-template-columns:1fr;}}
.opt{min-height:48px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--text);
  padding:12px;font-size:14px;line-height:1.35;text-align:left;cursor:pointer;font-family:inherit;
  transition:border-color .12s,box-shadow .12s;display:flex;gap:8px;align-items:flex-start;}
.opt:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 14px rgba(0,181,226,.3);}
.opt .key{color:var(--cyan);font-weight:800;flex:none;}
.opt.right{border-color:var(--good);background:rgba(47,214,111,.12);box-shadow:0 0 16px rgba(47,214,111,.4);}
.opt.wrongpick{border-color:var(--bad);background:rgba(255,71,87,.12);box-shadow:0 0 16px rgba(255,71,87,.35);}
.opt:disabled{cursor:default;opacity:.92;}
#expanel{padding:14px;margin-top:10px;display:none;}
#expanel.on{display:block;animation:pop .25s;}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
#exverdict{font-size:15px;font-weight:800;letter-spacing:.1em;margin-bottom:8px;}
#exverdict.win{color:var(--good);}#exverdict.loss{color:var(--bad);}
#exwhy{font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
#exsrc{font-size:11px;color:var(--muted);margin-top:8px;word-break:break-all;}
.center{display:flex;justify-content:center;margin-top:10px;gap:8px;flex-wrap:wrap;}
/* ---------- fx ---------- */
.dmg{position:absolute;font-weight:900;pointer-events:none;z-index:6;text-shadow:0 0 10px currentColor;
  animation:floatup 1s forwards;}
@keyframes floatup{
  0%{transform:translateY(0) scale(.5);opacity:0;}
  15%{transform:translateY(-10px) scale(1.2);opacity:1;}
  100%{transform:translateY(-52px) scale(.95);opacity:0;}
}
.particle{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:7;opacity:.95;}
.flash{position:fixed;inset:0;background:#fff;opacity:.75;pointer-events:none;z-index:8;
  animation:fadeout .5s forwards;}
@keyframes fadeout{to{opacity:0;}}
.explode{position:absolute;inset:0;border-radius:16px;z-index:5;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,54,33,.6) 45%,transparent 75%);
  animation:boom .8s forwards;}
@keyframes boom{0%{transform:scale(.2);opacity:1;}100%{transform:scale(2.4);opacity:0;}}
/* ---------- end screens ---------- */
.endscreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px;}
.bigbadge{font-size:clamp(28px,8vw,58px);font-weight:900;letter-spacing:.12em;color:var(--gold);
  text-shadow:0 0 30px rgba(255,194,71,.6);animation:pop .4s;}
.loottitle{font-size:clamp(18px,4vw,30px);font-weight:900;letter-spacing:.2em;color:var(--cyan);
  text-shadow:0 0 22px rgba(0,181,226,.7);animation:pop .55s .15s backwards;}
.lootlabel{font-size:10px;letter-spacing:.3em;color:var(--muted);}
.endstats{color:var(--muted);font-size:13px;line-height:1.75;max-width:520px;}
.endstats b{color:var(--text);}
.gaptable{width:100%;max-width:520px;font-size:12px;border-collapse:collapse;margin-top:4px;}
.gaptable th,.gaptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;}
.gaptable th{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;}
.gaptable td.num{text-align:right;font-variant-numeric:tabular-nums;}
.pass{color:var(--good);font-weight:800;}
.fail{color:var(--bad);font-weight:800;}
/* ---------- exam ---------- */
.examprog{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.examprog .plab{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--cyan);}
.examprog .ptrack{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;}
#exam-fill{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--good));transition:width .3s;}
.examq{padding:16px;margin:10px 0;}
.examq .qnum{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="game">

  <!-- CERT PICKER -->
  <section class="screen on" id="screen-cert">
    <div class="logo" aria-hidden="true">
      <div class="row"><div class="brick"></div><div class="brick"></div><div class="brick"></div></div>
      <div class="row"><div class="brick"></div><div class="brick"></div></div>
      <div class="row"><div class="brick"></div><div class="brick"></div><div class="brick"></div></div>
    </div>
    <h1 class="title">LAKEHOUSE QUEST</h1>
    <div class="sub">CERT-PREP BOSS RUSH &middot; CHOOSE YOUR BRICK ROAD</div>
    <div class="topbar">
      <button class="btn primary" id="btn-daily">&#9728; DAILY CHALLENGE &middot; <span id="daily-streak">0</span></button>
      <button class="btn ghost" id="btn-snd">&#9834; SOUND: ON</button>
      <button class="btn ghost danger" id="btn-reset">RESET PROGRESS</button>
    </div>
    <div class="scrollwrap">
      <div class="certgrid" id="cert-cards"></div>
    </div>
  </section>

  <!-- ZONE MAP -->
  <section class="screen" id="screen-map">
    <div class="maphead">
      <h2 id="map-title">CERT</h2>
      <button class="btn ghost" id="btn-back">&#9664; CERTS</button>
    </div>
    <div class="scrollwrap">
      <div class="rpanel glass" id="readiness-panel"></div>
      <div class="center" style="justify-content:flex-start;margin-bottom:12px;">
        <button class="btn cy glow" id="btn-examsim">&#9673; EXAM SIM &middot; 20Q &middot; 70% PASS</button>
      </div>
      <div class="nodes" id="map-nodes"></div>
    </div>
  </section>

  <!-- BATTLE -->
  <section class="screen" id="screen-battle">
    <div class="bhead">
      <div class="combatrow">
        <div class="unit boss glass" id="u-boss">
          <div class="uname"><span id="boss-name">BOSS</span><span class="taunt" id="boss-taunt"></span></div>
          <div class="hpwrap"><div class="hpbar" id="boss-hpbar" style="width:100%"></div>
            <div class="hptext" id="boss-hptext">100%</div></div>
        </div>
        <div class="unit player glass" id="u-player">
          <div class="uname"><span>DATA ENGINEER</span><span class="taunt" id="player-notice"></span></div>
          <div class="hpwrap"><div class="hpbar" id="player-hpbar" style="width:100%"></div>
            <div class="hptext" id="player-hptext">100%</div></div>
        </div>
      </div>
      <div class="meterrow">
        <span class="meterlabel">COMBO</span>
        <div class="combotrack"><i id="combo-fill"></i></div>
        <span id="combo-label" style="min-width:110px;text-align:right;"></span>
      </div>
    </div>
    <div class="timerwrap"><div id="timerbar"></div></div>
    <div class="qcard glass">
      <div class="qtags" id="qtags"></div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div id="expanel" class="glass">
      <div id="exverdict"></div>
      <div id="exwhy"></div>
      <div id="exsrc"></div>
      <div class="center"><button class="btn primary" id="btn-continue">CONTINUE &#9654;</button></div>
    </div>
  </section>

  <!-- EXAM SIM -->
  <section class="screen" id="screen-exam">
    <div class="maphead">
      <h2 id="exam-title">EXAM SIM</h2>
      <button class="btn ghost" id="btn-examquit">&#10005; ABANDON</button>
    </div>
    <div class="examprog">
      <span class="plab" id="exam-count">1/20</span>
      <div class="ptrack"><i id="exam-fill"></i></div>
      <span class="plab" id="exam-timer">60s</span>
    </div>
    <div class="scrollwrap">
      <div class="examq glass">
        <div class="qnum" id="exam-qtags"></div>
        <div class="qtext" id="exam-qtext"></div>
      </div>
      <div class="opts" id="exam-opts"></div>
      <div id="exam-expanel" class="glass">
        <div id="exam-exverdict"></div>
        <div id="exam-exwhy"></div>
        <button class="btn primary" id="btn-exnext">NEXT &#9654;</button>
      </div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="screen-end">
    <div class="endscreen">
      <div class="bigbadge" id="end-title"></div>
      <div id="end-loot">
        <div class="lootlabel">LOOT EARNED</div>
        <div class="loottitle" id="end-lootname"></div>
      </div>
      <div class="endstats" id="end-stats"></div>
      <div id="end-gap"></div>
      <div class="center">
        <button class="btn primary" id="btn-revenge">&#9876; REVENGE</button>
        <button class="btn cy" id="btn-exam-again" style="display:none;">&#8635; RETAKE EXAM</button>
        <button class="btn ghost" id="btn-tomap">RETURN</button>
      </div>
    </div>
  </section>

</div>
<script>
"use strict";
/* ============ QUESTION BANK (embedded verbatim from questions.json) ============ */
var QUESTIONS = [{"id":"Q001","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"Auto Loader incrementally processes new files using which Structured Streaming source?","options":["cloudFiles","autoLoad","fileStream","deltaSource"],"answer":0,"explain":"Auto Loader provides a Structured Streaming source called `cloudFiles`. Given an input directory on cloud storage, it automatically processes new files as they arrive, optionally also processing existing files.","source":"docs.databricks.com/aws/en/ingestion/auto-loader"},{"id":"Q002","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"Which Auto Loader file detection mode is the DEFAULT?","options":["File notification mode","Directory listing mode","Event grid mode","Checkpoint mode"],"answer":1,"explain":"By default Auto Loader uses directory listing mode, but Databricks RECOMMENDS file notification mode (using file events from cloud messaging services) for most workloads — a classic exam trap reversing the two.","source":"docs.databricks.com/aws/en/ingestion/auto-loader"},{"id":"Q003","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"Which storage location is NOT natively supported as an Auto Loader source?","options":["s3:// (Amazon S3)","abfss:// (ADLS Gen2)","gs:// (GCS)","wasbs:// recommended for new workloads"],"answer":3,"explain":"Auto Loader supports S3, ADLS (abfss://), GCS (gs://), and Unity Catalog Volumes (/Volumes/). WASB (wasbs://) works but is legacy/deprecated — ABFS is recommended over WASB, so 'wasbs recommended for new workloads' is FALSE.","source":"docs.databricks.com/aws/en/ingestion/auto-loader"},{"id":"Q004","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"You need to run a streaming pipeline once per day processing all available new files, then stop. Which trigger fits?","options":["trigger(processingTime='1 hour')","trigger(availableNow=True) on Auto Loader","streaming console trigger","foreachBatch with cron"],"answer":1,"explain":"AvailableNow trigger processes all available files in micro-batches then stops cleanly — designed for scheduled/incremental batch-style runs. processingTime runs continuously at intervals.","source":"docs.databricks.com/aws/en/structured-streaming/triggers"},{"id":"Q005","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Liquid clustering replaces which legacy techniques?","options":["Partitioning and ZORDER","OPTIMIZE and VACUUM","Caching and indexing","Data skipping only"],"answer":0,"explain":"Liquid clustering is a data layout technique that REPLACES Hive-style partitioning and ZORDER. Key benefit: you can redefine clustering keys WITHOUT rewriting existing data, letting layout evolve with query needs.","source":"docs.databricks.com/aws/en/delta/clustering"},{"id":"Q006","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"A table is Hive-partitioned by date AND ZORDERed by customer_id. Migration guidance for liquid clustering keys?","options":["Use date only","Use customer_id only","Use BOTH date and customer_id as clustering keys","Liquid clustering cannot handle both"],"answer":2,"explain":"Official migration table: Hive partitioning → use partition columns as keys; Z-order → use ZORDER BY columns as keys; BOTH → use both partition columns AND ZORDER BY columns as clustering keys. For generated low-cardinality columns, use the original column instead.","source":"docs.databricks.com/aws/en/delta/clustering"},{"id":"Q007","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"Liquid clustering applies to which table types?","options":["Standard Delta tables only","Streaming tables and materialized views only","Both standard Delta tables AND streaming tables/materialized views","Only Unity Catalog managed tables"],"answer":2,"explain":"Per docs: liquid clustering applies to standard tables AND streaming tables and materialized views in Lakeflow pipelines.","source":"docs.databricks.com/aws/en/delta/clustering"},{"id":"Q008","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"What must a Unity Catalog row filter function return?","options":["STRING","BOOLEAN — FALSE or NULL filters the row out","INT row count","TABLE"],"answer":1,"explain":"Row filter functions are scalar SQL UDFs that must return BOOLEAN. If the function returns FALSE or NULL, the row is filtered out. Syntax: ALTER TABLE t SET ROW FILTER f ON (col).","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-row-filter"},{"id":"Q009","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Correct syntax to apply a column mask on table employees, column salary?","options":["ALTER TABLE employees SET MASK salary_mask","ALTER TABLE employees ALTER COLUMN salary SET MASK salary_mask","CREATE MASK salary_mask ON employees.salary","GRANT MASK salary_mask ON employees.salary"],"answer":1,"explain":"Column masks bind via ALTER TABLE ... ALTER COLUMN ... SET MASK, managed by the table owner. Row filters use ALTER TABLE ... SET ROW FILTER f ON (cols).","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q010","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"For consistent row filtering/masking across MANY tables, what does Databricks recommend over per-table filters?","options":["Dynamic views on every table","ABAC policies attached at catalog/schema level based on governed tags","GRANT SELECT per user per table","Cell-level encryption"],"answer":1,"explain":"Docs: table-level filters/masks suit single tables. For consistent enforcement across many tables, ABAC (attribute-based access control) policies are recommended — they attach at catalog/schema level and apply automatically based on governed tags.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q011","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"In a Lakeflow declarative pipeline, what is the DEFAULT behavior when a record violates an expectation?","options":["Pipeline fails immediately","Record is dropped","Warning logged, record retained (metric recorded)","Record quarantined to a separate table"],"answer":2,"explain":"Default expectation behavior: warn — rows are NOT dropped, violation is reported/metric recorded. Explicit clauses: ON VIOLATION DROP ROW, or ON VIOLATION FAIL UPDATE.","source":"docs.databricks.com/aws/en/ldp/concepts + databricks.com data quality"},{"id":"Q012","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Which expectation clause STOPS the pipeline update when invalid records appear?","options":["ON VIOLATION DROP ROW","ON VIOLATION FAIL UPDATE","ON VIOLATION QUARANTINE","ON VIOLATION WARN"],"answer":1,"explain":"ON VIOLATION FAIL UPDATE stops the update until resolved. DROP ROW discards invalid records. Warn (default) retains + reports. There is no built-in QUARANTINE clause.","source":"docs.databricks.com/aws/en/ldp/concepts"},{"id":"Q013","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Valid expectation definition syntax?","options":["CONSTRAINT valid_id EXPECT (customer_id IS NOT NULL) ON VIOLATION DROP ROW","EXPECT valid_id ON customer_id NOT NULL","CHECK CONSTRAINT valid_id","QUALITY CHECK (customer_id IS NOT NULL)"],"answer":0,"explain":"Pattern: CONSTRAINT <name> EXPECT (<SQL boolean>) optionally followed by ON VIOLATION DROP ROW | FAIL UPDATE. Expectations are SQL boolean constraints on streaming tables/views.","source":"docs.databricks.com lakeflow expectations"},{"id":"Q014","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Which operation gives exactly-once semantics when deduplicating CDC events into a Delta table in a streaming pipeline?","options":["INSERT INTO with watermark","foreachBatch with MERGE INTO on primary key + dropDuplicates within watermark","cache().count()","repartition(1).write"],"answer":1,"explain":"Standard CDC pattern: use foreachBatch + MERGE INTO keyed on the primary key, with dropDuplicatesWithinWatermark to handle duplicate events — exactly-once end-to-end with checkpointing.","source":"docs.databricks.com CDC apply changes / foreachBatch patterns"},{"id":"Q015","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Medallion architecture: what belongs in the SILVER layer?","options":["Raw immutable ingested data","Cleaned, validated, conformed data","Business-level aggregates for BI","Encryption keys"],"answer":1,"explain":"Bronze = raw ingested (immutable). Silver = cleaned/validated/conformed. Gold = business-level aggregates and curated metrics for analytics.","source":"docs.databricks.com medallion architecture"},{"id":"Q016","cert":"DEP","domain":"Code Development","difficulty":3,"q":"MERGE INTO orders t USING updates s ON t.id = s.id WHEN MATCHED AND s.op = 'D' THEN DELETE WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT * — what does this implement?","options":["SCD Type 2","CDC upsert with delete handling","Full table refresh","Sessionization"],"answer":1,"explain":"This is the classic CDC merge: deletes applied when op='D', updates for changes, inserts for new keys — the standard pattern behind APPLY CHANGES INTO / CDC ingestion.","source":"docs.databricks.com delta merge / CDC"},{"id":"Q017","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Which Databricks feature provides serverless observability of job/pipeline costs and usage via SQL?","options":["System tables","Spark UI logs export","Ganglia","explain(analyze)"],"answer":0,"explain":"System tables (system.billing.usage, system.lakeflow, system.access etc.) provide account-level operational + cost observability queryable in SQL — a key monitoring/alerting domain tool.","source":"docs.databricks.com system tables"},{"id":"Q018","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Recommended CI/CD artifact for deploying Databricks jobs, pipelines, and notebooks as code?","options":["Manual UI export","Databricks Asset Bundles (databricks bundle deploy)","dbfs cp scripts","Git-based notebook folders only"],"answer":1,"explain":"Asset Bundles define jobs/pipelines/notebooks/dashboards as code; `databricks bundle deploy` is the modern CI/CD path (dbx CLI is legacy).","source":"docs.databricks.com asset bundles"},{"id":"Q019","cert":"GAI","domain":"App Development","difficulty":1,"q":"Mosaic AI Vector Search / AI Search index is built from which source?","options":["A Delta table","A Kafka topic","CSV on local disk","A JDBC view"],"answer":0,"explain":"You create a vector search index from a Delta table; the index contains embedded data + metadata, queryable via REST API, and can auto-sync as the Delta table updates.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q020","cert":"GAI","domain":"App Development","difficulty":2,"q":"Delta Sync index where Databricks computes embeddings for you requires which argument?","options":["embedding_model_endpoint_name","embedding_dimension only","openai_api_key","sentence_transformers package"],"answer":0,"explain":"Option 1 (Databricks-managed embeddings): provide source Delta table + text column; Databricks computes embeddings using the model endpoint you specify (embedding_model_endpoint_name), optionally saving embeddings to a UC table.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q021","cert":"GAI","domain":"App Development","difficulty":2,"q":"pipeline_type='TRIGGERED' on a vector index means:","options":["Index syncs continuously in real time","Index syncs when manually/periodically triggered (e.g., scheduled)","Index is read-only","Queries are queued until sync completes"],"answer":1,"explain":"Delta Sync indices support CONTINUOUS (near real-time sync) or TRIGGERED (sync on demand/schedule). TRIGGERED suits batch refresh patterns and costs less.","source":"docs.databricks.com vector search / community examples"},{"id":"Q022","cert":"GAI","domain":"Deployment","difficulty":2,"q":"To serve an LLM-enabled application's model traffic on Databricks you would primarily use:","options":["Model Serving endpoints","Driver-side loop with requests","Databricks SQL warehouse","Photon clusters"],"answer":0,"explain":"Model Serving endpoints expose models (incl. external + foundation models via AI Gateway) behind a scalable REST endpoint — the deployment surface for GenAI apps (assembling & deploying domain, 22% of exam).","source":"docs.databricks.com model serving"},{"id":"Q023","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"Chunking strategy trade-off: very large chunks lead to…","options":["Better recall, worse precision and higher token cost","No effect","Faster indexing only","Lower storage only"],"answer":0,"explain":"Large chunks: more context per retrieval (recall↑) but dilute relevance, hurt precision, and increase prompt token cost. Small chunks: precise retrieval but risk losing context. A classic RAG design question (design domain 14%).","source":"RAG best practices, Databricks AI documentation"},{"id":"Q024","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"Which Databricks feature provides managed evaluation of LLM outputs (quality, groundedness)?","options":["MLflow 3 evaluations","Spark ML cross-validator","AutoML classification","dbutils.fs.head"],"answer":0,"explain":"MLflow 3 evaluation (judge-based metrics: correctness, groundedness, relevance…) is the managed way to evaluate GenAI app outputs — evaluation & monitoring is 12% of the exam.","source":"docs.databricks.com mlflow evaluation / AI agents evaluation"},{"id":"Q025","cert":"GAI","domain":"Eval & Governance","difficulty":2,"q":"To govern which documents an AI agent can retrieve, you should…","options":["Apply Unity Catalog permissions on the underlying tables + vector indexes","Disable the vector endpoint","Rely on prompt instructions only","Chunk documents per user"],"answer":0,"explain":"UC governs tables, indexes, endpoints, and functions — data governance for GenAI (8%) relies on UC ACLs, row filters/masks, and lineage flowing into retrieval sources.","source":"docs.databricks.com unity catalog governance"},{"id":"Q026","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Which action physically rewrites/reorganizes data files to improve data skipping on a Delta table?","options":["OPTIMIZE","VACUUM","DESCRIBE DETAIL","REFRESH TABLE"],"answer":0,"explain":"OPTIMIZE compacts small files and applies clustering/ZORDER layout. VACUUM removes files no longer referenced by time-travel versions (retention safety).","source":"docs.databricks.com delta optimize"},{"id":"Q027","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"After VACUUM with default retention, what becomes impossible?","options":["Writing to the table","Time travel to versions older than the retention window","Reading current data","Running OPTIMIZE"],"answer":1,"explain":"VACUUM deletes data files beyond the retention period (default 7 days), making time travel to those older snapshots impossible. This is why retention must be extended deliberately.","source":"docs.databricks.com delta vacuum"},{"id":"Q028","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"Auto Loader backfill of billions of files: recommended approach?","options":["COPY INTO for maximum throughput","Auto Loader with availableNow trigger processing existing + new files","read.csv with inferSchema","Batch job per file"],"answer":1,"explain":"Docs: 'You can use Auto Loader to process billions of files to migrate or backfill a table' — with existing-file processing + incremental new files; COPY INTO is fine for modest scale (thousands of files) but not billions.","source":"docs.databricks.com/aws/en/ingestion/auto-loader"},{"id":"Q029","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Who can manage table-level row filters and column masks?","options":["Any user with SELECT","The table owner","Only account admins","Workspace-local admins only"],"answer":1,"explain":"Table-level filters/masks are configured with SQL and managed by the table owner; ABAC policies (governance layer) are the recommended cross-table alternative.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q030","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Streaming table vs materialized view in Lakeflow pipelines — which can ONLY be refreshed incrementally from streaming sources?","options":["Materialized view","Streaming table","Both equally","Neither"],"answer":1,"explain":"Streaming tables ingest from streaming sources with exactly-once processing, refreshed incrementally. Materialized views are recomputed/computed from batch data and can fully refresh to incorporate late-changing source data.","source":"docs.databricks.com lakeflow concepts"},{"id":"Q031","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Which statement about Delta Lake ACID guarantees is TRUE?","options":["ACID applies only to writes from Spark SQL","Delta provides serializable ACID transactions between reads/writes via transaction log","ACID requires S3 consistency configuration","ACID only works on single-writer mode forever"],"answer":1,"explain":"Delta's transaction log (_delta_log) provides ACID guarantees; multi-writer conflicts resolved via optimistic concurrency with retry — no cloud-consistency config needed (that was the pre-Delta problem).","source":"docs.databricks.com delta transaction log"},{"id":"Q032","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Slow Spark job — which UI surfaces task-level skew and spill?","options":["Spark UI (Stages/SQL tab query detail)","Cluster library list","Workspace audit log","Job run JSON only"],"answer":0,"explain":"Spark UI + query profiler expose stage/task metrics (skew, spill, shuffle); monitoring domain pairs this with system tables for job-level observability.","source":"docs.databricks.com spark ui / query profiler"},{"id":"Q033","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Photon accelerates which workloads?","options":["Python UDF-heavy RDD jobs","SQL and DataFrame scans/expressions on Delta","ML training loops","Streaming sinks only"],"answer":1,"explain":"Photon is a vectorized C++ engine accelerating SQL + DataFrame (scans, filters, aggregations) especially on Delta/Parquet; it does not accelerate Python UDFs/RDD code.","source":"docs.databricks.com photon"},{"id":"Q034","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"Structured Streaming guarantees fault tolerance across restarts via:","options":["In-memory state only","Checkpoint + write-ahead log location","Driver heartbeats","Autoscaling memory"],"answer":1,"explain":"checkpointLocation stores offsets/state/commits enabling exactly-once recovery; lose the checkpoint = lose progress guarantees.","source":"docs.databricks.com structured streaming production"},{"id":"Q035","cert":"GAI","domain":"App Development","difficulty":3,"q":"In a RAG app, retrieval returns chunks whose embeddings are nearest to:","options":["The embedding of the user's query","The most recent document inserted","The average of all documents","A random seed chunk"],"answer":0,"explain":"Vector search compares the QUERY embedding against indexed document embeddings (cosine/Euclidean) to return nearest neighbors — the core retrieval mechanic behind AI Search endpoints.","source":"docs.databricks.com ai-search"},{"id":"Q036","cert":"GAI","domain":"Design & Data Prep","difficulty":2,"q":"Best first step to reduce hallucination in a GenAI app over company docs?","options":["Increase temperature to 1.5","Ground responses with retrieved context + cite sources in prompt","Use a larger LLM only","Remove system prompt"],"answer":1,"explain":"Grounding with retrieved context (RAG) + instructing the model to answer only from provided context (and cite) is the primary hallucination mitigation — design domain staple.","source":"Databricks RAG/generative AI best practices"},{"id":"Q037","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"Unity Catalog secures objects with which privilege model?","options":["GRANT/REVOKE on catalogs, schemas, tables, functions","OS file permissions","IAM roles only","Workspace secrets only"],"answer":0,"explain":"UC uses SQL GRANT/REVOKE across the three-level namespace (catalog.schema.table) plus row filters/column masks/ABAC — replaces legacy Hive metastore ACLs.","source":"docs.databricks.com unity catalog privileges"},{"id":"Q038","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"APPLY CHANGES INTO in a Lakeflow pipeline primarily automates:","options":["Schema drift","CDC: applying source changes (inserts/updates/deletes) into a target by key","Partition evolution","Optimization schedules"],"answer":1,"explain":"APPLY CHANGES INTO handles CDC merge logic (SCD1/SCD2 via sequenced columns) declaratively, replacing hand-written MERGE for change feeds.","source":"docs.databricks.com lakeflow apply changes"},{"id":"Q039","cert":"GAI","domain":"Deployment","difficulty":2,"q":"AI Gateway in Model Serving exists to…","options":["Provide a unified governed gateway to foundation/external models with routing, rate limits, cost tracking","Replace Unity Catalog","Serve only open-source models","Train models faster"],"answer":0,"explain":"AI Gateway adds centralized governance for LLM traffic: provider routing, fallbacks, rate limits, usage/cost observability — part of assembling/deploying apps (22% weight).","source":"docs.databricks.com ai gateway / model serving"},{"id":"Q040","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Which PySpark pattern efficiently writes partitioned data with schema evolution on append?","options":["write.mode('append').option('mergeSchema','true').partitionBy('date')","write.saveAsTable with overwrite always","insertInto with ignore","collect() then loop"],"answer":0,"explain":"mergeSchema=true allows schema evolution on append; partitionBy organizes layout. Overwrite modes would destroy history; collect() is anti-pattern at scale.","source":"docs.databricks.com delta writes/best practices"},{"id":"Q101","cert":"DEP","domain":"Code Development","difficulty":1,"q":"A teammate claims rewriting a Spark SQL query in the PySpark DataFrame API will run faster because DataFrames skip the Catalyst optimizer. What is true?","options":["DataFrames bypass Catalyst and execute precompiled JVM bytecode directly","The DataFrame API and SQL are both compiled by Catalyst into equivalent execution plans","SQL queries are interpreted line-by-line in Python on the driver","Neither uses Catalyst; plans are built from the Delta transaction log"],"answer":1,"explain":"Equivalent DataFrame and SQL code compiles to the same Catalyst/Tungsten plan; choose an API for readability and team skills, not speed.","source":"spark.apache.org/docs/latest/sql-programming-guide.html"},{"id":"Q102","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Which call is an action that actually triggers execution of a chain of filter() and select() transformations?","options":["Assigning the result to a new DataFrame variable","Calling df.cache() on the result","Calling .count() on the result","Calling .withColumn() on the result"],"answer":2,"explain":"Transformations are lazy; only actions (count, show, collect, write) launch a Spark job. cache() merely marks data for caching, which happens when it is first materialized.","source":"spark.apache.org/docs/latest/rdd-programming-guide.html"},{"id":"Q103","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Which Databricks SQL statement reads version 3 of the Delta table events?","options":["SELECT * FROM events AT VERSION 3","SELECT * FROM events WHERE _version = 3","SELECT * FROM events VERSION AS OF 3","SELECT * FROM events#3"],"answer":2,"explain":"Time travel uses VERSION AS OF (or TIMESTAMP AS OF) in SQL, and versionAsOf/timestampAsOf reader options in PySpark.","source":"docs.databricks.com/aws/en/delta/tutorial"},{"id":"Q104","cert":"DEP","domain":"Code Development","difficulty":1,"q":"In MERGE INTO target t USING src s ON t.id = s.id, which clause inserts source rows that have no matching target row?","options":["WHEN MATCHED THEN INSERT","WHEN NOT MATCHED THEN INSERT","WHEN NOT MATCHED BY SOURCE THEN INSERT","INSERT INTO t SELECT * FROM s"],"answer":1,"explain":"WHEN NOT MATCHED fires for source rows without a target match (insert only); WHEN MATCHED handles update/delete; WHEN NOT MATCHED BY SOURCE acts on target-only rows.","source":"docs.databricks.com/aws/en/delta/merge"},{"id":"Q105","cert":"DEP","domain":"Code Development","difficulty":1,"q":"How does Delta Lake record each committed transaction for a table?","options":["As a row in a Hive metastore transaction table","As a binary manifest at the table root","As an ordered JSON file in the table's _delta_log directory","In the Parquet footer of the most recent data file"],"answer":2,"explain":"Every commit atomically appends a JSON file to _delta_log; periodic Parquet checkpoints let readers reconstruct table state without replaying every commit, giving ACID guarantees.","source":"docs.delta.io/latest/delta-checkpoints.html"},{"id":"Q106","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Why does Databricks recommend built-in functions over Python UDFs when an equivalent exists?","options":["Built-ins always execute on the driver node","Python UDFs cannot be used on Delta tables","Built-ins are cached automatically with the table","Built-ins stay in the JVM and remain visible to Catalyst, while Python UDFs must serialize rows to Python processes"],"answer":3,"explain":"Row-at-a-time Python UDFs incur cross-process serialization and block optimizer codegen; built-in expressions keep data in the JVM and can be optimized.","source":"docs.databricks.com/aws/en/udf"},{"id":"Q107","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Using rank(), two rows tie at rank 1. What rank does the next row receive?","options":["3","2","4","It depends on partition size"],"answer":0,"explain":"rank() leaves gaps after ties (1,1,3); dense_rank() does not (1,1,2); row_number() assigns unique numbers regardless of ties.","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-window-functions"},{"id":"Q108","cert":"DEP","domain":"Code Development","difficulty":1,"q":"You must shrink a DataFrame from 8 partitions to 2 without a full shuffle. Which call does this?","options":["df.repartition(2)","df.repartitionByRange(2)","df.coalesce(2)","df.shufflePartitions(2)"],"answer":2,"explain":"coalesce() merges partitions locally on each executor (narrow dependency, no shuffle); repartition() triggers a full shuffle across the cluster.","source":"spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.DataFrame.coalesce.html"},{"id":"Q109","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Which configuration controls the number of partitions produced by a join or groupBy shuffle?","options":["spark.sql.files.maxPartitionBytes","spark.sql.shuffle.partitions","spark.driver.maxResultSize","spark.sql.adaptive.enabled"],"answer":1,"explain":"spark.sql.shuffle.partitions (default 200) sizes shuffle output; AQE can then coalesce those partitions at runtime using observed statistics.","source":"spark.apache.org/docs/latest/configuration.html"},{"id":"Q110","cert":"DEP","domain":"Code Development","difficulty":1,"q":"Which definition creates a Delta generated column that derives a date from the event_ts timestamp column?","options":["event_date DATE AS (CAST(event_ts AS DATE))","event_date DATE COMPUTED (event_ts)","event_date DATE DEFAULT CAST(event_ts AS DATE)","event_date DATE GENERATED ALWAYS AS (CAST(event_ts AS DATE))"],"answer":3,"explain":"Delta generated columns use GENERATED ALWAYS AS (expr); values are computed on write, and filters matching the expression benefit from data skipping.","source":"docs.databricks.com/aws/en/tables/features/generated-columns"},{"id":"Q111","cert":"DEP","domain":"Code Development","difficulty":1,"q":"What is a common table expression (CTE) in Databricks SQL?","options":["A temporary table materialized in the metastore for the session","A result cache shared across all queries","A named subquery defined with WITH that can be referenced multiple times in one statement","A global temp view that survives cluster restarts"],"answer":2,"explain":"A CTE defines a temporary result set scoped to a single SQL statement; it is not materialized or persisted.","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-cte"},{"id":"Q112","cert":"DEP","domain":"Code Development","difficulty":2,"q":"In PySpark, groupBy('store').applyInPandas(fn, schema) — how is fn invoked?","options":["Once per row with a pandas Series","Once per store group, receiving that group's rows (including the store column) as one pandas DataFrame","Once with the whole table as a single pandas DataFrame","Once per Arrow batch of the ungrouped DataFrame"],"answer":1,"explain":"applyInPandas is a grouped-map: Spark ships each group to Python via Arrow; fn returns pandas DataFrames matching the declared output schema.","source":"docs.databricks.com/aws/en/pandas/pandas-function-apis"},{"id":"Q113","cert":"DEP","domain":"Code Development","difficulty":2,"q":"What must the function passed to df.mapInPandas(func, schema) do?","options":["Take an iterator of pandas DataFrames and return an iterator of pandas DataFrames","Take one pandas Series and return a scalar","Build and return a Spark DataFrame with spark.createDataFrame","Register itself first with spark.udf.register"],"answer":0,"explain":"mapInPandas maps over the DataFrame's Arrow batches lazily: the function consumes and yields pandas DataFrames, keeping memory low and preserving order.","source":"docs.databricks.com/aws/en/pandas/pandas-function-apis"},{"id":"Q114","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Why do pandas UDFs outperform classic row-at-a-time Python UDFs?","options":["They bypass the JVM and read Delta files directly","They execute only on the driver, which has more memory","They move data in vectorized Arrow columnar batches instead of serializing rows one by one","They compile Python into JVM bytecode via Tungsten"],"answer":2,"explain":"pandas UDFs use Apache Arrow for columnar, vectorized JVM-to-Python transfer and pandas for computation, vastly reducing serialization overhead versus row-by-row UDFs.","source":"docs.databricks.com/aws/en/udf"},{"id":"Q115","cert":"DEP","domain":"Code Development","difficulty":2,"q":"By default, how often does Delta Lake write a checkpoint of the table state?","options":["After every single commit","After every 100 commits","Once per day per table","Every 10 commits (spark.databricks.delta.checkpointInterval)"],"answer":3,"explain":"Commits are JSON files in _delta_log; every 10th commit (default checkpointInterval) Delta writes a Parquet checkpoint so readers avoid replaying all commits.","source":"docs.delta.io/latest/delta-checkpoints.html"},{"id":"Q116","cert":"DEP","domain":"Code Development","difficulty":2,"q":"An append fails because the incoming DataFrame has two new columns. Which write option adds those columns automatically?","options":[".option('mergeSchema', 'true')",".option('overwriteSchema', 'true')",".option('autoMerge', 'true') on the reader",".option('evolve', 'true')"],"answer":0,"explain":"mergeSchema=true unions the incoming schema into the Delta table on append (or enable spark.databricks.delta.schema.autoMerge.enabled); overwriteSchema is for full overwrites.","source":"docs.databricks.com/aws/en/tables/update-schema"},{"id":"Q117","cert":"DEP","domain":"Code Development","difficulty":2,"q":"You overwrite a Delta table with a DataFrame that drops one column and changes another column's type. What is required?","options":["mode('overwrite') alone, since overwrite always replaces the schema","mode('overwrite') with .option('mergeSchema', 'true')","mode('overwrite') with .option('overwriteSchema', 'true')","A VACUUM on the table before writing"],"answer":2,"explain":"overwriteSchema replaces the schema during a full overwrite (drops, renames, type changes); mergeSchema only adds columns. Both force a full data rewrite.","source":"docs.databricks.com/aws/en/tables/update-schema"},{"id":"Q118","cert":"DEP","domain":"Code Development","difficulty":2,"q":"A huge Delta table is partitioned by date. Which DELETE prunes the most files and finishes fastest?","options":["DELETE FROM t WHERE date = '2026-01-15' AND status = 'cancelled'","DELETE FROM t WHERE status = 'cancelled'","DELETE FROM t WHERE customer_id % 10 = 3","DELETE FROM t"],"answer":0,"explain":"Predicates on partition columns (or liquid clustering keys) let Delta skip files entirely; non-partition predicates scan or rewrite far more data, and unfiltered DML rewrites everything.","source":"docs.databricks.com/aws/en/delta/merge"},{"id":"Q119","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Which PySpark call reads version 5 of the Delta table sales?","options":["spark.read.table('sales', version=5)","spark.read.format('delta').load('sales', version='5')","spark.read.format('delta').option('versionAsOf', 5).table('sales')","spark.read.parquet('sales/_delta_log/00005')"],"answer":2,"explain":"Use reader options versionAsOf or timestampAsOf; the SQL equivalent is VERSION AS OF / TIMESTAMP AS OF.","source":"docs.databricks.com/aws/en/delta/tutorial"},{"id":"Q120","cert":"DEP","domain":"Code Development","difficulty":2,"q":"A column is declared id BIGINT GENERATED ALWAYS AS IDENTITY. Which statement is true?","options":["INSERTs may supply id values as long as they are unique","INSERTs that supply a value for id fail; only the table generates values","Assigned values are guaranteed contiguous with no gaps","It works on any file format, not just Delta"],"answer":1,"explain":"ALWAYS rejects explicit values (DELTA_IDENTITY_COLUMNS_EXPLICIT_INSERT_NOT_SUPPORTED); GENERATED BY DEFAULT allows them. Values are unique but not necessarily contiguous, and identity columns are Delta-only, BIGINT-only.","source":"docs.databricks.com/aws/en/tables/features/generated-columns"},{"id":"Q121","cert":"DEP","domain":"Code Development","difficulty":2,"q":"How do you enforce qty > 0 on the Delta table orders?","options":["CREATE CONSTRAINT qty_positive ON orders CHECK (qty > 0)","ALTER TABLE orders ADD COLUMN CHECK (qty > 0)","ALTER TABLE orders SET TBLPROPERTIES ('check.qty' = 'true')","ALTER TABLE orders ADD CONSTRAINT qty_positive CHECK (qty > 0)"],"answer":3,"explain":"Use ALTER TABLE ... ADD CONSTRAINT name CHECK (expr); Delta validates existing rows and fails the DDL if any violate, and rejects violating new writes.","source":"docs.databricks.com/aws/en/tables/constraints"},{"id":"Q122","cert":"DEP","domain":"Code Development","difficulty":2,"q":"You run ALTER TABLE t ALTER COLUMN email SET NOT NULL while some existing rows have NULL emails. What happens?","options":["It succeeds and rewrites NULLs to empty strings","It fails because existing data violates the constraint","It succeeds, but applies only to rows written afterward","It succeeds and deletes the NULL rows"],"answer":1,"explain":"NOT NULL is managed via ALTER TABLE ... ALTER COLUMN; Delta verifies existing data first, so backfill the NULLs before adding the constraint.","source":"docs.databricks.com/aws/en/tables/constraints"},{"id":"Q123","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Each order row must also show that customer's total spend, keeping every row. Which expression does this?","options":["SUM(total) GROUP BY customer_id","JOIN orders to SELECT DISTINCT customer_id","SUM(total) OVER (ORDER BY total)","SUM(total) OVER (PARTITION BY customer_id)"],"answer":3,"explain":"A window aggregate adds the per-customer total to every row without collapsing rows; GROUP BY would reduce each customer to a single row.","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-window-functions"},{"id":"Q124","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Two rows tie at rank 2. You want the next distinct value to be ranked 3, not 4. Which function?","options":["rank()","row_number()","ntile(3)","dense_rank()"],"answer":3,"explain":"dense_rank() assigns no gaps after ties (2,2,3); rank() skips (2,2,4); row_number() is unique but arbitrary among ties.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/dense_rank"},{"id":"Q125","cert":"DEP","domain":"Code Development","difficulty":2,"q":"What distinguishes df.checkpoint() from df.cache()?","options":["checkpoint() materializes to reliable storage and truncates lineage; cache() is transient and keeps lineage so data can be recomputed","cache() truncates lineage, making recomputation impossible","checkpoint() stores data only in executor JVM memory","They are aliases for the same operation"],"answer":0,"explain":"Cached data is evictable and lost on cluster restart (lineage retained for recompute); a checkpoint writes to a checkpoint directory and cuts the logical plan.","source":"spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.DataFrame.checkpoint.html"},{"id":"Q126","cert":"DEP","domain":"Code Development","difficulty":2,"q":"With adaptive query execution (AQE) enabled, what does Spark do using runtime shuffle statistics?","options":["Coalesce small shuffle partitions, switch sort-merge joins to broadcast joins, and split skewed partitions","Disable whole-stage codegen to gather accurate statistics","Rewrite every join as a nested loop join","Broadcast every table smaller than 10 GB"],"answer":0,"explain":"AQE replans queries mid-execution: it coalesces partitions after shuffle exchange, converts sort-merge to broadcast hash joins, handles skew joins, and prunes empty relations.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q127","cert":"DEP","domain":"Code Development","difficulty":2,"q":"Which pair contains only wide transformations that shuffle data between partitions?","options":["filter and select","withColumn and drop","groupBy and join","map and coalesce"],"answer":2,"explain":"groupBy, joins, orderBy, and repartition need all-to-all data movement (a shuffle); filter/select/withColumn operate within each partition.","source":"spark.apache.org/docs/latest/rdd-programming-guide.html"},{"id":"Q128","cert":"DEP","domain":"Code Development","difficulty":3,"q":"On Databricks Runtime 15.2+, which syntax turns on schema evolution for a single MERGE statement?","options":["MERGE WITH SCHEMA EVOLUTION INTO t USING s ON ...","MERGE INTO t USING s EVOLVE SCHEMA ON ...","MERGE INTO t USING s WITH AUTO SCHEMA ON ...","MERGE SCHEMA AUTO INTO t USING s ON ..."],"answer":0,"explain":"Use MERGE WITH SCHEMA EVOLUTION INTO; session-wide behavior is controlled by spark.databricks.delta.schema.autoMerge.enabled=true.","source":"docs.databricks.com/aws/en/delta/merge"},{"id":"Q129","cert":"DEP","domain":"Code Development","difficulty":3,"q":"After VACUUM runs with the default 7-day retention, what happens to time travel?","options":["Nothing changes; VACUUM only compacts small files","Versions within retention remain queryable; files needed by older versions are deleted, so time travel to them fails","All versions stay readable because the transaction log is kept forever","RESTORE can still rebuild any vacuumed version"],"answer":1,"explain":"VACUUM removes data files no longer referenced by versions within deletedFileRetentionDuration (default 7 days); queries to older versions then error and cannot be recovered by RESTORE.","source":"docs.databricks.com/aws/en/sql/language-manual/delta-vacuum"},{"id":"Q130","cert":"DEP","domain":"Code Development","difficulty":3,"q":"Enabling delta.columnMapping.mode = 'name' is required for which operation on a Delta table?","options":["Adding a CHECK constraint","Querying with VERSION AS OF","Declaring an identity column","Renaming or dropping columns as metadata-only changes"],"answer":3,"explain":"Column mapping decouples the Delta schema from Parquet column names, enabling metadata-only DROP COLUMN / RENAME COLUMN without rewriting data files.","source":"docs.databricks.com/aws/en/tables/features/column-mapping"},{"id":"Q131","cert":"DEP","domain":"Code Development","difficulty":3,"q":"You need a 3-row moving average of value ordered by ts across the whole table. Which window spec is correct?","options":["AVG(value) OVER (ORDER BY ts ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)","AVG(value) OVER (ROWS BETWEEN 3 PRECEDING AND CURRENT ROW)","AVG(value) OVER (PARTITION BY ts ORDER BY ts)","AVG(value) OVER (ORDER BY ts RANGE BETWEEN 0 AND 3)"],"answer":0,"explain":"ROWS BETWEEN 2 PRECEDING AND CURRENT ROW is exactly the current row plus the two before it; a ROWS frame requires ORDER BY, and RANGE works on values rather than row counts.","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-window-functions"},{"id":"Q132","cert":"DEP","domain":"Code Development","difficulty":3,"q":"Why is df.mapInPandas generally safer than pdf = df.toPandas(); transform(pdf) on a large table?","options":["mapInPandas broadcasts the driver's pandas frame to executors","It converts results into Scala Datasets automatically","It keeps data distributed, streaming Arrow batches through executor pandas code in parallel instead of collecting on the driver","It runs pandas inside the Delta transaction log"],"answer":2,"explain":"toPandas() pulls everything through the driver (memory limit, single-node processing); mapInPandas streams batches on executors with a low memory footprint.","source":"docs.databricks.com/aws/en/pandas/pandas-function-apis"},{"id":"Q133","cert":"DEP","domain":"Code Development","difficulty":3,"q":"After groupBy on a small dataset, the Spark UI shows 200 tiny tasks. What is the best fix?","options":["Raise spark.sql.shuffle.partitions to 1000","Disable AQE so the partition count is fixed","Repartition the DataFrame to 2000 before the aggregation","Lower spark.sql.shuffle.partitions for this job, or confirm AQE coalescing is enabled"],"answer":3,"explain":"The 200-partition default over-partitions small shuffles; AQE coalesces small partitions at runtime, otherwise tune the config per workload.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q134","cert":"DEP","domain":"Code Development","difficulty":3,"q":"For parsing a JSON string column, which comparison is accurate for from_json vs a Python pandas UDF vs a Scala UDF?","options":["from_json stays in the JVM and is Catalyst-optimizable; a Python UDF pays JVM-to-Python serialization; a Scala UDF runs in the JVM but is still a black box to Catalyst","Scala UDFs receive full Catalyst codegen, matching built-ins","Python pandas UDFs always outperform Scala UDFs","All three are optimized identically by Tungsten"],"answer":0,"explain":"Preference order is built-ins, then higher-order functions, then UDFs; Scala/Java UDFs avoid Python serialization but, like all UDFs, are opaque to the optimizer.","source":"docs.databricks.com/aws/en/udf"},{"id":"Q135","cert":"DEP","domain":"Code Development","difficulty":3,"q":"What does RESTORE TABLE sales TO VERSION AS OF 10 actually do?","options":["Deletes table history after version 10","Restores only the schema, not the data","Requires truncating the table first","Commits a new version that returns data and metadata to the version 10 state; existing history remains available"],"answer":3,"explain":"RESTORE is itself a Delta transaction producing a new version; versions after 10 stay in the history (within retention) and remain time-travelable.","source":"docs.databricks.com/aws/en/sql/language-manual/delta-restore"},{"id":"Q201","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A team enables classic Auto Loader file notification mode against an Amazon S3 bucket (cloudFiles.useNotifications = true) and grants the required IAM permissions. Which cloud resources does Auto Loader automatically create for the stream?","options":["An SNS topic and an SQS queue (named with the databricks-auto-ingest prefix) that subscribe to object-created events on the bucket","An AWS Lambda function and a DynamoDB table that index all bucket objects","A CloudTrail trail and a Kinesis Data Stream that capture all S3 API calls","Only an SQS queue; the team must manually subscribe it to bucket events"],"answer":0,"explain":"In classic file notification mode on AWS, Auto Loader automatically provisions an SNS topic plus an SQS queue (prefix databricks-auto-ingest) per stream; the stream consumes and deletes queue messages as files are processed.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-notification-mode"},{"id":"Q202","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"An Auto Loader stream runs with Trigger.AvailableNow and no rate-limiting options are set. How many files does Auto Loader process per micro-batch by default?","options":["100","10,000","1,000","There is no default limit; all outstanding files go into a single micro-batch"],"answer":2,"explain":"With Trigger.AvailableNow, Auto Loader processes at most 1000 files per micro-batch by default; cloudFiles.maxFilesPerTrigger and cloudFiles.maxBytesPerTrigger tune this.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/production"},{"id":"Q203","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"A production Auto Loader stream sets both cloudFiles.maxFilesPerTrigger = 1000 and cloudFiles.maxBytesPerTrigger = 1GB. Which statement about these limits is correct?","options":["Both limits are hard limits; a micro-batch can never exceed either one","The file limit is a hard limit, but the byte limit is soft — a micro-batch can process more than maxBytesPerTrigger; Auto Loader stops once either limit is hit","The byte limit is a hard limit, while the file limit is soft","When both options are set, Auto Loader ignores maxFilesPerTrigger"],"answer":1,"explain":"maxFilesPerTrigger is a hard limit; maxBytesPerTrigger is a soft limit, so more bytes may be processed than configured. When both are set, processing stops as soon as one of the limits is reached.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/production"},{"id":"Q204","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"Why does Databricks recommend setting cloudFiles.backfillInterval (for example, '1 day') on Auto Loader streams in classic file notification mode when data completeness SLAs matter?","options":["It forces Auto Loader to process files in the order they were uploaded","It improves schema inference accuracy by re-reading older files","It throttles ingestion to reduce API costs on the queue service","Cloud providers do not guarantee 100% delivery of file events; regular asynchronous backfills discover any missed files without causing duplicates"],"answer":3,"explain":"Notification systems can rarely miss events (e.g., message retention limits). cloudFiles.backfillInterval triggers asynchronous backfills that guarantee files are discovered within the SLA, and backfills never create duplicate data.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/production"},{"id":"Q205","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"What is the purpose of the cloudFiles.schemaLocation option in Auto Loader?","options":["It stores the inferred schema and the history of schema changes so the stream can detect and evolve schema over restarts","It defines the checkpoint location that tracks which files have been processed","It specifies where notification service resources are created","It routes malformed records that fail parsing to a quarantine directory"],"answer":0,"explain":"cloudFiles.schemaLocation is where Auto Loader persists the inferred schema and its evolution history; the separate checkpointLocation tracks stream progress and processed-file state.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"},{"id":"Q206","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"A company runs 120 classic file-notification Auto Loader streams, all reading from different prefixes of the same S3 bucket. AWS allows only 100 notification configurations per bucket. What is the recommended way to keep file notification mode for all streams?","options":["Open an AWS support ticket to raise the 100-configurations-per-bucket hard limit","It is impossible; half the streams must switch to directory listing mode permanently","Migrate to file notification mode with file events (one queue per external location) or fan out events from a single queue using a service like AWS Lambda into directory-specific queues","Combine all prefixes into one stream and filter records downstream"],"answer":2,"explain":"Classic mode supports 100 concurrent notification pipelines per S3 bucket (500 per Azure storage account). To exceed the limit, use file events (a single shared queue per external location) or fan out from one queue with Lambda/Azure Functions/Cloud Functions.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-notification-mode"},{"id":"Q207","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"An Auto Loader stream is configured with cloudFiles.useManagedFileEvents = true on an external location that has file events enabled. Which statement is true about cloudFiles.backfillInterval for this stream?","options":["It must be set manually to at least 7 days for file events to work","It is unsupported/ignored — Databricks handles backfill automatically for external locations enabled for file events","It is a required option when enabling managed file events","Its minimum allowed value is 14 days"],"answer":1,"explain":"With file events, options like useNotifications, cloudFiles.fetchParallelism, and cloudFiles.backfillInterval are ignored because Databricks manages discovery and backfill automatically for file-event-enabled external locations.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-notification-mode"},{"id":"Q208","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"An Auto Loader query starts with Trigger.AvailableNow. While that run is executing, new files land in the source directory. What happens to those new files?","options":["They are picked up by the currently running trigger","The streaming query fails with a concurrent-write error","They are silently skipped and never ingested","They are ignored until the next time the query is triggered"],"answer":3,"explain":"Trigger.AvailableNow instructs Auto Loader to process only files that arrived before the query start time; files arriving after the stream starts are ignored until the next trigger.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/production"},{"id":"Q209","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A legacy Structured Streaming job on Databricks Runtime 14.3 uses Trigger.Once for incremental batch processing. What should the data engineer do?","options":["Replace Trigger.Once with Trigger.AvailableNow, since Trigger.Once is deprecated in Databricks Runtime 11.3 LTS and above; AvailableNow also supports rate limiting across multiple micro-batches","Keep Trigger.Once — it is still the recommended trigger for incremental batch workloads","Switch to trigger(processingTime='1 day') to process data daily","Switch to continuous processing mode for lower latency"],"answer":0,"explain":"Trigger.Once is deprecated in DBR 11.3 LTS+; Databricks recommends Trigger.AvailableNow, which consumes all available records as incremental batches with configurable sizing (e.g., maxBytesPerTrigger).","source":"docs.databricks.com/aws/en/structured-streaming/triggers"},{"id":"Q210","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"COPY INTO runs successfully against a Delta table. The same COPY INTO command runs again after some source files were modified in place. What is the result?","options":["Modified files are reloaded because their content changed","The second run fails with a duplicate-file error","The already-loaded files are skipped — COPY INTO is idempotent even if files have been modified since they were loaded","The files are loaded again, producing duplicate rows"],"answer":2,"explain":"COPY INTO is retriable and idempotent: files in the source location that have already been loaded are skipped on subsequent runs, even if the files were modified since loading. (COPY_OPTIONS force=true would disable this.)","source":"docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"},{"id":"Q211","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"Before loading a new data feed, an engineer runs: COPY INTO target FROM '/Volumes/main/ingest/landing' FILEFORMAT = JSON VALIDATE 15 ROWS; What does this statement do?","options":["Loads only the first 15 rows of each source file into the table","Validates that the data can be parsed, that the schema matches or needs evolution, and that nullability/check constraints are met — without writing any data; only 15 rows are validated","Validates and then commits the load in a single transaction","Only checks that at least 15 files exist in the source location"],"answer":1,"explain":"VALIDATE (ALL or N ROWS) checks parseability, schema match/evolution, and constraints but writes nothing to the table. It returns a data preview (up to 50 rows when fewer than 50 rows is specified).","source":"docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"},{"id":"Q212","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A team must ingest a directory that already contains tens of millions of files and receives thousands of new files per hour. Which approach does Databricks recommend?","options":["Auto Loader (or a streaming table backed by read_files), which scales incremental file discovery to billions of files","A scheduled COPY INTO command that runs hourly over the whole directory","spark.read.format('json').load() re-run on a schedule","An OPTIMIZE job followed by batch INSERT INTO"],"answer":0,"explain":"For directories with very large numbers of files, Databricks recommends Auto Loader (streaming tables for SQL users) over COPY INTO; Auto Loader scales to near-real-time ingestion of millions of files per hour.","source":"docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"},{"id":"Q213","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A pipeline needs to force-reload every file in a landing directory into a Delta table with COPY INTO, even files that were previously loaded. Which COPY_OPTIONS setting accomplishes this?","options":["COPY_OPTIONS ('mergeSchema' = 'true')","COPY_OPTIONS ('validateOnly' = 'true')","FORMAT_OPTIONS ('force' = 'true')","COPY_OPTIONS ('force' = 'true'), which disables idempotency so files are loaded regardless of whether they were loaded before"],"answer":3,"explain":"force (COPY_OPTIONS, default false) disables idempotency and reloads files regardless of prior loads; mergeSchema evolves the schema and does not force reloads.","source":"docs.databricks.com/aws/en/sql/language-manual/delta-copy-into"},{"id":"Q214","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"With Unity Catalog enabled, which source path is the recommended way to run COPY INTO against data stored in a UC volume?","options":["FROM 'dbfs:/mnt/landing/events' using a legacy DBFS mount","FROM 'volume://main.ingest.landing/events'","FROM '/Volumes/main/ingest/landing/events' — the Unity Catalog volume path","FROM 's3://bucket/landing/events' with inline AWS_ACCESS_KEY credentials (always required for volumes)"],"answer":2,"explain":"COPY INTO supports Unity Catalog volumes via /Volumes/<catalog>/<schema>/<volume>/... paths; no inline credentials are needed when access is governed by UC.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/copy-into"},{"id":"Q215","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"Several Auto Loader streams with managed file events each read from a different subpath under the same external location. What does Databricks recommend to optimize file discovery and avoid rate limiting?","options":["Point all streams at one shared volume covering the entire external location","Create a dedicated external volume for each subpath and pass volume paths (/Volumes/...) to each stream instead of cloud storage URLs","Supply raw s3:// or abfss:// URLs so file events scope to the whole bucket","Disable file events for the extra streams and use classic notification mode for them"],"answer":1,"explain":"Databricks recommends separate volumes per subpath so the file events service scopes discovery to relevant objects only; sharing one volume across subpaths adds discovery overhead and risks rate limiting.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/file-notification-mode"},{"id":"Q216","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"A Structured Streaming query reads from Kafka with format('kafka'). How are the key and value columns returned, and how should the engineer get usable JSON data?","options":["They are always binary (byte arrays); explicitly deserialize them with operations like cast('string') and from_json","They are automatically deserialized to STRING columns with inferred JSON schema","Only the value column is returned; the key is dropped","Kafka messages must be pre-converted to Avro before Spark can read them"],"answer":0,"explain":"The Kafka reader returns key and value as binary deserialized with ByteArrayDeserializer; use cast('string'), from_json, or from_avro to parse them explicitly.","source":"docs.databricks.com/aws/en/connect/streaming/kafka"},{"id":"Q217","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A Kafka consumer must read only specific partitions: partitions 0 and 1 of topicA and partitions 2 and 4 of topicB. Which Kafka reader option supports this?","options":["subscribe with a comma-separated list of topics","subscribePattern with a Java regex string","kafka.partitions.auto with a partition list","assign with a JSON string such as {\"topicA\":[0,1],\"topicB\":[2,4]}"],"answer":3,"explain":"assign takes a JSON string mapping topics to specific partitions; subscribe takes a topic list and subscribePattern takes a regex — neither selects individual partitions.","source":"docs.databricks.com/aws/en/connect/streaming/kafka"},{"id":"Q218","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"An engineer is building a CDC pipeline: a stream of change records must be upserted into a Delta table using MERGE INTO on matching keys. Why is foreachBatch required for this pattern?","options":["foreachBatch reduces micro-batch latency for Kafka sources","Delta Lake MERGE (and other arbitrary table operations) are not supported as native Structured Streaming sinks; foreachBatch exposes each micro-batch as a batch DataFrame where MERGE can run","foreachBatch provides automatic exactly-once guarantees for MERGE","foreachBatch is required to apply watermarks to the stream"],"answer":1,"explain":"You must use foreachBatch for Delta Lake merge operations in Structured Streaming: the function receives (DataFrame, batchId) and runs batch MERGE/UPDATE/DELETE logic per micro-batch (the standard CDC upsert pattern).","source":"docs.databricks.com/aws/en/structured-streaming/foreach"},{"id":"Q219","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"A foreachBatch function writes each micro-batch to a Delta table, but job restarts occasionally replay a batch. Which practice guarantees idempotent writes?","options":["Wrap the write in try/except and catch duplicate-key exceptions","Cache the DataFrame so replays read from memory","Use the Delta write options txnA
