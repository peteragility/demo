ppId and txnVersion, binding txnVersion to the foreachBatch batchId, so a replayed batch with the same ID is skipped","Delete and recreate the target table before each write"],"answer":2,"explain":"foreachBatch gives only at-least-once guarantees. For DataFrame/Delta writes, set a fixed txnAppId and txnVersion = batchId; if Spark replays a batch with the same batchId, Delta skips the duplicate write.","source":"docs.databricks.com/aws/en/structured-streaming/foreach"},{"id":"Q220","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"In a Lakeflow Jobs workflow, an ingestion task (a notebook that runs an Auto Loader AvailableNow job) must complete successfully before a downstream transformation task starts. How is this relationship modeled?","options":["As a task dependency: job tasks form a DAG, and the transformation task is configured to depend on the ingestion task so it only runs after upstream success","Schedule both tasks with the same cron expression so they start together","Put both steps in one notebook because jobs support only a single task","Run both tasks on the same all-purpose cluster and coordinate with a shared variable"],"answer":0,"explain":"Lakeflow Jobs are one or more tasks visualized as a DAG; tasks (notebook, pipeline, Python script, SQL, etc.) can depend on other tasks, with branching (if/else) and looping (for each) for conditional logic.","source":"docs.databricks.com/aws/en/jobs"},{"id":"Q221","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"A streaming query does windowed aggregation with a watermark. Which option correctly matches output modes to their watermark behavior for windowed aggregations?","options":["Append writes rows immediately per trigger; Complete drops aggregation state after the threshold","Update writes rows only after the watermark threshold passes; Append writes as results are computed","All output modes behave identically once a watermark is defined","Append delays all writes until the watermark threshold passes; Update writes rows as results are calculated; Complete never drops aggregation state and rewrites the target each trigger"],"answer":3,"explain":"Append mode delays writes until the lateness threshold passes (then state is dropped); Update writes results as they are computed and updates rows; Complete never drops state and rewrites the entire result table every trigger.","source":"docs.databricks.com/aws/en/structured-streaming/watermarks"},{"id":"Q222","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A stream applies withWatermark('eventTime', '10 hours').dropDuplicatesWithinWatermark(['guid']). Which statement is correct?","options":["It removes duplicates across all time regardless of the watermark","It deduplicates records that arrive within the 10-hour watermark threshold on the guid column; to guarantee ALL duplicates are dropped, the threshold must exceed the maximum timestamp difference between duplicate events","It works without requiring a watermark on the DataFrame","It only removes duplicates where every column value is identical"],"answer":1,"explain":"dropDuplicatesWithinWatermark (DBR 13.3 LTS+) always deduplicates within the watermark threshold and may deduplicate beyond it without guarantee; set the threshold larger than the max timestamp difference between duplicates to guarantee full dedup. A watermark is mandatory.","source":"docs.databricks.com/aws/en/structured-streaming/watermarks"},{"id":"Q223","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"A query joins two streams: stream1 has withWatermark('eventTime1', '1 hour') and stream2 has withWatermark('eventTime2', '2 hours'). With the default spark.sql.streaming.multipleWatermarkPolicy, how is the single global watermark determined?","options":["The minimum of the per-stream watermarks — the global watermark moves at the pace of the slowest stream, safely delaying output","The maximum of the per-stream watermarks, prioritizing the fastest stream","The average of the two watermarks","The watermark of whichever stream has processed more records"],"answer":0,"explain":"By default the policy is min: Structured Streaming tracks max event time per input, computes each watermark, and uses the minimum as the global watermark so a lagging stream's data is not marked late. Setting the policy to max reduces latency but drops slow-stream data.","source":"docs.databricks.com/aws/en/structured-streaming/watermarks"},{"id":"Q224","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"A streaming table was created with SELECT LOWER(name) ... and later the query is changed to SELECT UPPER(name). What happens to rows already ingested?","options":["All existing rows are automatically updated to uppercase","Existing rows keep lowercase values because each row is processed only once; only new rows use UPPER — a full refresh is required to reprocess historical rows","The table is dropped and recreated with the new query","The pipeline rejects the query change until it is restarted"],"answer":2,"explain":"A streaming table only sees each input row once; changing the query affects only newly processed rows. A full refresh requeries all source data to update existing rows.","source":"docs.databricks.com/aws/en/ldp/concepts/streaming-tables"},{"id":"Q225","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A pipeline joins a slowly changing fact stream to a static dimension table. Business users require that results always reflect current dimension values (correctness over speed), recomputing joins when dimensions change. Which Lakeflow pipeline table type fits best?","options":["A streaming table, because it recomputes joins whenever dimensions change","A streaming table, because joins in streaming tables are always correct","A temporary view refreshed on a schedule","A materialized view, because materialized views automatically recompute joins when dimension tables change and remain correct"],"answer":3,"explain":"Streaming table joins do not recompute when dimensions change ('fast-but-wrong'); materialized views always recompute joins on dimension changes. For append-only ingestion where each row is handled once, use a streaming table instead.","source":"docs.databricks.com/aws/en/ldp/concepts/streaming-tables"},{"id":"Q226","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"A new Structured Streaming query reads a Delta table with option('readChangeFeed', 'true'). What does the stream return on its very first start?","options":["Nothing — the stream waits until new commits occur after it starts","The latest snapshot of the table as INSERT records, followed by subsequent changes as change data","The entire table history replayed as update_preimage/update_postimage pairs","An error, because a startingVersion must always be specified for streaming reads"],"answer":1,"explain":"When a CDF stream first starts, it returns the current table snapshot as INSERTs and then processes future changes; startingVersion is optional (use it e.g. to resume after checkpoint corruption).","source":"docs.databricks.com/aws/en/tables/features/change-data-feed"},{"id":"Q227","cert":"DEP","domain":"Ingestion","difficulty":1,"q":"Which metadata columns does change data feed add to rows when reading changes from a Delta table?","options":["_change_type, _commit_version, _commit_timestamp","_operation, _source_version, _event_time","_preimage, _postimage, _row_hash","_row_id, _partition, _file_index"],"answer":0,"explain":"CDF exposes _change_type (insert, update_preimage, update_postimage, delete), _commit_version, and _commit_timestamp alongside the table's data columns.","source":"docs.databricks.com/aws/en/tables/features/change-data-feed"},{"id":"Q228","cert":"DEP","domain":"Ingestion","difficulty":3,"q":"Which statement about batch reads of change data feed using table_changes() is correct?","options":["A starting version or timestamp is optional for batch queries","Start and end versions are exclusive, so table_changes('t', 0, 10) covers versions 1-9","Batch queries must specify a starting version (or timestamp); ranges are inclusive, and specifying a version older than when CDF was enabled raises an error","Batch reads scan the underlying change data files directly, bypassing the transaction log"],"answer":2,"explain":"Starting versions/timestamps are required for batch reads, ranges are inclusive (0 to 10 covers versions 0-10), and a version before CDF was enabled errors out. Databricks recommends always using the table_changes()/readChangeFeed APIs, not raw change files.","source":"docs.databricks.com/aws/en/tables/features/change-data-feed"},{"id":"Q229","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A team ingests from Azure Event Hubs using the Structured Streaming Kafka connector with SAS/shared access signature auth. Which configuration is correct?","options":["bootstrap servers {namespace}.servicebus.windows.net:9092 with no security protocol","A dedicated legacy Event Hubs connector library, because the Kafka connector does not support Event Hubs","kafka.security.protocol = SSL with the Event Hubs SAS key as the TLS certificate","bootstrap servers {namespace}.servicebus.windows.net:9093 with kafka.security.protocol = SASL_SSL, kafka.sasl.mechanism = PLAIN, and username \"$ConnectionString\" with the connection string as password; subscribe to the Event Hub name as the topic"],"answer":3,"explain":"Event Hubs exposes a Kafka-compatible endpoint on port 9093; use SASL_SSL + PLAIN with $ConnectionString as the JAAS username. The Kafka connector only needs the topic (EntityPath) — unlike the legacy Event Hubs connector.","source":"docs.databricks.com/gcp/en/ldp/event-hubs"},{"id":"Q230","cert":"DEP","domain":"Ingestion","difficulty":2,"q":"A production Lakeflow Jobs workflow runs a nightly ingestion and transformation. Which compute choice matches Databricks recommendations?","options":["Attach all tasks to an existing all-purpose cluster so it stays warm between runs","Use serverless compute or classic jobs compute — job clusters are created for the job run and terminated when it finishes; Databricks does not recommend all-purpose compute for production jobs","Run every task on the smallest single-node cluster to minimize cost","Use a SQL warehouse for the notebook tasks because it autoscales"],"answer":1,"explain":"Databricks recommends serverless or classic jobs compute for job tasks; all-purpose compute for production jobs is not recommended. Job clusters spin up per run and are terminated on completion, isolating workloads and controlling cost.","source":"docs.databricks.com/aws/en/jobs/compute"},{"id":"Q601","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"A platform team wants to analyze DBU consumption by SKU across all workspaces in the account for the last 90 days. Which system table should they query?","options":["system.query.history","system.billing.usage","system.access.audit","system.compute.clusters"],"answer":1,"explain":"system.billing.usage contains records for all billable usage across the account (retained 365 days), with columns such as sku_name, usage_quantity, usage_date, and usage_metadata (job_id, cluster_id). system.query.history covers SQL query executions, system.access.audit covers security/audit events, and system.compute.clusters tracks cluster configuration history.","source":"docs.databricks.com/aws/en/admin/system-tables/billing"},{"id":"Q602","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"system.lakeflow.jobs is a slowly changing dimension (SCD2) table. According to the docs, how is the deletion of a job represented?","options":["The job's row is physically removed from the table after 24 hours","The original row's job_id column is set to NULL","A new row is emitted with delete_time populated; the original rows remain","All rows for that workspace_id are truncated and rewritten"],"answer":2,"explain":"SCD2 tables emit a new row with updated values when an entity changes; deletions are recorded as a new row with delete_time populated, not by removing rows. To get current job state, take the row with the most recent change_time per (workspace_id, job_id) and then filter out rows where delete_time IS NOT NULL.","source":"docs.databricks.com/aws/en/admin/system-tables/jobs"},{"id":"Q603","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"Which system table should a security team query to audit account- and workspace-level events such as user logins, notebook edits, and job runs?","options":["system.access.audit","system.billing.usage","system.lakeflow.job_run_timeline","system.compute.warehouse_events"],"answer":0,"explain":"system.access.audit records workspace- and account-level audit events (logins, notebook activity, job runs, permission changes) and is the standard source for security/compliance observability. The lakeflow schema records job metadata, billing records usage, and warehouse_events records SQL warehouse lifecycle events.","source":"docs.databricks.com/aws/en/admin/system-tables/access"},{"id":"Q604","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Ganglia metrics are deprecated in Databricks. An engineer wants historical, queryable node-level utilization metrics (for example CPU utilization over time) for compute monitoring. What is the recommended replacement?","options":["Query system.lakeflow.jobs and join to billing data","Export Ganglia RRD files to cloud storage manually","Read the cluster event log JSON from the workspace filesystem","Query the system.compute schema (for example system.compute.node_timeline) for node utilization metrics"],"answer":3,"explain":"With Ganglia deprecated, compute observability moved to system tables: the system.compute schema exposes node_timeline for node utilization metrics along with clusters, node_types, instance_events, warehouses, and warehouse_events. These tables are queryable with SQL and support account-wide monitoring.","source":"docs.databricks.com/aws/en/admin/system-tables/reference"},{"id":"Q605","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Which statements are included in the system.query.history table?","options":["Only queries executed interactively in the SQL editor","Queries run using SQL warehouses or serverless compute for notebooks and jobs, account-wide in the region","All Spark commands executed on classic all-purpose clusters","Only queries that failed, for troubleshooting purposes"],"answer":1,"explain":"The query history system table includes records for queries run using SQL warehouses or serverless compute for notebooks and jobs, with account-wide records from all workspaces in the same region. It captures all termination states (FINISHED, FAILED, CANCELED), not just failures.","source":"docs.databricks.com/aws/en/admin/system-tables/query-history"},{"id":"Q606","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"A team manages one Git repository and wants to promote the same bundle through dev, staging, and prod workspaces with different settings per environment. What is the recommended Databricks Asset Bundles approach?","options":["Create three separate repositories, each with a hardcoded workspace URL in databricks.yml","Export notebooks from the dev workspace and import them into staging and prod before each release","Define targets (dev/staging/prod) in databricks.yml, each with its own workspace host and settings, and deploy each with 'databricks bundle deploy --target <name>'","Deploy only the default target and let admins manually copy job definitions between workspaces"],"answer":2,"explain":"Bundles support multiple targets in databricks.yml. Each target (dev, staging, prod) can override workspace.host, mode (development/production), permissions, variables, and resource settings; values not overridden fall back to the top-level mappings. CI/CD pipelines then deploy each target with 'databricks bundle deploy --target <target>' using target-specific credentials.","source":"docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"id":"Q607","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"In the Spark UI, a stage shows 200 tasks where 197 finish in under 30 seconds but 3 tasks run for over 15 minutes. What is the classic symptom being displayed?","options":["Data skew: a few tasks hold disproportionately large partitions, so they take much longer than the rest","Disk spill caused by insufficient driver memory","Cluster autoscaling waiting for new nodes to join","The stage is I/O bound on cloud storage reads"],"answer":0,"explain":"Skew is when one or a few tasks take much longer than the rest because they process much larger partitions (often a hot join key). The Spark UI guide recommends checking the longest stage's Summary Metrics: large max-vs-median gaps in task duration and shuffle read size indicate skew, causing idle executors and poor cluster utilization.","source":"docs.databricks.com/aws/en/optimizations/spark-ui-guide"},{"id":"Q608","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"While diagnosing a slow Spark job, an engineer opens a long-running stage in the Spark UI and sees non-zero 'Spill (Memory)' and 'Spill (Disk)' values in the stage details. What does this indicate?","options":["The stage wrote output files to cloud storage using Delta Lake","Spark ran low on memory and temporarily moved data from memory to disk, which is expensive and most common during shuffles","Cached DataFrame results were evicted from the cache","The driver lost connection to executors and re-scheduled tasks"],"answer":1,"explain":"Spill happens when Spark runs low on memory and starts moving data from memory to disk; it is expensive and most common during data shuffling. The stage page shows spill statistics, and the Spark UI guide's 'skew and spill' step uses these to determine whether a long stage is slowed by memory pressure rather than skew or I/O.","source":"docs.databricks.com/aws/en/optimizations/spark-ui-guide/long-spark-stage-page"},{"id":"Q609","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"A SQL analyst says a Databricks SQL query is slow. Which built-in tool visualizes the query as a plan graph with per-operator metrics (rows, spill, duration) to find the bottleneck?","options":["The Spark UI Stages tab","The cluster Ganglia dashboard","The system.billing.usage table","The query profile in the SQL editor"],"answer":3,"explain":"For Databricks SQL, the query profile renders the query plan as an interactive graph (DAG) with metrics for each operator/node, letting you spot expensive operations. Spark UI applies to Spark clusters rather than SQL warehouse queries, and Ganglia (deprecated) showed cluster resource metrics, not query plans.","source":"docs.databricks.com/aws/en/sql/query-profile"},{"id":"Q610","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"What does the command 'databricks bundle init' do?","options":["Scaffolds a new bundle project from a default or custom template, creating files such as databricks.yml, resources/, and src/","Deploys the current bundle to the default target workspace","Validates the bundle configuration and prints the resolved YAML","Initializes a new Git repository and commits the bundle files"],"answer":0,"explain":"'databricks bundle init' is the fastest way to start bundle development: it presents a choice of Databricks-provided templates (for example default-python) and asks questions to initialize project variables, generating the project structure including databricks.yml, resource definitions, and source/test folders. Deploy is 'bundle deploy' and validation is 'bundle validate'.","source":"docs.databricks.com/aws/en/dev-tools/bundles"},{"id":"Q611","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"A CI pipeline needs to deploy a bundle whose databricks.yml defines targets 'dev', 'staging', and 'prod'. Which command deploys only to production?","options":["databricks bundle deploy --target default","databricks bundle run hello-job --target prod","databricks bundle deploy --target prod","databricks bundle validate --target prod"],"answer":2,"explain":"'databricks bundle deploy --target prod' (or '-t prod') deploys the bundle using the prod target's workspace and settings. 'bundle run' executes a job rather than deploying, 'bundle validate' only validates configuration, and 'default' refers to whichever target is marked default (typically dev).","source":"docs.databricks.com/aws/en/dev-tools/bundles/settings"},{"id":"Q612","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"A bundle target is configured with 'mode: development'. According to the deployment modes documentation, which behavior applies when deploying this target?","options":["Databricks validates that the current Git branch matches the branch specified in the target","All schedules and triggers on deployed resources such as jobs are paused","Databricks requires run_as to be set to a service principal","Deployment of the target is locked to a single concurrent deploy"],"answer":1,"explain":"Development mode pauses all schedules and triggers on deployed resources, prefixes resource names with [dev <user>], tags jobs/pipelines with a dev tag, enables concurrent runs, and disables the deployment lock for faster iteration. Git-branch validation and run_as/path validations are production-mode behaviors.","source":"docs.databricks.com/aws/en/dev-tools/bundles/deployment-modes"},{"id":"Q613","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"An engineer has multiple workspace connection profiles defined in .databrickscfg and wants to see which profiles exist and whether each can authenticate. Which Databricks CLI command should they run?","options":["databricks configure --list","databricks auth profiles","databricks workspace list-profiles","databricks bundle auth"],"answer":1,"explain":"The Databricks CLI provides 'databricks auth profiles' to list all configured profiles and their authentication status. A specific profile can then be selected with the --profile flag or the DATABRICKS_CONFIG_PROFILE environment variable. The other commands do not exist.","source":"docs.databricks.com/aws/en/dev-tools/auth/config-profiles"},{"id":"Q614","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"What is the key capability that Jobs REST API 2.1 introduced over API 2.0?","options":["The ability to schedule jobs with cron expressions","Automatic cluster log delivery to cloud storage","Support for authenticating with personal access tokens","Defining jobs with multiple tasks using a tasks array with task_key and depends_on dependencies"],"answer":3,"explain":"Jobs API 2.1 introduced the multi-task jobs format: a job defines a tasks array where each task has a task_key and depends_on list, enabling DAG-structured workflows in a single job. API 2.0 only supported single-task jobs (the task settings lived at the job level). Cron schedules and PAT authentication existed in 2.0 as well.","source":"docs.databricks.com/aws/en/dev-tools/api/latest/jobs"},{"id":"Q615","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"Using the Jobs REST API, how do you trigger an immediate run of an existing job with job_id 123?","options":["POST /api/2.1/jobs/run-now with JSON body {\"job_id\": 123}","GET /api/2.1/jobs/runs/list?job_id=123","POST /api/2.1/jobs/create with JSON body {\"job_id\": 123}","PATCH /api/2.1/jobs/update with JSON body {\"job_id\": 123}"],"answer":0,"explain":"POST /api/2.1/jobs/run-now with the job_id triggers an immediate run (parameters like python_params or notebook_params can be included). runs/list retrieves run history, create makes a new job, and update modifies job settings without running it.","source":"docs.databricks.com/aws/en/dev-tools/api/latest/jobs"},{"id":"Q616","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"A 15-task job run fails at task 12 due to a transient issue that has been fixed. What does 'repair run' do to recover as efficiently as possible?","options":["Re-runs all 15 tasks from the beginning of the job","Creates a new copy of the job with only tasks 12-15","Re-runs only the unsuccessful tasks and their dependent tasks, skipping tasks that already succeeded","Waits for the next scheduled trigger and re-runs the full job then"],"answer":2,"explain":"Repair run recovers failed or canceled multi-task jobs by re-running only the subset of unsuccessful tasks and any tasks that depend on them; successful tasks are not re-run, reducing recovery time and resources. Repair is supported only for jobs with two or more tasks; single-task jobs are simply triggered again with Run now.","source":"docs.databricks.com/aws/en/jobs/repair-job-failures"},{"id":"Q617","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"A team wants on-call engineers alerted immediately when a production job run fails. What is the built-in mechanism for this?","options":["Schedule a second monitoring job that polls the Jobs UI every minute","Configure job notifications to send email or system destination (webhook/Slack) alerts on run failure","Query system.billing.usage in a loop and email spikes manually","There is no built-in alerting; an external scheduler is required"],"answer":1,"explain":"Jobs support notifications when a run starts, completes successfully, or fails, sent to email addresses or admin-configured system destinations such as webhooks and Slack (which can integrate with tools like PagerDuty). No external polling is needed.","source":"docs.databricks.com/aws/en/admin/workspace-settings/notification-destinations"},{"id":"Q618","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Which list matches the trigger types available for jobs in the Schedules & Triggers configuration?","options":["Scheduled, Table update, File arrival, Model update, Continuous","Cron, Kafka topic, REST webhook, Streaming table, Manual only","Scheduled, Queue-based, Event grid, Lambda invoke","File arrival, Notebook run, Cluster start, Warehouse stop"],"answer":0,"explain":"Jobs can trigger on a time-based schedule (cron), on updates to source tables, on file arrival in a Unity Catalog storage location, on Unity Catalog model updates, or continuously (jobs running in continuous trigger mode are automatically retried with exponential backoff on failure).","source":"docs.databricks.com/aws/en/jobs/triggers"},{"id":"Q619","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"Which statement about file arrival triggers is correct?","options":["They can monitor any S3 or ADLS path registered in the Hive metastore","Overwriting an existing file with the same name triggers a new run","The Storage location must be the root or a subpath of a Unity Catalog external location or Unity Catalog volume","They guarantee exactly one run per file with no debounce options"],"answer":2,"explain":"File arrival triggers monitor the root or a subpath of a Unity Catalog external location or UC volume. Only NEW files trigger runs (overwriting an existing file with the same name does not), and advanced options like 'Minimum time between triggers' can debounce bursts into fewer runs.","source":"docs.databricks.com/aws/en/jobs/file-arrival-triggers"},{"id":"Q620","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":1,"q":"A task named 'ingest' sets a task value with key 'row_count'. How should a downstream task reference this value in its parameters?","options":["${ingest.row_count}","{{job.parameters.row_count}}","dbutils.jobs.taskValues.get(key='row_count') without a task name","{{tasks.ingest.values.row_count}}"],"answer":3,"explain":"Databricks recommends the dynamic value reference pattern {{tasks.<task_name>.values.<value_name>}}, for example {{tasks.ingest.values.row_count}}. This works for any task type that supports parameters, unlike dbutils.jobs.taskValues.get() which requires the upstream task name and only works in Python contexts.","source":"docs.databricks.com/aws/en/jobs/task-values"},{"id":"Q621","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"Which constraints apply to values set with dbutils.jobs.taskValues.set()?","options":["Values must be numeric and cannot exceed 1 MB","Keys must be unique strings within the notebook, values must be expressible as valid JSON, and the JSON representation cannot exceed 48 KiB","Values persist across job runs and workspaces for later reuse","Values can be any Python object, including Spark DataFrames"],"answer":1,"explain":"Task value keys must be strings and unique per notebook, only values expressible as valid JSON are permitted, and the JSON representation cannot exceed 48 KiB. Task values are scoped to a job run (displayed in the task run Output pane), and DataFrames are not JSON-serializable values.","source":"docs.databricks.com/aws/en/jobs/task-values"},{"id":"Q622","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"A team is productionizing a Python ETL module that has pinned third-party dependencies and unit tests run in CI. Which job task type best packages the code with its dependencies?","options":["Notebook task, because it supports dbutils.jobs.taskValues","Python script task, because .py files can be edited in the workspace UI","Python wheel task, because it packages code with dependencies as a built artifact with an entry point","JAR task, because JVM jobs are fastest"],"answer":2,"explain":"A python wheel task runs a packaged Python wheel with a defined entry point, supporting strict dependency management and CI-built artifacts for production. Notebook tasks are best for interactive/iterative work, and Python script tasks run a single .py file (no %run, no packaged dependency management).","source":"docs.databricks.com/aws/en/jobs"},{"id":"Q623","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"A job fails with a driver-level JVM error (for example, java.lang.OutOfMemoryError). Where should the engineer look for the full driver stack traces and stderr output?","options":["The driver logs (driver stderr/stdout) on the cluster's Logs tab, or delivered cluster logs if configured","The system.query.history table's error_message column","The job notification email body","The workspace audit log table"],"answer":0,"explain":"Driver-level output, including full JVM stack traces, appears in the driver's stderr/stdout logs, available from the cluster Logs tab during the cluster's lifetime or via cluster log delivery to cloud storage for terminated clusters. The run details UI shows task errors, but the driver logs hold the complete stderr for driver failures.","source":"docs.databricks.com/aws/en/clusters/configure"},{"id":"Q624","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":2,"q":"A developer runs: val = dbutils.secrets.get(scope='kv', key='api_key') and then prints the variable in a notebook. What output do they see and why?","options":["The secret value, because the user has READ permission on the scope","An authentication error, because secrets cannot be read from notebooks","A base64-encoded string that must be decoded","[REDACTED], because Databricks intentionally redacts secret values displayed in output"],"answer":3,"explain":"Databricks redacts all secret values read with dbutils.secrets.get() (and Spark conf/SQL secret() references): displayed values are replaced with [REDACTED] to prevent accidental exposure. The value is still usable in code at runtime; this is a deliberate security feature, not an error.","source":"docs.databricks.com/aws/en/security/secrets"},{"id":"Q625","cert":"DEP","domain":"Ops: Monitor/Debug/Deploy","difficulty":3,"q":"Which statement best describes Lakeflow Jobs relative to legacy Databricks Jobs (Databricks Workflows)?","options":["Lakeflow Jobs is an external orchestrator that must be deployed alongside Airflow","Lakeflow Jobs is Databricks' native orchestrator (formerly Databricks Workflows) adding data-aware triggers such as file arrival and table update, control-flow tasks, and unified observability, while legacy Jobs remain supported","Lakeflow Jobs replaces legacy Jobs and all existing jobs must be migrated immediately","Lakeflow Jobs only orchestrates streaming pipelines, not notebooks or SQL tasks"],"answer":1,"explain":"Lakeflow Jobs is the evolved native orchestrator (formerly Databricks Workflows): serverless orchestration with data-aware triggers (file arrival, table update), control-flow tasks (If/Else, For Each, Run if), multimodal tasks (notebooks, SQL, scripts, pipelines, models), and built-in observability such as the run timeline view. Legacy Jobs are still supported, and jobs/tasks/triggers remain the core concepts.","source":"docs.databricks.com/aws/en/jobs"},{"id":"Q401","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A data engineering team is designing a new Delta Lake table layout on Databricks. Which statement correctly describes liquid clustering compared to legacy layout techniques?","options":["Liquid clustering requires partition columns to be defined at table creation and a full table rewrite whenever layout keys change.","Liquid clustering is a maintenance command that replaces OPTIMIZE and VACUUM for all Delta tables.","Liquid clustering replaces table partitioning and ZORDER as the recommended data layout technique, and you can redefine clustering keys without rewriting existing data.","Liquid clustering can only be enabled on tables that are already Hive-style partitioned."],"answer":2,"explain":"Databricks recommends liquid clustering for all new tables as the replacement for partitioning and ZORDER. Its key advantage is that clustering keys can be redefined with ALTER TABLE ... CLUSTER BY without rewriting existing data; layout is then applied incrementally by OPTIMIZE. It is not compatible with partitioning or ZORDER on the same table.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q402","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"Which statement correctly creates a new Delta table with liquid clustering enabled from an existing table?","options":["CREATE TABLE sales AS SELECT * FROM staging CLUSTER BY (region);","CREATE TABLE sales CLUSTER BY (region) AS SELECT * FROM staging;","CREATE TABLE sales PARTITIONED BY (region) CLUSTER BY (region) AS SELECT * FROM staging;","ALTER TABLE sales ZORDER BY (region);"],"answer":1,"explain":"For CTAS, the CLUSTER BY phrase must appear after the table name, not in the SELECT clause: CREATE TABLE sales CLUSTER BY (region) AS SELECT .... Clustering is not compatible with PARTITIONED BY, and ZORDER is the legacy layout approach that liquid clustering replaces.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q403","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A Delta table was created with CLUSTER BY (order_date). Query patterns have shifted and most queries now filter on customer_id. What is the recommended way to update the clustering keys?","options":["Re-create the table with CREATE OR REPLACE TABLE ... CLUSTER BY (customer_id) AS SELECT, rewriting all existing data.","Run OPTIMIZE FULL sales ZORDER BY (customer_id); to layer ZORDER on top of the existing clustering.","Switch the table to CLUSTER BY AUTO, which is the only supported way to change clustering keys.","Run ALTER TABLE sales CLUSTER BY (customer_id); and then run OPTIMIZE so the new layout is applied to data."],"answer":3,"explain":"Clustering keys can be changed at any time with ALTER TABLE table_name CLUSTER BY (new_columns) without rewriting existing data. To benefit from the altered columns you must then run OPTIMIZE (OPTIMIZE FULL to force reclustering of previously written data). ZORDER cannot be combined with liquid clustering, and a full table rewrite is unnecessary.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q404","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A team is migrating a large table that currently uses ZORDER BY (user_id) for data layout to liquid clustering. Per Databricks migration guidance, which clustering keys should they start with?","options":["Use the existing ZORDER BY columns (user_id) as the clustering keys.","Combine PARTITIONED BY (date) with CLUSTER BY (user_id), since clustering requires a partition column.","Choose completely unrelated columns to force a full reclustering on the first OPTIMIZE run.","Do not specify any keys; liquid clustering always infers keys from the ZORDER history."],"answer":0,"explain":"Databricks migration guidance: for tables using Z-order indexing, use the ZORDER BY columns as clustering keys; for Hive-style partitioning, use the partition columns; for tables using both, use both sets of columns. Choosing very different columns triggers a large reclustering operation on the first OPTIMIZE run.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q405","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"An engineer runs ALTER TABLE events CLUSTER BY (event_type, country) on an existing unpartitioned Delta table. What happens to the data that was already written before this command?","options":["All existing data files are immediately rewritten and clustered by the ALTER TABLE command itself.","Existing data is automatically and asynchronously clustered by predictive optimization with no further action required.","By default the new clustering is not applied to previously written data; run OPTIMIZE FULL (or OPTIMIZE FULL WHERE predicate) to force reclustering of existing data.","Existing data can never be clustered; only newly appended rows are affected."],"answer":2,"explain":"When you enable clustering on an existing table, the default behavior does not apply clustering to previously written data. To force reclustering of that data, run OPTIMIZE FULL or OPTIMIZE FULL WHERE. Regular OPTIMIZE only incrementally clusters data as it rewrites files. Predictive optimization helps ongoing maintenance but the documented way to force a recluster is OPTIMIZE FULL.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q406","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"On Databricks Runtime 18.1 and above, what is the recommended command sequence to convert a table partitioned by (year, month, day) to liquid clustering using new keys (day, id)?","options":["DEEP CLONE the table to a new location with CLUSTER BY (day, id) enabled on the target.","ALTER TABLE t1 REPLACE PARTITIONED BY WITH CLUSTER BY (day, id); followed by OPTIMIZE t1;","RESTORE TABLE t1 TO VERSION AS OF 0 with the CLUSTER BY option set.","CREATE TABLE t1_like LIKE t1 CLUSTER BY (day, id); and then swap the tables with VACUUM."],"answer":1,"explain":"In DBR 18.1+, ALTER TABLE t1 REPLACE PARTITIONED BY WITH CLUSTER BY (day, id) converts a partitioned Delta table to liquid clustering while minimizing reader and writer downtime, supporting both managed and external tables. You must then run OPTIMIZE to benefit from the altered clustering columns. Databricks recommends keeping new clustering columns similar to the original partition columns; very different columns trigger a large reclustering on the first OPTIMIZE run.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q407","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"A developer proposes CLUSTER BY on six columns for a 5 TB table, including two columns that were added after the first 32 columns of the schema. Which constraints make this plan problematic?","options":["There is no limit on clustering keys; only that all keys must be string or date typed.","The maximum is 4 clustering keys, but columns beyond the first 32 are fine because statistics are always collected for every column.","At most 4 clustering keys are supported, and clustering keys must be columns with statistics collected (by default the first 32 columns); on tables under 10 TB, more keys also degrade single-column filter performance.","Clustering keys are limited to 2 on Unity Catalog managed tables and require predictive optimization."],"answer":2,"explain":"You can specify up to four clustering keys. Clustering keys must have statistics collected, and by default Delta collects statistics for the first 32 columns (delta.dataSkippingNumIndexedCols). Also, for smaller tables (less than 10 TB), using more clustering keys can degrade performance when filtering on a single column. If two columns are highly correlated, only one is needed as a key.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q408","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A team runs OPTIMIZE on a Delta table that has no liquid clustering and no ZORDER clause defined. What does the command do?","options":["It performs bin-packing compaction, rewriting small data files into larger ones to improve read performance; the replaced old files are not deleted until VACUUM runs.","It immediately deletes all data files older than the retention threshold to reduce storage costs.","It only collects column statistics for data skipping without rewriting any files.","It rewrites files clustered by ZORDER on the most-filtered column automatically."],"answer":0,"explain":"Without clustering or ZORDER, OPTIMIZE performs bin-packing optimization (file compaction). OPTIMIZE does not remove old files; you must run VACUUM to remove files no longer referenced. For tables larger than 1 TB, Databricks recommends running OPTIMIZE on a schedule, and predictive optimization can run it automatically on Unity Catalog managed tables.","source":"docs.databricks.com/aws/en/tables/operations/optimize"},{"id":"Q409","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"An engineer attempts to run OPTIMIZE sales ZORDER BY (region); on a table that has liquid clustering enabled. What is the result?","options":["The command succeeds and applies ZORDER on top of the existing clustering keys.","The command succeeds but silently ignores the ZORDER clause when predictive optimization is enabled.","The command succeeds only if the ZORDER columns match the current clustering keys.","The command fails; the ZORDER BY clause cannot be used on tables that use liquid clustering, which replaces ZORDER as the recommended approach."],"answer":3,"explain":"The ZORDER BY clause of OPTIMIZE cannot be used on tables with liquid clustering enabled. Databricks recommends liquid clustering for all new tables instead of Z-ordering; with liquid clustering, OPTIMIZE rewrites data files to group data by the clustering keys.","source":"docs.databricks.com/aws/en/sql/language-manual/delta-optimize"},{"id":"Q410","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A platform team wants hands-off table maintenance for their Unity Catalog managed Delta tables, including compaction and removal of stale files. Which capability provides this?","options":["Auto Loader file notification mode, which compacts files as it ingests them.","Predictive optimization, which automatically runs OPTIMIZE, VACUUM, and ANALYZE asynchronously using serverless compute on Unity Catalog managed tables.","Delta Live Tables expectations, which enforce file layout rules on every batch.","Cluster policies, which schedule OPTIMIZE on the compute attached to each table."],"answer":1,"explain":"Predictive optimization automatically runs OPTIMIZE, VACUUM, and ANALYZE on Unity Catalog managed tables (Delta and Iceberg), eliminating manual maintenance. It runs maintenance operations asynchronously using serverless compute, independent of any cluster you manage. Note that OPTIMIZE executed by predictive optimization does not run ZORDER.","source":"docs.databricks.com/aws/en/optimizations/predictive-optimization"},{"id":"Q411","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"What is the default retention threshold for data files when running VACUUM on a Delta table?","options":["24 hours","30 days","365 days","7 days"],"answer":3,"explain":"The default retention threshold for data files after running VACUUM is 7 days. A higher threshold preserves more time-travel history but increases storage costs. Transaction log files are governed separately (30-day default retention, deleted asynchronously after checkpoints) and are not removed by VACUUM.","source":"docs.databricks.com/aws/en/tables/operations/vacuum"},{"id":"Q412","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A nightly VACUUM job just completed on the sales table with default settings. An analyst then tries to query the table as of a version from three weeks ago. What happens and why?","options":["The time travel query fails because the ability to query table versions older than the retention period is lost after running VACUUM, which removed the underlying data files.","The query succeeds because VACUUM only removes transaction log files, never data files.","The query succeeds because VACUUM archives old versions to cheaper storage automatically.","The query fails only if the cluster was restarted since the VACUUM ran."],"answer":0,"explain":"VACUUM deletes data files no longer referenced by the table and older than the retention threshold (default 7 days). After VACUUM, the ability to query table versions older than the retention period is lost. Raising the retention period preserves more history at the cost of higher cloud storage spend.","source":"docs.databricks.com/aws/en/tables/operations/vacuum"},{"id":"Q413","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"An engineer wants to run VACUUM with a 1-hour retention period to immediately reclaim storage on a busy table that also feeds a long-running Structured Streaming job. What is the documented risk and safeguard?","options":["There is no risk; retention only affects transaction log checkpointing.","The only risk is losing DESCRIBE HISTORY output, which is regenerated automatically.","The main risk is that RESTORE will fail, and a safety check blocks all VACUUM commands on streaming tables.","Long-running jobs may have written files that are not yet committed, and VACUUM could delete these uncommitted files; Databricks strongly recommends at least 7 days, and a safety check (spark.databricks.delta.retentionDurationCheck.enabled) must be deliberately disabled to run such a command."],"answer":3,"explain":"Databricks strongly recommends a retention interval of at least 7 days. Jobs that run for several days might write files that are not yet committed; if retention is too short, VACUUM could delete those uncommitted files before the job completes. A safety check prevents dangerous VACUUM commands and can only be bypassed by setting spark.databricks.delta.retentionDurationCheck.enabled to false.","source":"docs.databricks.com/aws/en/tables/operations/vacuum"},{"id":"Q414","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A team sets the table property delta.targetFileSize on an external Delta table. Which operations make a best-effort attempt to produce files of that size?","options":["OPTIMIZE, liquid clustering, auto compaction, and optimized writes.","Only VACUUM and REORG operations.","Only auto compaction running synchronously after writes.","None; target file sizes are ignored on external tables."],"answer":0,"explain":"When delta.targetFileSize is set, all data layout optimization operations make a best-effort attempt to generate files of the specified size, including OPTIMIZE, liquid clustering, auto compaction, and optimized writes. Note that Unity Catalog managed tables tune file sizes automatically, and if you set an explicit target, Databricks no longer autotunes that table.","source":"docs.databricks.com/aws/en/tables/tune-file-size"},{"id":"Q415","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"For Unity Catalog managed tables with no explicit target file size set, how does Databricks autotune file sizes as tables grow?","options":["Target size is 256 MB for tables smaller than 2.56 TB, grows linearly from 256 MB to 1 GB between 2.56 TB and 10 TB, and is 1 GB for tables larger than 10 TB; setting an explicit targetFileSize disables autotuning for that table.","All tables use a fixed 128 MB target file size regardless of table size.","All tables use a fixed 1 GB target file size once auto compaction is enabled.","Autotuning only applies to external tables; managed tables require manual targetFileSize configuration."],"answer":0,"explain":"Databricks automatically tunes file size based on table size: 256 MB below 2.56 TB, linear growth from 256 MB to 1 GB between 2.56 TB and 10 TB, and 1 GB above 10 TB. Databricks does not autotune tables that have a specific target size configured. Existing files are not re-optimized when the target grows; a fixed targetFileSize can force consolidation.","source":"docs.databricks.com/aws/en/tables/tune-file-size"},{"id":"Q416","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A query uses Scala UDFs, RDD transformations, and Dataset APIs. How does Photon handle this workload?","options":["Photon translates UDFs and RDD code into native C++ for full acceleration.","Photon accelerates UDFs only when they are registered as temporary SQL functions.","Photon accelerates SQL and DataFrame scans natively but does not support UDFs, RDD APIs, or Dataset APIs at all.","Photon does not support UDFs, RDD APIs, or Dataset APIs; when it hits an unsupported operation it transparently falls back to the Spark JVM runtime for that portion of execution."],"answer":3,"explain":"Photon does not support UDFs, RDD APIs, or Dataset APIs, and stateful streaming is also unsupported. When Photon encounters an unsupported operation during execution, it transparently falls back to the Spark runtime for the remainder of that operation; results remain correct but that part of the query loses Photon acceleration.","source":"docs.databricks.com/aws/en/compute/photon"},{"id":"Q417","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"Which statement about Photon and Structured Streaming workloads is correct?","options":["Photon supports all stateful streaming workloads when checkpoints are stored on S3.","Photon supports stateless streaming only, for example writing to a Delta or Parquet sink; stateful streaming is not supported.","Photon does not accelerate any streaming workload.","Photon supports streaming only when the source is Kafka or Kinesis."],"answer":1,"explain":"Photon supports stateless streaming when writing to a Delta or Parquet sink, with supported sources including Delta, Parquet, CSV, JSON, Kafka, and Kinesis. Stateful streaming is not supported by Photon. Photon is enabled by default on classic all-purpose and jobs compute and is the default engine for SQL warehouses.","source":"docs.databricks.com/aws/en/compute/photon"},{"id":"Q418","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A team enabled Photon on their cluster hoping to speed up a dashboard of very short queries that each complete in about one second. What should they expect?","options":["No meaningful improvement, because queries that normally complete in under two seconds are dominated by planning and scheduling overhead rather than data processing.","About 5x improvement on every query, since Photon accelerates all operations equally.","The queries will fail because they are too short for the Photon runtime.","Improvement only if the queries use RDD APIs."],"answer":0,"explain":"Photon provides the greatest benefit for longer-running queries that process large datasets; queries that normally complete in under two seconds do not see meaningful improvement because execution time is dominated by planning and scheduling overhead. Photon delivers up to about 5x better price/performance on TPC-DS-style analytic workloads.","source":"docs.databricks.com/aws/en/compute/photon"},{"id":"Q419","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"What is the key difference between the Databricks disk cache and the Apache Spark cache?","options":["The disk cache requires manual df.cache() calls, while the Spark cache is automatic.","The disk cache only works for non-Delta Parquet files stored in cloud object storage.","The Spark cache is stored as local files on worker nodes, while the disk cache is stored in memory.","The disk cache is triggered automatically on the first read of remote Parquet data (including Delta tables) into files on worker local storage, while the Spark cache requires manual code changes and stores DataFrames as in-memory blocks."],"answer":3,"explain":"The disk cache (formerly Delta cache / DBIO cache) automatically copies remote Parquet files to local SSD storage on the first read, accelerating successive reads; it works for all Parquet data including Delta tables. Apache Spark cache requires manually calling cache()/persist and stores data as in-memory blocks depending on the storage level. Databricks recommends using automatic disk caching.","source":"docs.databricks.com/aws/en/optimizations/disk-cache"},{"id":"Q420","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A team wants to maximize disk cache effectiveness for an interactive analytics cluster. Which approach matches Databricks guidance?","options":["Disable the disk cache and rely on df.cache() before every query.","Store table data in JSON format so the cache can index it.","Configure the cache to use 100 percent of worker memory with spark.databricks.io.cache.maxMetaDataCache.","Choose cache-accelerated worker instance types with SSD volumes; the disk cache is then enabled automatically and uses at most half of the local SSD space, and cached entries are invalidated automatically when data files change."],"answer":3,"explain":"The recommended way to use disk caching is to select worker types with SSD (cache-accelerated) volumes, which are automatically configured for the disk cache. The cache uses at most half the space available on local SSDs and can be tuned with spark.databricks.io.cache.maxDiskUsage. Cache consistency is automatic: entries are invalidated when files are created, deleted, modified, or overwritten.","source":"docs.databricks.com/aws/en/optimizations/disk-cache"},{"id":"Q421","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"After VACUUM removes old files from a table, a user on a long-running cluster can still query an old table version that should no longer be readable. What explains this?","options":["VACUUM DRY RUN was used, which never deletes files.","The cloud provider restored the deleted objects from a recycle bin.","With disk caching enabled, a cluster might still hold data from Parquet files that VACUUM deleted; restarting the cluster removes the cached data.","Time travel is always available for 30 days regardless of VACUUM."],"answer":2,"explain":"A documented VACUUM caveat: when disk caching is enabled, a cluster might contain data from Parquet files that have been deleted by VACUUM, so queries against previous table versions might still return data from the local cache. Restarting the cluster removes the cached data. This matters for compliance when deleted records must be physically inaccessible.","source":"docs.databricks.com/aws/en/tables/operations/vacuum"},{"id":"Q422","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A nightly batch ETL pipeline currently runs on an all-purpose cluster that stays on around the clock. Which change most directly reduces compute cost per Databricks guidance?","options":["Keep the all-purpose cluster but add more workers so the job finishes sooner.","Switch to a larger driver node to speed up scheduling.","Run the workload as a job on job compute, which bills non-interactive workloads at a significantly lower DBU rate than all-purpose compute and terminates when the job completes.","Move the notebook code into a dashboard refresh on a SQL warehouse."],"answer":2,"explain":"On job compute, non-interactive workloads cost significantly less than on all-purpose compute (lower DBU pricing), and job clusters terminate when the job finishes, avoiding idle cost. Multitask jobs can also reuse compute across tasks so startup cost is paid once per job. All-purpose compute is intended for interactive use.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q423","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"A team configures a cost-optimized cluster for a fault-tolerant batch workload. Which spot instance strategy follows Databricks recommendations?","options":["Use spot instances for all nodes including the driver for maximum savings.","Keep the driver on an on-demand instance and use spot instances for worker nodes; spot is suitable when the workload tolerates delays from evictions.","Use spot instances only for the driver and on-demand for workers.","Spot instances cannot be combined with autoscaling, so choose one or the other."],"answer":1,"explain":"Spot instances use excess cloud VM capacity at lower prices. Databricks recommends that the first instance (the Spark driver) always be an on-demand VM, with spot instances on workers. Spot is a good choice for workloads where it is acceptable to take longer because one or more spot instances are evicted by the cloud provider.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q424","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Users complain that interactive clusters take 5-10 minutes to start each morning. How do Databricks pools help, and what are the cost implications?","options":["Pools bill DBUs for idle instances, making them more expensive than regular clusters.","Pools pre-install datasets so queries skip reading from cloud storage.","Pools keep a set of idle, ready-to-use instances that reduce cluster start and auto-scaling time; Databricks charges no DBUs while instances are idle in the pool, though cloud provider VM billing still applies.","Pools are only available for SQL warehouses and serverless compute."],"answer":2,"explain":"Pools are a set of idle, ready-to-use instances. When clusters use idle instances from a pool, cluster start and autoscaling times are reduced. Databricks does not charge DBUs while instances are idle in the pool, but the instance provider (cloud VM) billing does apply. Pools work for classic compute including interactive and jobs clusters.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q425","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Workspace admins want to prevent runaway spend from user-created clusters. Which combination of controls do Databricks cost best practices recommend?","options":["Enforce compute policies that enable autoscaling with a minimum worker count, require auto termination (for example 1 hour), and restrict which VM instance types can be selected.","Disable the compute API so users can only use notebooks.","Set every cluster to a fixed size of 20 workers with no auto termination.","Require all users to share one all-purpose cluster with spot instances on the driver."],"answer":0,"explain":"Compute policies can enforce cost-specific restrictions: enable autoscaling with set minimums, enable auto termination with a reasonable idle timeout, ensure only cost-efficient VM instance types are selectable, and apply a spot instance strategy. T-shirt sized policies (Small/Medium/Large) standardize configurations. Auto termination shuts down idle interactive compute.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q426","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"A nightly job performs heavy shuffles and frequently spills to disk. Which instance family guidance gives the best price/performance for this workload?","options":["Storage-optimized instances, because they are recommended for heavy shuffle and spill.","Compute-optimized instances, because they are recommended for heavy shuffle and spill.","Memory-optimized instances, which are recommended for workloads with heavy shuffle and spill (along with ML workloads).","GPU-optimized instances, because spills are GPU-bound."],"answer":2,"explain":"Databricks guidance: memory-optimized instances for ML, heavy shuffle, and spill workloads; compute-optimized for structured streaming and maintenance jobs such as OPTIMIZE and VACUUM; storage-optimized for workloads that benefit from caching, such as ad hoc and interactive analysis; GPU only for workloads with GPU-accelerated libraries.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q427","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"How does the cost model for serverless compute differ from classic clusters on Databricks?","options":["For serverless services, the DBU rate already includes the virtual machine costs, and compute starts and scales in seconds so idle capacity is terminated instead of being paid for separately.","Serverless compute bills cloud VMs separately on top of DBUs, just like classic compute.","Serverless compute requires you to maintain warm pools of EC2 instances to avoid startup time.","Serverless compute is billed per GB of storage rather than per DBU."],"answer":0,"explain":"Total cost on Databricks is DBUs plus VM, disk, and network costs, but for serverless services the DBU cost already includes the virtual machine costs. Serverless compute also starts and scales in seconds, terminates idle resources, and serverless SQL warehouses scale down earlier than non-serverless warehouses, improving user experience while lowering cost.","source":"docs.databricks.com/aws/en/lakehouse-architecture/cost-optimization/best-practices"},{"id":"Q428","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Finance wants an estimated Databricks cost per job run, broken down by SKU list price. Which approach is correct?","options":["Query system.compute.clusters and multiply runtime minutes by a fixed DBU rate per worker.","Query system.billing.usage, group by usage_metadata.job_id and usage_metadata.job_run_id, and join system.billing.list_prices on sku_name to estimate cost from usage_quantity.","Query system.access.audit and join it to workspace-level usage detail tags.","Download the cloud provider VM invoice and attribute VM hours to job IDs manually."],"answer":1,"explain":"The system.billing.usage table records all billable usage with columns such as sku_name, usage_quantity, usage_metadata (including job_id and job_run_id for job compute), custom_tags, and identity_metadata for attribution. Joining to system.billing.list_prices on sku_name lets you estimate cost. Job compute and serverless compute provide precise job-level attribution via usage_metadata.","source":"docs.databricks.com/aws/en/admin/usage/system-tables"},{"id":"Q429","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"Which statement best describes adaptive query execution (AQE) on Databricks?","options":["AQE is disabled by default and must be enabled per query with a hint.","AQE is a storage-level optimization that rewrites Delta files during queries.","AQE only applies to Structured Streaming queries with multiple micro-batches.","AQE is runtime re-optimization enabled by default that uses statistics gathered after shuffle/broadcast exchanges to convert sort-merge joins into broadcast hash joins, coalesce small partitions, handle skew joins, and propagate empty relations."],"answer":3,"explain":"AQE re-optimizes queries during execution using accurate runtime statistics available at the end of a query stage. It is enabled by default and applies to non-streaming queries containing at least one exchange (join, aggregate, window) or subquery. Its four major features are dynamic join strategy conversion, partition coalescing, skew join handling, and empty relation propagation.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q430","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"Using default AQE settings, when is a partition considered skewed and what does AQE do with it?","options":["When its size is both more than 5 times the median partition size and greater than 256 MB, AQE splits (and replicates data if needed) the skewed partition into roughly evenly sized tasks.","When its size is more than 2 times the median partition size, AQE broadcasts the partition to all executors.","When its size exceeds 64 MB, AQE coalesces it with neighboring partitions.","Skew join handling is disabled by default and requires salting to activate."],"answer":0,"explain":"With default settings, a partition is considered skewed when both partition size > skewedPartitionFactor (5) times the median partition size and partition size > skewedPartitionThresholdInBytes (256 MB). AQE then dynamically handles skew in sort-merge and shuffle hash joins by splitting skewed tasks into roughly evenly sized tasks, replicating data if needed. Skew join handling is enabled by default; salting is a manual alternative for cases AQE does not cover, such as skewed aggregations.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q431","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"What is the default runtime broadcast join threshold on Databricks (spark.databricks.adaptive.autoBroadcastJoinThreshold), below which AQE can convert a sort-merge join into a broadcast hash join?","options":["10 MB","64 MB","128 MB","30 MB"],"answer":3,"explain":"The default value of spark.databricks.adaptive.autoBroadcastJoinThreshold is 30 MB. At runtime, if the actual size of one side of a join is below this threshold, AQE can dynamically convert a sort-merge join into a broadcast hash join, avoiding a costly shuffle of the larger side.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q432","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"A 4 TB sales fact table joins a 150 MB product dimension table. AQE is enabled, but the plan still shows a SortMergeJoin with a long shuffle phase on the fact table. What is the most effective fix?","options":["Increase spark.sql.shuffle.partitions from 200 to 8000 so each task handles less data.","Force a broadcast hash join for the dimension, for example with the /*+ BROADCAST(products) */ hint, so the small table is sent to every executor and the fact table is not shuffled.","Run OPTIMIZE sales ZORDER BY (product_id) and retry the join.","Disable AQE so the optimizer trusts static statistics."],"answer":1,"explain":"The dimension (150 MB) is far above the 30 MB default autoBroadcastJoinThreshold, so the planner and AQE keep the sort-merge join. A broadcast hint (/*+ BROADCAST(t) */) forces a broadcast hash join: the small side is broadcast to executors and the large side avoids the shuffle entirely. Raising the autoBroadcastJoinThreshold is another option. ZORDER does not change join strategy, and disabling AQE removes useful runtime re-optimization.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q433","cert":"DEP","domain":"Performance & Cost","difficulty":2,"q":"How does Delta Lake data skipping reduce the amount of data scanned at query time?","options":["It compresses scanned files with ZSTD before returning results to the driver.","It maintains a Bloom filter index for every column by default.","It uses file-level column statistics such as min and max values recorded in the transaction log to skip files that cannot contain matching rows for query filters.","It caches query results in the driver memory for repeated executions."],"answer":2,"explain":"Delta Lake data skipping relies on per-file column statistics (for example min/max) stored in the transaction log: files whose stat ranges cannot match the filter are skipped. Statistics are collected for the first 32 columns by default (delta.dataSkippingNumIndexedCols). Layout optimizations like liquid clustering and ZORDER improve skipping by co-locating similar values in the same files.","source":"docs.databricks.com/aws/en/tables/data-skipping"},{"id":"Q434","cert":"DEP","domain":"Performance & Cost","difficulty":1,"q":"A table is partitioned by user_id, which has millions of distinct values. Queries filter mostly on user_id and country. What problem does this partitioning scheme most likely cause?","options":["Over-partitioning: a high-cardinality partition column creates a huge number of tiny partitions and small files, adding metadata overhead and hurting write and read performance; liquid clustering is the recommended approach for such columns.","Under-partitioning: too few partitions mean each query scans the whole table.","No problem, since partition pruning always reduces scans proportionally to cardinality.","The table becomes read-only because Delta cannot prune millions of partitions."],"answer":0,"explain":"Partitioning on a high-cardinality column like user_id causes over-partitioning: many small files, more transaction log metadata, slower writes and slower reads. Databricks recommends liquid clustering for queries filtering on high-cardinality columns and for tables where a typical partition key would return too many or too few partitions.","source":"docs.databricks.com/aws/en/tables/clustering"},{"id":"Q435","cert":"DEP","domain":"Performance & Cost","difficulty":3,"q":"A nightly aggregation does GROUP BY country, and one country accounts for 80% of rows. One task always runs 30 minutes while all others finish in seconds. AQE is enabled but does not help. What is the appropriate fix?","options":["Increase the driver node size so the slow task gets more memory.","Salt the skewed key: add a random salt value (for example 0-15) to country, aggregate grouped by (country, salt), then run a second lightweight aggregation on the partial results, spreading the hot key across many tasks.","Broadcast the country column to all executors.","Run VACUUM on the source table to reduce the data scanned."],"answer":1,"explain":"AQE skew join handling only applies to sort-merge and shuffle hash joins, not skewed aggregations. For a skewed GROUP BY, use salting: append a random suffix to the hot key, aggregate on (key, salt), then re-aggregate the partial results. This splits the straggler task into many evenly sized tasks. Broadcasting and VACUUM do not address aggregation skew, and driver size does not help a single executor task.","source":"docs.databricks.com/aws/en/optimizations/aqe"},{"id":"Q501","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"In Unity Catalog, the fully qualified name of a table follows which namespace structure?","options":["database.table","catalog.schema.table","workspace.catalog.schema.table","metastore.schema.table"],"answer":1,"explain":"Unity Catalog uses a three-level namespace: catalog.schema.table. The metastore (one per region per account) sits above catalogs, and workspaces are not part of table names. The legacy hive_metastore appears as a top-level catalog so old two-level names can still be resolved.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog"},{"id":"Q502","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"A Unity Catalog row filter is a SQL UDF applied with ALTER TABLE ... SET ROW FILTER. What must the function return, and what happens when it returns FALSE or NULL for a row?","options":["STRING; the row values are replaced with a redaction token","BOOLEAN; the row is always included because NULL means unknown","INT; only the first N rows are returned","BOOLEAN; the row is filtered out of query results"],"answer":3,"explain":"The row filter function's return type must be BOOLEAN. It is evaluated per row at query time; rows where it returns FALSE or NULL are excluded from all query results. Column masks (not row filters) transform values.","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-row-filter"},{"id":"Q503","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"What is the relationship between a storage credential and an external location in Unity Catalog?","options":["An external location combines a cloud storage path with a storage credential that authorizes access to that path","A storage credential stores the cloud path, and an external location stores the IAM role","They are two names for the same securable object","Each external location requires its own dedicated storage credential; credentials cannot be reused"],"answer":0,"explain":"A storage credential is a securable object that holds a long-term cloud credential (e.g., an IAM role). An external location is a securable object that pairs a cloud storage path with a storage credential. Multiple external locations can reference the same storage credential.","source":"docs.databricks.com/aws/en/connect/unity-catalog/cloud-storage"},{"id":"Q504","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"How does Unity Catalog capture data lineage for queries run on Databricks?","options":["Developers must register lineage manually after each job via REST API","Lineage is only captured for Delta Live Tables pipelines","Unity Catalog captures lineage automatically, down to the column level, and aggregates it across workspaces attached to the metastore","Lineage requires enabling a separate audit log delivery destination"],"answer":2,"explain":"UC captures lineage automatically for queries (SQL, Python, Scala, R) down to table and column level, plus notebooks, jobs/workflows, and dashboards, across all workspaces on the metastore. It is queryable in system.access.table_lineage / system.access.column_lineage (rolling 1-year retention) or the Catalog Explorer lineage tab; no manual registration is needed.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage"},{"id":"Q505","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"A user has been granted USE CATALOG on catalog sales and USE SCHEMA on sales.finance, but has no SELECT privilege on sales.finance.transactions. What can the user do?","options":["Query all data in transactions because USE grants read access","Browse and see that transactions exists in the schema, but any SELECT on its data fails","Nothing at all — USE CATALOG grants no visibility whatsoever","Modify the table's grants because USE includes MANAGE"],"answer":1,"explain":"USE CATALOG and USE SCHEMA are usage privileges: they let a principal interact with objects in the container (e.g., browse/reference them) but grant no data access. To read a table a user needs SELECT on the table plus USE CATALOG on the parent catalog and USE SCHEMA on the parent schema.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/access-control/privileges-reference"},{"id":"Q506","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"A provider uses Databricks-to-Open (D2O) sharing to share data with a partner that is NOT on Databricks. How does the recipient authenticate?","options":["With a Databricks workspace username and password","By assuming an IAM role in the provider's cloud account","With the provider's Unity Catalog metastore sharing identifier","Using a long-lived bearer token delivered via a one-time activation link/credential file, or OIDC federation"],"answer":3,"explain":"In D2O (open) sharing, the provider creates an open recipient authenticated either by a bearer token (Databricks generates a credential file plus a one-time activation link) or by OIDC federation. The recipient reads data with open Delta Sharing connectors (pandas, Spark, Power BI, etc.). The sharing identifier is used in Databricks-to-Databricks sharing instead.","source":"docs.databricks.com/aws/en/opensharing/share-data-open"},{"id":"Q507","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"Which statement correctly applies a column mask function ssn_mask to column ssn of table main.hr.employees?","options":["ALTER TABLE main.hr.employees ALTER COLUMN ssn SET MASK ssn_mask;","ALTER TABLE main.hr.employees SET COLUMN MASK ssn_mask ON (ssn);","GRANT MASK ssn_mask ON TABLE main.hr.employees (ssn);","CREATE MASK POLICY ssn_mask ON main.hr.employees (ssn);"],"answer":0,"explain":"Column masks are SQL UDFs attached with: ALTER TABLE ... ALTER COLUMN <col> SET MASK <function>. The mask is evaluated at query time and its return value replaces the column value. Row filters use the different syntax ALTER TABLE ... SET ROW FILTER <function> ON (<columns>).","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q508","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"What is a Unity Catalog managed volume?","options":["A Kubernetes volume mounted into cluster pods","A UC-governed storage location for files and non-tabular data (datasets, models, artifacts) managed by Unity Catalog","Temporary scratch storage on cluster local disks","A DBFS mount backed by an instance profile"],"answer":1,"explain":"Volumes are UC-governed storage for non-tabular files governed with the same three-level namespace, privileges (READ VOLUME / WRITE VOLUME), lineage, and auditing as tables. Managed volumes are created in UC-managed storage; external volumes add governance to existing cloud storage paths.","source":"docs.databricks.com/aws/en/volumes"},{"id":"Q509","cert":"DEP","domain":"Security & Governance","difficulty":1,"q":"Which system table should you query to audit who accessed which Unity Catalog data and when?","options":["system.billing.usage","system.lineage.events","system.access.audit","system.information_schema.table_history"],"answer":2,"explain":"The audit log system table system.access.audit records data access and system activity at the account level. Lineage lives in system.access.table_lineage / column_lineage, and billable usage in system.billing.usage.","source":"docs.databricks.com/aws/en/admin/account-settings/audit-logs"},{"id":"Q510","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"An admin runs: GRANT SELECT ON SCHEMA main.finance TO GROUP analysts. What is the effect on tables in the schema?","options":["SELECT applies to all current and future tables created in the schema","SELECT applies only to tables that existed at grant time","SELECT applies only to tables created after the grant","The grant has no effect; SELECT can only be granted per table"],"answer":0,"explain":"Unity Catalog privileges inherit down the hierarchy: a privilege granted on a schema (or catalog) applies to all current and future securable objects it contains. This inheritance is a key advantage over the legacy Hive metastore ACL model.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/manage-privileges"},{"id":"Q511","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Which statement about governed tags in Unity Catalog is correct?","options":["They are free-form labels defined at the workspace level","They are account-level key-value pairs with administrator-defined allowed values and permissions controlling who can assign them","They can only be created by the AI classification agent","They can only be applied to tables and views"],"answer":1,"explain":"Governed tags are the attribute foundation of ABAC: an account-level vocabulary of keys and allowed values (e.g., pii:ssn, sensitivity:confidential) with permissions (ASSIGN) controlling who can apply which tags. They can be applied to catalogs, schemas, tables, columns, models, and volumes, and inherit from parent to child.","source":"docs.databricks.com/aws/en
