/data-governance/unity-catalog/abac/core-concepts"},{"id":"Q512","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"What is the main advantage of ABAC policies over individually configured table-level row filters and column masks?","options":["ABAC policies evaluate faster because they bypass Unity Catalog","ABAC can apply row filters and column masks without UDFs","ABAC policies replace GRANT/REVOKE and make privileges unnecessary","One policy attached at catalog or schema level automatically enforces row filters/column masks on every object matching its tag conditions, including newly created ones"],"answer":3,"explain":"ABAC policies attach at catalog/schema level and match objects by governed-tag conditions, so a single policy protects all matching tables and columns — current and future — enabling scale, consistency, and separation of duties. Table-level filters/masks are configured per table; ABAC coexists with (does not replace) GRANTs.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/abac/core-concepts"},{"id":"Q513","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"When should you choose a dynamic view instead of table-level row filters and column masks?","options":["When you need fine-grained access control that spans multiple source tables or reshapes/joins data for consumers","When you want to enforce security on a single table without creating new objects","When you need masking based on group membership","When standard access mode compute is unavailable"],"answer":2,"explain":"Use dynamic views when exposing a curated, transformed, or joined version of one or more base tables to users without underlying-table access (they use is_account_group_member()/current_user() in the view definition and support predicate pushdown). Use row filters/column masks when controlling access on individual tables without introducing new objects.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/abac/abac-vs-rls-cm"},{"id":"Q514","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"How do the legacy Hive metastore and Unity Catalog metastore differ?","options":["The Hive metastore is account-scoped and shared across regions; UC is workspace-local","The Hive metastore is workspace-local and lacks UC features like central access control, built-in auditing, and lineage; the UC metastore is one per region per account","Both provide identical governance; UC only adds a UI","The Hive metastore supports row filters and column masks natively"],"answer":1,"explain":"hive_metastore is a per-workspace legacy metadata store; its tables do not benefit from UC governance (centralized ACLs, auditing, lineage). A Unity Catalog metastore is created at account level, one per region, and can be shared by many workspaces. Databricks recommends migrating and disabling direct Hive metastore access.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/hive-metastore"},{"id":"Q515","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"During a migration, a team wants to upgrade a managed table in hive_metastore to a managed table in Unity Catalog. Which approach does Databricks recommend?","options":["Run MSCK REPAIR TABLE against the new catalog","Create an external location over the old table's storage root","Register the old table's underlying path as an external table","DEEP CLONE the hive_metastore table into a UC catalog.schema.table"],"answer":3,"explain":"For managed-to-managed upgrades, Databricks recommends CREATE OR REPLACE TABLE ... DEEP CLONE hive_metastore.<schema>.<table> so data is copied into UC-managed storage. SYNC (TABLE/SCHEMA ... AS EXTERNAL) is the recommended tool for upgrading Hive external tables to UC external tables.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/migrate"},{"id":"Q516","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"What does Unity Catalog credential vending provide to an external engine (e.g., DuckDB, Trino) accessing UC-registered data through the open REST APIs?","options":["Short-lived, scoped cloud storage credentials requested via the UC REST API that inherit the requesting principal's privileges","A long-lived IAM role assigned directly to the external engine","A personal access token belonging to a metastore admin","A copy of the storage credential's secret so the engine can re-authenticate indefinitely"],"answer":0,"explain":"Credential vending issues time-limited, downscoped cloud storage credentials on demand through the UC REST API (table, path, and volume credential vending). The catalog keeps permanent access; the engine gets just-in-time access scoped to the object, and the vended credentials inherit the privileges of the requesting Databricks principal.","source":"docs.databricks.com/aws/en/external-access/credential-vending"},{"id":"Q517","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"In Databricks-to-Databricks (D2D) Delta Sharing, how does the provider identify the recipient organization?","options":["By the recipient's email address","By the unique sharing identifier of the recipient's Unity Catalog metastore","By a bearer token the recipient pastes into Catalog Explorer","By the recipient's cloud account number"],"answer":1,"explain":"In D2D sharing the recipient gives the provider their metastore's unique sharing identifier. Once the provider grants the recipient access to a share, the shared objects appear directly in the recipient's Unity Catalog (read-only) with no data copy; auth is handled by Databricks token exchange rather than bearer tokens.","source":"docs.databricks.com/aws/en/opensharing/share-data-databricks"},{"id":"Q518","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Which statement describes the Databricks Clean Rooms trust model?","options":["The clean room creator holds admin rights over all collaborators","Collaborators can query each other's raw tables through the central catalog","All collaborators have equal privileges, and a notebook must be approved by every collaborator before it can run","Code approval is only required the first time a notebook runs"],"answer":2,"explain":"Databricks Clean Rooms use a 'no-trust' model: all collaborators (including the creator) have equal privileges, and every collaborator must approve a notebook before it can run. Data is contributed via Delta Sharing; collaborators see only schemas (column names/types), never raw rows. Clean rooms run on serverless compute in an isolated Databricks-managed environment.","source":"docs.databricks.com/aws/en/clean-rooms"},{"id":"Q519","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Which compute access mode lets multiple users share the same compute while Unity Catalog enforces per-user data access?","options":["Dedicated (single user) access mode","No isolation shared access mode","Standard (formerly shared) access mode","Credential passthrough"],"answer":2,"explain":"Standard access mode (formerly shared) supports multiple users on one compute with UC user workload isolation — commands run under the submitting user's identity so UC privileges are enforced per user. Dedicated (single-user) mode is UC-compatible but restricted to one user/service principal; no-isolation shared and credential passthrough are legacy modes that cannot access UC data.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices"},{"id":"Q520","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Which privilege is NOT included when you grant ALL PRIVILEGES on a Unity Catalog securable object?","options":["SELECT","CREATE TABLE","MODIFY","MANAGE"],"answer":3,"explain":"ALL PRIVILEGES includes all privileges except MANAGE (and EXTERNAL USE LOCATION / EXTERNAL USE SCHEMA). MANAGE — which lets a principal grant/revoke privileges, transfer ownership, and drop the object — must be granted explicitly, which is why best practice says to be sparing with both ALL PRIVILEGES and MANAGE.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/best-practices"},{"id":"Q521","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"Which statement about column mask functions in Unity Catalog is correct?","options":["They must return BOOLEAN and are applied at write time","They are evaluated at query time, can reference identity functions like is_account_group_member(), and their return value replaces the column value","Only one masking function can exist per schema","They can only mask STRING columns"],"answer":1,"explain":"A column mask is a SQL UDF whose result replaces the column's original value whenever rows are fetched; evaluation happens at query time. It commonly branches on is_account_group_member()/current_user() to decide whether to redact, can take extra referenced columns via USING COLUMNS, and each column can have one mask applied.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q522","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"An external engine requests vended credentials to READ files in a Unity Catalog volume. Which privileges must the requesting Databricks principal hold?","options":["EXTERNAL USE SCHEMA on the schema containing the volume, plus READ VOLUME","SELECT on the volume and USE SCHEMA on its parent","READ FILES on the volume's external location","MANAGE on the parent catalog"],"answer":0,"explain":"Volume credential vending requires EXTERNAL USE SCHEMA on the schema containing the volume plus READ VOLUME for read access (READ VOLUME and WRITE VOLUME for write access). UC then returns short-lived credentials scoped to the volume's storage path.","source":"docs.databricks.com/aws/en/external-access/credential-vending"},{"id":"Q523","cert":"DEP","domain":"Security & Governance","difficulty":2,"q":"A governance team must continuously discover and protect PII (names, emails, SSNs) across hundreds of catalogs and apply consistent access rules. What is the recommended Databricks approach?","options":["Manually write a masking UDF for every sensitive column","Use Data Classification's AI agent to automatically classify and tag sensitive data, then create ABAC policies keyed on governed tags like pii:ssn","Move all PII into a separate workspace-local Hive metastore","Grant ALL PRIVILEGES only to a single auditor group and block everyone else"],"answer":1,"explain":"Databricks Data Classification uses an AI agent to automatically discover and tag sensitive data (PII, PCI, GDPR, HIPAA labels) across catalogs, providing continuous visibility. Those tags then drive ABAC row-filter/column-mask policies so protection applies automatically as data is tagged or created.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification"},{"id":"Q524","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"A table has a table-level row filter applied, and an ABAC row-filter policy in the parent catalog also matches the same table for the same user. How does Databricks resolve this?","options":["The more restrictive of the two filters silently wins","Both filters are chained together with AND logic","The table-level filter takes precedence and the policy is ignored","If both apply the same filter function, the query runs; if they apply different functions, access is blocked with an error"],"answer":3,"explain":"Databricks evaluates conflict by comparing the functions applied, not the data output. If an ABAC policy and a table-level filter apply the same function for the same user, execution is allowed; if different functions are applied, Databricks blocks access and returns an error — even if the two functions would produce identical output.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/abac/abac-vs-rls-cm"},{"id":"Q525","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"Which statement about the ROW FILTER clause's ON (...) input parameters is correct?","options":["At least one column of the subject table must be passed","Only STRING and numeric columns can be passed to the filter function","Parameters may only reference columns that have a column mask applied","It can pass zero columns (UDF takes no parameters) or constant literals whose types match the function parameters"],"answer":3,"explain":"ROW FILTER func ON (col | constant_literal, ...) supports passing columns of the subject table, constant literals (STRING, numeric, BOOLEAN, INTERVAL, NULL), or zero input columns — in which case the UDF must accept zero parameters and return a Boolean independent of row values (e.g., an is_account_group_member check).","source":"docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-row-filter"},{"id":"Q526","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"Which of these is NOT captured in Unity Catalog data lineage?","options":["Queries run on a SQL warehouse","Notebooks and dashboards that consume tables","Resilient Distributed Datasets (RDDs) and global temporary views","Column-level dependencies within a query"],"answer":2,"explain":"UC lineage covers SQL/Python/Scala/R queries down to column level, plus notebooks, workflows, and dashboards. Known limitations: RDDs are not captured, global temp views are not captured, and system.information_schema tables are excluded. Lineage system tables keep a rolling 1-year window.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/data-lineage"},{"id":"Q527","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"Which set of assets can be included in a share for Databricks-to-Databricks (D2D) sharing but NOT for Databricks-to-Open (D2O) sharing?","options":["Delta tables only","Views, Unity Catalog volumes, Unity Catalog models, and notebook files","Parquet files stored in external locations","There is no difference in shareable asset types"],"answer":1,"explain":"With D2O (open) sharing, shares are limited to eligible Delta-format tables. D2D sharing additionally supports views, UC volumes, UC models, and notebook files. Recipients always get read-only access (shared notebooks can be cloned and modified in the recipient workspace).","source":"docs.databricks.com/aws/en/opensharing"},{"id":"Q528","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"Which combination of statements about Databricks Clean Rooms is accurate?","options":["It is locked after creation (no new collaborators), supports up to ten collaborators, runs on serverless compute, and notebooks write output to temporary read-only output tables","New collaborators can join at any time, and there is no limit on collaborator count","Analysis runs on compute inside the creator's workspace using the creator's credentials","Collaborators can inspect each other's row-level data once the clean room is approved"],"answer":0,"explain":"After creation a clean room is locked (no new collaborators), cannot be renamed, and is limited to ten collaborators; if any collaborator deletes it, no tasks can run. Compute is Databricks serverless in a neutral isolated environment, and notebooks produce temporary output tables that collaborators can save read-only into their own metastore. Raw data is never visible to other collaborators.","source":"docs.databricks.com/aws/en/clean-rooms"},{"id":"Q529","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"An analyst group has SELECT on main.hr.employees (plus USE CATALOG/USE SCHEMA). The table has a row filter (dept matches is_account_group_member logic) and a column mask on ssn that returns '***' for non-HR groups. What do analysts see when they SELECT *?","options":["All rows with real ssn values, since SELECT overrides filters","Only rows that pass the row filter, with ssn shown as the mask function's return value","An error, because row filters and column masks cannot be combined on one table","Only rows that pass the filter, with real ssn values because masks require MODIFY"],"answer":1,"explain":"Row filters and column masks compose: the query plan injects the row-filter predicate (rows returning FALSE/NULL are excluded) and evaluates the mask function over the ssn column, replacing its value for users who don't qualify. The analyst's SELECT grant is what authorizes the read; the filter/mask reshape what is returned.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks"},{"id":"Q530","cert":"DEP","domain":"Security & Governance","difficulty":3,"q":"A data steward wants to apply the governed tag pii:ssn to a column. Which combination of privileges is required (per the ABAC tutorial)?","options":["APPLY TAG on the target table alone","ASSIGN on the governed tag alone","Metastore admin rights are always required","ASSIGN privilege on the governed tag plus APPLY TAG privilege on the target table"],"answer":3,"explain":"To apply a governed tag to a column you need the ASSIGN privilege on that governed tag (account admins have it by default) and the APPLY TAG privilege on the target table. This split enforces separation of duties: central governance controls the tag vocabulary while object owners control which objects get tagged.","source":"docs.databricks.com/aws/en/data-governance/unity-catalog/abac/tutorial"},{"id":"Q301","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"A pipeline declares: CONSTRAINT valid_price EXPECT (price > 0). No ON VIOLATION clause is specified. What happens to a record with price = -5?","options":["The record is written to the target dataset, and the violation is tracked in data quality metrics","The record is dropped before being written, and the dropped count is logged","The pipeline update fails and the transaction is rolled back","The record is automatically routed to a quarantine table"],"answer":0,"explain":"The default expectation action is warn (EXPECT in SQL, dp.expect in Python): invalid records are still written to the target, but pass/fail metrics are collected for monitoring. Drop requires ON VIOLATION DROP ROW and fail requires ON VIOLATION FAIL UPDATE.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q302","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"In the medallion architecture, which layer is where data cleansing, validation, deduplication, and normalization are performed?","options":["Bronze","Silver","Gold","All layers perform these operations equally"],"answer":1,"explain":"Bronze holds raw, unvalidated ingested data; silver is explicitly where data cleanup and validation happen (schema enforcement, null handling, deduplication, type casting, joins); gold holds aggregated, business-aligned datasets.","source":"docs.databricks.com/aws/en/lakehouse/medallion"},{"id":"Q303","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"When an AUTO CDC (APPLY CHANGES INTO) flow is declared STORED AS SCD TYPE 2, which columns does the target streaming table include to define each row version's validity period?","options":["__START_AT and __END_AT, with the same data type as the sequence_by column","_sequence_num and _commit_version","valid_from and valid_to","__is_current and __row_hash"],"answer":0,"explain":"For SCD Type 2 targets, pipelines add __START_AT and __END_AT columns; if you explicitly declare the target schema, you must include these columns with the same data type as the SEQUENCE BY field.","source":"docs.databricks.com/aws/en/dlt-ref/dlt-sql-ref-apply-changes-into"},{"id":"Q304","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"What is the key record-processing characteristic of a streaming table in a Lakeflow (Declarative) pipeline?","options":["Every record is reprocessed on each pipeline update to reflect the current source state","Results are recomputed from scratch using batch semantics on every refresh","Only the most recent snapshot of the source is retained in the table","Each record is processed exactly one time, assuming an append-only source"],"answer":3,"explain":"Streaming tables use streaming semantics: each record is processed exactly once (given append-only sources), making them ideal for ingestion and incremental processing. Materialized views, by contrast, recompute results as needed to stay consistent with current source state.","source":"docs.databricks.com/aws/en/ldp/concepts"},{"id":"Q305","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"What does the expression SELECT schema_of_json('[{\"col\":0}]') return?","options":["A struct value parsed from the JSON string","A VARIANT containing the JSON document","A STRING holding the schema in DDL format, e.g. ARRAY<STRUCT<`col`: BIGINT>>","An error, because schema_of_json only works on tables"],"answer":2,"explain":"schema_of_json returns the schema of a JSON string in DDL format as a STRING (an array of structs definition with derived SQL types). To derive the aggregated schema over many JSON strings, use schema_of_json_agg.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/schema_of_json"},{"id":"Q306","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"Which SQL clause prevents records that violate an expectation from being written to the target dataset?","options":["CONSTRAINT ... EXPECT ... ON VIOLATION FAIL UPDATE","CONSTRAINT ... EXPECT ... QUARANTINE ROW","CONSTRAINT ... EXPECT ... ON VIOLATION DROP ROW","CONSTRAINT ... EXPECT ... ON VIOLATION WARN"],"answer":2,"explain":"EXPECT ... ON VIOLATION DROP ROW (Python: expect_or_drop) drops invalid records before they are written; the count of dropped records is logged with dataset metrics. FAIL UPDATE stops the update; WARN keeps invalid records.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q307","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Which of the following is NOT allowed inside an expectation constraint expression?","options":["SQL functions such as year(transaction_date)","CASE statements","Complex boolean logic combining AND/OR conditions","Subqueries referencing other tables"],"answer":3,"explain":"Constraints must be valid SQL boolean expressions, but they cannot contain custom Python functions, external service calls, or subqueries referencing other tables. SQL functions, CASE expressions, and boolean logic are all supported.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q308","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"A Python pipeline calls dp.create_auto_cdc_flow(...) without setting stored_as_scd_type. How are changes applied by default?","options":["SCD Type 2, retaining full change history","SCD Type 1, updating records in place with no history","Bitemporal, tracking business and system time","The flow fails because an SCD type is required"],"answer":1,"explain":"The default for stored_as_scd_type (and for the SQL AUTO CDC / APPLY CHANGES INTO syntax without STORED AS) is SCD Type 1: updates overwrite the current state without retaining history. SCD Type 2 must be requested explicitly.","source":"docs.databricks.com/aws/en/ldp/developer/ldp-python-ref-apply-changes"},{"id":"Q309","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"In an AUTO CDC flow, what is the purpose of the SEQUENCE BY column?","options":["It identifies the primary key used to match change events to target rows","It filters out delete events before they are applied","It orders change events so out-of-order and late-arriving events are applied correctly","It controls how frequently the target streaming table is refreshed"],"answer":2,"explain":"SEQUENCE BY orders the CDC events; the engine automatically handles out-of-order records based on this sequencing column when building SCD tables. KEYS is the clause that identifies matching rows, and refresh frequency is a pipeline setting, not a CDC clause.","source":"docs.databricks.com/aws/en/dlt/cdc"},{"id":"Q310","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Auto Loader ingests JSON files and no schema is supplied. How are columns typed during schema inference by default?","options":["Types are inferred from sampled data (e.g., INT, DATE, DOUBLE)","All columns are inferred as STRING","All columns are inferred as VARIANT","Inference is disabled and the read fails until a schema is provided"],"answer":1,"explain":"For formats that do not encode data types (JSON, CSV, XML), Auto Loader infers all columns as strings by default to avoid schema-evolution issues from type mismatches. Set cloudFiles.inferColumnTypes to true to sample-based type inference, or use schema hints.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"},{"id":"Q311","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"What is stored at the path given by the cloudFiles.schemaLocation option in Auto Loader?","options":["A quarantine folder for malformed records","The checkpoint that guarantees exactly-once file processing","A cache of the file listing used in directory listing mode","The inferred schema and any subsequent schema changes"],"answer":3,"explain":"cloudFiles.schemaLocation (required for schema inference) stores the inferred schema and subsequent changes to it, letting Auto Loader detect and evolve the schema across stream restarts. The checkpoint location is a separate concept.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"},{"id":"Q312","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"A pipeline dataset joins several dimension tables that receive updates and deletes, and results must always stay consistent with the current source state. Which dataset type fits best?","options":["A streaming table, because it processes each record exactly once","A temporary view, because it recomputes when queried","A materialized view, because it recomputes results as needed when sources change","An AUTO CDC SCD Type 1 target, because it overwrites changed rows"],"answer":2,"explain":"When sources change via updates and deletes, or queries aggregate/join data, materialized views keep results consistent with the current source state. Streaming tables are designed for append-only sources and process each record once; joins in streaming tables do not recompute when dimensions change.","source":"docs.databricks.com/aws/en/ldp/concepts"},{"id":"Q313","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"In dp.create_auto_cdc_flow, what does the except_column_list parameter do?","options":["Prevents SCD Type 2 history tracking for the listed columns","Applies delete events only to the listed columns","Excludes the listed columns from the target table","Treats NULL values in the listed columns as updates to keep"],"answer":2,"explain":"except_column_list (SQL: COLUMNS EXCEPT (...)) specifies source columns to exclude from the target, commonly used to drop technical metadata like operation and sequenceNum. Limiting which columns trigger new SCD2 versions is TRACK HISTORY ON ... EXCEPT, and NULL handling is ignore_null_updates.","source":"docs.databricks.com/aws/en/ldp/developer/ldp-python-ref-apply-changes"},{"id":"Q314","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"Which description best fits tables in the gold layer of a medallion architecture?","options":["Raw, unvalidated data stored exactly as ingested from sources","Deduplicated, validated records retaining full detail","Records rejected by data quality checks, kept for reprocessing","Aggregated, business-aligned datasets optimized for BI and reporting"],"answer":3,"explain":"The gold layer contains highly refined, often aggregated datasets aligned with business logic (dimensional models, metrics, summaries) for dashboards, BI tools, and ML consumers. Raw data is bronze; validated detail is silver.","source":"docs.databricks.com/aws/en/lakehouse/medallion"},{"id":"Q315","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"A pipeline must quarantine invalid records for later repair instead of dropping or failing on them. What is the recommended approach with expectations?","options":["Use the built-in ON VIOLATION QUARANTINE ROW clause","Define a separate dataset that selects rows violating the expectations and use it as the quarantine table","Prefix the expectation name with quarantine_ so rows are routed automatically","Set the pipeline configuration pipelines.quarantine.enabled to true"],"answer":1,"explain":"Expectations have only three actions (warn, drop, fail). To quarantine, create an additional table whose query returns the rows that violate expectations, keeping bad records out of the valid target without failing the update — the documented advanced pattern.","source":"docs.databricks.com/aws/en/ldp/expectation-patterns"},{"id":"Q316","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"For which expectation action are data quality metrics NOT recorded?","options":["warn — the default EXPECT behavior","drop — EXPECT ... ON VIOLATION DROP ROW","Both warn and drop, since metrics only cover views","fail — EXPECT ... ON VIOLATION FAIL UPDATE"],"answer":3,"explain":"Tracking metrics are visible for warn and drop actions. Because fail stops the update when an invalid record is detected (rolling back the transaction atomically), metrics are not recorded for it.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q317","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Why does Databricks recommend storing most bronze layer fields as string, VARIANT, or binary?","options":["It is required for Unity Catalog-managed tables","It protects against unexpected source schema changes and avoids dropping data","It enables automatic SCD Type 2 history on every column","It allows Photon to build column indexes automatically"],"answer":1,"explain":"Bronze should preserve raw data fidelity; storing most fields as string, VARIANT, or binary protects against dropped data caused by unexpected schema changes in sources. Conformance and typing happen in silver.","source":"docs.databricks.com/aws/en/lakehouse/medallion"},{"id":"Q318","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"An SCD Type 2 flow is declared with TRACK HISTORY ON EXCEPT (city). A change event arrives that updates only the city column for an existing key. What happens?","options":["A new row version is inserted and the previous version's __END_AT is closed","The update fails because city is excluded from the flow","No new row version is created because only the excluded column changed","The city column is dropped from the target table"],"answer":2,"explain":"TRACK HISTORY ON ... EXCEPT restricts which column changes create a new SCD2 row version: changes to excluded columns are applied without generating history entries. The column stays in the target; only history tracking for it is skipped.","source":"docs.databricks.com/aws/en/dlt/cdc"},{"id":"Q319","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"What does the APPLY AS DELETES WHEN clause (Python: apply_as_deletes) do in an AUTO CDC flow?","options":["Treats matching change events as deletes of the corresponding target rows","Drops records that violate data quality expectations","Physically truncates the entire target table","Soft-deletes rows by setting a flag column to true"],"answer":0,"explain":"APPLY AS DELETES WHEN marks CDC events that should be treated as deletes of the matching target rows (in SCD Type 2, deleting the latest record and re-opening the prior version when applicable). APPLY AS TRUNCATE WHEN is the separate full-truncate clause, supported only for SCD Type 1.","source":"docs.databricks.com/aws/en/dlt/cdc"},{"id":"Q320","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Which statement correctly contrasts a view with a materialized view in a Lakeflow pipeline?","options":["A view stores precomputed results; a materialized view recomputes results on every query","A view is computed on the fly each time it is queried, while a materialized view precomputes and stores its results","Expectations can be applied to views but never to materialized views","A view processes each input record exactly one time"],"answer":1,"explain":"A view is defined by a query but materializes nothing — it is recalculated when queried. A materialized view precomputes and stores its results, trading extra storage for faster queries. Exactly-once processing is a streaming table property, not a view property.","source":"docs.databricks.com/aws/en/data-engineering/tables-views"},{"id":"Q321","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Which slowly changing dimension type is NOT natively supported by the AUTO CDC STORED AS clause and must be implemented manually (for example with Delta MERGE)?","options":["SCD Type 1","SCD Type 2","Bitemporal","SCD Type 3"],"answer":3,"explain":"AUTO CDC natively supports STORED AS SCD TYPE 1, SCD TYPE 2, and BITEMPORAL. SCD Type 3 — keeping the current value plus previous value(s) in additional columns — is not offered natively and is typically built with hand-written Delta MERGE logic.","source":"docs.databricks.com/aws/en/dlt/cdc"},{"id":"Q322","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"An engineer implements SCD Type 2 manually with Delta Lake MERGE. Which pattern is correct?","options":["WHEN MATCHED: update the existing row to close its validity (set end timestamp); WHEN NOT MATCHED: insert the new row version with an open end timestamp","DELETE all rows for the key, then re-INSERT the full history from source","WHEN MATCHED: update the changed attribute values in place, leaving one row per key","Run RESTORE TABLE to the version before the change arrived"],"answer":0,"explain":"SCD Type 2 with MERGE closes the current row by setting its end timestamp on a match (or matched-with-change condition), and inserts a new open-ended row version for the new values. Updating values in place is SCD Type 1 behavior; deletes/restores destroy history.","source":"docs.databricks.com/aws/en/delta/merge"},{"id":"Q323","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Which Python-only decorators let you define a dictionary of named expectations and apply a collective action to all of them?","options":["expect_all_or_fail_dict and expect_group","CONSTRAINT ... EXPECT ... ON VIOLATION clauses in SQL","expect_all, expect_all_or_drop, and expect_all_or_fail","dp.expect_group with a list of tuples"],"answer":2,"explain":"expect_all, expect_all_or_drop, and expect_all_or_fail accept a Python dict mapping expectation names to constraint strings and apply a shared action. While both SQL and Python support multiple expectations per dataset, only Python supports grouping with collective actions.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q324","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Auto Loader runs with the default schemaEvolutionMode (addNewColumns) and detects a brand-new column in incoming files. What happens to the running stream?","options":["The new column is added seamlessly with no interruption to the stream","The stream keeps running and routes the new column's data to _rescued_data permanently","The stream fails permanently; a new table and full re-ingestion are required","The stream initially fails; on restart, the evolved schema is used"],"answer":3,"explain":"With automatic schema evolution, the stream initially fails when the schema change is detected; after restarting, the stream resumes using the evolved schema (stored in cloudFiles.schemaLocation). Note the target Delta table must also evolve its schema or the write fails.","source":"docs.databricks.com/aws/en/data-engineering/schema-evolution"},{"id":"Q325","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Which statement about serverless Lakeflow (Declarative) pipelines is true?","options":["You must select a specific Databricks Runtime version for the pipeline","Photon is enabled automatically, and most Spark configuration parameters cannot be set","Photon stays disabled unless you set photon=true via the Pipelines API","Serverless pipelines bypass Unity Catalog permission checks"],"answer":1,"explain":"Photon is enabled automatically on serverless compute and serverless pipelines, and Databricks supports setting only a limited set of Spark configuration parameters there (unsupported ones cause failures). Runtime selection and classic compute knobs are removed on serverless; the photon flag applies to classic pipelines.","source":"docs.databricks.com/aws/en/compute/photon"},{"id":"Q326","cert":"DEP","domain":"Transformation & Quality","difficulty":1,"q":"Which function parses a JSON string column into a struct using a supplied schema?","options":["to_json","from_json","schema_of_json","get_json_object"],"answer":1,"explain":"from_json(jsonStr, schema) parses a JSON string into a struct based on the schema you provide. schema_of_json derives a DDL schema from a sample; to_json serializes a struct to a JSON string; get_json_object extracts a single value by path.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/from_json"},{"id":"Q327","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"A silver table has a column events of type ARRAY<INT>. Which function turns each array element into its own output row for flattening?","options":["explode","flatten","collect_set","to_json"],"answer":0,"explain":"explode is the table-valued generator function that produces one row per array element (a common step when flattening nested semi-structured data in the silver layer). flatten concatenates nested arrays into a single array; it does not create rows.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/explode"},{"id":"Q328","cert":"DEP","domain":"Transformation & Quality","difficulty":3,"q":"Which data does the Auto Loader rescued data column (e.g., _rescued_data) capture?","options":["Records that fail expectation constraints","Data with type mismatches or column name/casing differences from the schema","Records that are too malformed to be parsed at all","Rows removed by CDC delete events"],"answer":1,"explain":"The rescued data column holds data that does not match the schema due to type mismatches or column name/case differences, so it is not silently dropped. Truly corrupt records (unparseable) are handled separately, e.g., by DROPMALFORMED/FAILFAST modes, not by the rescued column.","source":"docs.databricks.com/aws/en/ingestion/cloud-object-storage/auto-loader/schema"},{"id":"Q329","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"According to Databricks medallion guidance, what must the silver layer always include?","options":["Only pre-aggregated summaries for reporting tools","A raw string or VARIANT copy of the bronze data","SCD Type 2 history for every table","At least one validated, non-aggregated representation of each record"],"answer":3,"explain":"The silver layer should always include at least one validated, non-aggregated representation of each record. Aggregate representations mostly belong to gold, while bronze keeps the raw copy.","source":"docs.databricks.com/aws/en/lakehouse/medallion"},{"id":"Q330","cert":"DEP","domain":"Transformation & Quality","difficulty":2,"q":"Which rule governs expectation names in a pipeline?","options":["Names must be unique within a dataset and can be reused across multiple datasets in the pipeline","Names must be globally unique across the entire workspace","Names are auto-generated from the constraint expression text","Names can never be reused, even in different pipelines"],"answer":0,"explain":"An expectation name must be unique for a given dataset, but the same expectation name (and even a shared dict of expectations) can be reused across multiple datasets in a pipeline — which enables portable, reusable expectations.","source":"docs.databricks.com/aws/en/ldp/expectations"},{"id":"Q701","cert":"GAI","domain":"App Development","difficulty":1,"q":"In Databricks AI Search (formerly Vector Search), which index type automatically and incrementally syncs with a source Delta table as the underlying data changes?","options":["Direct Vector Access index","Full-text index on a storage-optimized endpoint","Delta Sync index","Hybrid BM25 index"],"answer":2,"explain":"A Delta Sync Index automatically syncs with a source Delta table, incrementally updating the index as data changes. A Direct Vector Access index requires the user to update it manually via the REST API or SDK, and a dedicated full-text index is a special Delta Sync index without embeddings.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q702","cert":"GAI","domain":"App Development","difficulty":1,"q":"Which statement about a Direct Vector Access index is correct?","options":["The user must manually update it using the REST API or Python SDK, and it cannot be created in the UI","It automatically syncs whenever the source Delta table changes","It requires Databricks to compute embeddings from a text column","It only supports CONTINUOUS sync mode"],"answer":0,"explain":"A Direct Vector Access index supports direct read/write of vectors and metadata; the user is responsible for updates via the REST API or SDK, and this index type cannot be created using the UI — only via SDK/REST.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q703","cert":"GAI","domain":"App Development","difficulty":2,"q":"A Delta Sync index is created with pipeline_type='CONTINUOUS'. What behavior does this enable?","options":["The index syncs only when an explicit index.sync() call is made","The index automatically updates within seconds when the source Delta table changes, at higher cost because a streaming compute cluster runs continuously","The index performs full-text search only, with no vector embeddings","The index is rebuilt from scratch on every query"],"answer":1,"explain":"Continuous sync mode keeps the index in sync with seconds of latency, but costs more because a compute cluster is provisioned to run the continuous streaming pipeline. Triggered mode requires manual sync via UI, SDK, or REST API.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q704","cert":"GAI","domain":"App Development","difficulty":2,"q":"Your Delta Sync index uses pipeline_type='TRIGGERED'. How do you refresh it after the source Delta table is updated?","options":["Nothing — it refreshes automatically within seconds","Drop and recreate the index","Restart the vector search endpoint","Start the sync manually using the UI 'Sync now' button, the SDK index.sync(), or the REST API"],"answer":3,"explain":"With Triggered sync mode, you start the sync yourself from Catalog Explorer ('Sync now'), by calling index.sync() in the Python SDK, or via the REST API. Automatic syncing only happens in Continuous mode.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q705","cert":"GAI","domain":"App Development","difficulty":1,"q":"In client.create_delta_sync_index(...), what does the embedding_model_endpoint_name parameter specify?","options":["The AI Search endpoint that will serve the index","The Unity Catalog schema for storing embeddings","The model serving endpoint of the embedding model used to compute embeddings from the embedding source column","The endpoint used to serve the final RAG chat model"],"answer":2,"explain":"For a Delta Sync index with Databricks-managed embeddings, embedding_model_endpoint_name names the model serving endpoint that computes embeddings from embedding_source_column (e.g., a Foundation Model APIs endpoint serving an embedding model). endpoint_name is the separate parameter for the AI Search endpoint.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q706","cert":"GAI","domain":"App Development","difficulty":1,"q":"When creating any AI Search (Vector Search) index, which column requirement must the source table satisfy?","options":["It must have a primary key column that uniquely identifies each row","It must have a column named _id","It must have exactly one array<float> column","It must have a partition column"],"answer":0,"explain":"Every AI Search index requires a primary_key — the column that uniquely identifies rows in the source table. Note that _id is actually a reserved column name that must be renamed before index creation.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q707","cert":"GAI","domain":"App Development","difficulty":2,"q":"What does hybrid keyword-similarity search in AI Search do, and why is it useful for RAG?","options":["It converts vectors back into keywords using BM25 tokenization","It combines exact keyword matching (BM25) with vector similarity search, fusing both rankings — useful when data contains unique terms like SKUs or identifiers","It runs two separate queries and requires the application to merge the results","It only searches metadata columns with exact-match filters"],"answer":1,"explain":"Hybrid search matches exact words (BM25 relevance scoring) while also using vector similarity to capture semantic relationships; results are combined with Reciprocal Rank Fusion (RRF). It is particularly useful in RAG where source data has unique keywords such as SKUs not suited to pure similarity search.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q708","cert":"GAI","domain":"App Development","difficulty":2,"q":"In the AI Search Python SDK, if you call index.similarity_search(query_text=...) without specifying query_type, which query type runs by default?","options":["hybrid","FULL_TEXT","rerank","ANN (approximate nearest neighbor)"],"answer":3,"explain":"The default query type is ann (approximate nearest neighbor) using vector similarity. Use query_type='hybrid' for keyword+similarity search or query_type='FULL_TEXT' for keyword-only search.","source":"docs.databricks.com/aws/en/ai-search/query-ai-search"},{"id":"Q709","cert":"GAI","domain":"App Development","difficulty":3,"q":"A hybrid keyword-similarity query and an ANN query each request the maximum number of results possible. What are the per-query caps?","options":["10,000 for hybrid and 10,000 for ANN","1,000 for both query types","200 for hybrid and 10,000 for ANN (paginated in pages of up to 1,000)","200 for both query types"],"answer":2,"explain":"ANN queries can return up to 10,000 results (auto-paginated in pages of up to 1,000), while hybrid keyword-similarity and full-text queries are capped at 200 results per query.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q710","cert":"GAI","domain":"App Development","difficulty":2,"q":"Your Delta table stores precomputed embeddings generated with the Databricks-managed bge-large-en (v1.5) embedding model. When you create a Delta Sync index with self-managed embeddings, which embedding_dimension do you specify?","options":["384","1024","768","1536"],"answer":1,"explain":"bge-large-en (v1.5), the classic Databricks-hosted default embedding model (endpoint databricks-bge-large-en), produces 1024-dimensional vectors, so embedding_dimension=1024. (For contrast, e5-small/v2 style models and OpenAI ada-002 produce 384 and 1536 dimensions respectively.)","source":"docs.databricks.com/aws/en/agents/custom-agents/unstructured-retrieval-tools"},{"id":"Q711","cert":"GAI","domain":"App Development","difficulty":2,"q":"Which set of requirements applies to creating an AI Search (Vector Search) index on a standard endpoint?","options":["Unity Catalog enabled workspace, serverless compute, and Change Data Feed enabled on the source table","A classic all-purpose cluster and a Unity Catalog metastore","Photon acceleration and Delta Sharing enabled","A Pro SQL warehouse and an external embedding provider API key"],"answer":0,"explain":"Requirements include a Unity Catalog enabled workspace, serverless compute, and (for standard endpoints) Change Data Feed enabled on the source Delta table. You also need CREATE TABLE privileges on the schema where the index is created.","source":"docs.databricks.com/aws/en/ai-search/create-ai-search"},{"id":"Q712","cert":"GAI","domain":"App Development","difficulty":3,"q":"You created a Delta Sync index using self-managed (precomputed) embeddings, but now want Databricks to compute embeddings for you. What must you do?","options":["Alter the index to switch embedding ownership with ALTER INDEX","Call index.sync() with the new embedding model endpoint","Create a new index and recompute the embeddings — a self-managed index cannot be converted to a Databricks-managed one","Enable Change Data Feed and the index converts automatically"],"answer":2,"explain":"It is not possible to convert a self-managed embedding index to a Databricks-managed index. You must create a new index and recompute the embeddings.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q713","cert":"GAI","domain":"App Development","difficulty":3,"q":"AI Search uses the HNSW algorithm with the L2 distance metric. If you want rankings equivalent to cosine similarity, what should you do?","options":["Set query_type='cosine' on every query","Pass a normalized query vector only — data vectors do not matter","Switch to a storage-optimized endpoint, which uses cosine by default","Normalize your data point embeddings before feeding them into the index; when normalized, L2 ranking matches cosine ranking"],"answer":3,"explain":"AI Search performs ANN search using HNSW and the L2 (Euclidean) distance metric. To get cosine-similarity behavior, normalize the datapoint embeddings before indexing — with normalized vectors, L2 ranking is identical to cosine ranking.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q714","cert":"GAI","domain":"App Development","difficulty":3,"q":"Which combination correctly describes limitations of storage-optimized AI Search endpoints?","options":["They only support Continuous sync and embeddings of at most 768 dimensions","They only support Triggered sync mode and embedding dimensions must be divisible by 16","They cannot use filters and max out at 2 million vectors","They require Change Data Feed and support only Databricks-managed embeddings"],"answer":1,"explain":"Storage-optimized endpoints support over 1 billion vectors and 10-20x faster indexing, but Continuous sync mode is not supported, 'columns to sync' is not supported, and embedding dimensions must be divisible by 16.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q715","cert":"GAI","domain":"App Development","difficulty":1,"q":"What is the role of an AI Search (Vector Search) endpoint?","options":["It embeds queries using a chat model","It stores the source Delta table data","It serves AI Search indexes for querying via REST API or SDK, and scales automatically with index size and request load","It evaluates RAG application quality"],"answer":2,"explain":"The AI Search endpoint serves the indexes; you query and update it using the REST API or SDK. Endpoints scale up automatically to support index size/concurrency and scale down when indexes are deleted. A separate model serving endpoint may serve the embedding model.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q716","cert":"GAI","domain":"App Development","difficulty":2,"q":"You enable the AI Search reranker (reranker_config) on similarity_search queries. What does it do?","options":["Re-scores the top ~50 retrieved results with a reranking model to improve final relevance ordering","Re-embeds all documents in the index before returning results","Deduplicates Delta table rows during ingestion","Replaces hybrid search's RRF fusion with BM25 scoring"],"answer":0,"explain":"When a reranker is configured, the top 50 results of the retrieval are reranked by a reranking model to improve relevance quality — a common retrieval-quality technique after initial ANN/hybrid retrieval.","source":"docs.databricks.com/aws/en/ai-search/query-ai-search"},{"id":"Q717","cert":"GAI","domain":"App Development","difficulty":1,"q":"What does the SQL function ai_query(endpoint, request) do?","options":["Creates a new model serving endpoint from SQL","Invokes an existing Databricks Model Serving endpoint (foundation, external, or custom model) and parses and returns its response","Queries the AI Search index for similar vectors only","Trains a model on a Delta table for batch inference"],"answer":1,"explain":"ai_query is the general-purpose AI Function that invokes an existing Model Serving endpoint for real-time or batch inference from SQL, notebooks, pipelines, and Workflows, and parses/returns the response. The request must be a STRING for foundation/external model endpoints.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/ai_query"},{"id":"Q718","cert":"GAI","domain":"App Development","difficulty":2,"q":"Which values can the task-specific SQL function ai_analyze_sentiment return for input text?","options":["positive, negative, neutral, or mixed","A numeric score between 0 and 1","Only 'POSITIVE' or 'NEGATIVE'","A JSON object with per-sentence scores"],"answer":0,"explain":"ai_analyze_sentiment performs sentiment analysis on input text using a state-of-the-art AI model and returns one of: positive, negative, neutral, or mixed.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/ai_analyze_sentiment"},{"id":"Q719","cert":"GAI","domain":"App Development","difficulty":1,"q":"Which built-in SQL function lets you query an AI Search (Vector Search) index directly from SQL?","options":["ai_query()","ai_similarity()","vector_search()","ai_extract()"],"answer":2,"explain":"The vector_search() AI function searches and queries an AI Search index from SQL. ai_query() invokes model serving endpoints; ai_similarity() compares two strings semantically; ai_extract() extracts structured fields.","source":"docs.databricks.com/aws/en/large-language-models/ai-functions"},{"id":"Q720","cert":"GAI","domain":"App Development","difficulty":2,"q":"On which compute are AI Functions like ai_query() NOT available?","options":["Pro and Classic SQL warehouses","Serverless SQL warehouses","Serverless notebooks and Databricks Workflows","Lakeflow (DLT) pipelines on serverless"],"answer":0,"explain":"AI Functions are not available on Pro or Classic SQL warehouses; they require serverless compute (and are not supported on classic compute clusters), with Databricks Runtime 18.2 or above.","source":"docs.databricks.com/aws/en/large-language-models/ai-functions"},{"id":"Q721","cert":"GAI","domain":"App Development","difficulty":3,"q":"You need to run ai_query() over a very large table for batch inference. What does Databricks recommend?","options":["Manually split the table into small batches in a loop to control parallelism","Export the table and call the endpoint from an external service","Submit the full dataset in a single query — AI Functions automatically manage parallelization, retries, and scaling — and use Databricks-hosted (databricks- prefixed) foundation models","Disable failOnError to double throughput"],"answer":2,"explain":"Databricks best practice: let AI Functions handle the workload at scale — submit the full dataset in one query rather than manually batching, since parallelization/retries/scaling are managed automatically, and use provisionless Databricks-hosted foundation models (databricks- prefix) which work best for batch processing.","source":"docs.databricks.com/aws/en/large-language-models/ai-functions"},{"id":"Q722","cert":"GAI","domain":"App Development","difficulty":1,"q":"You have a Unity Catalog function main.default.lookup_orders. How do you expose it as a LangChain tool for your agent?","options":["Call mlflow.register_tool('main.default.lookup_orders')","Wrap it with UCFunctionToolkit(function_names=['main.default.lookup_orders']) and use its .tools property","Add it to the agent's serving endpoint configuration YAML","Convert it to a vector search index first"],"answer":1,"explain":"The Unity Catalog AI integration provides UCFunctionToolkit: instantiate it with function_names and add toolkit.tools to a LangChain agent's tool list. This gives governed, discoverable agent tools backed by UC functions.","source":"docs.databricks.com/aws/en/agents/custom-agents/create-custom-tool"},{"id":"Q723","cert":"GAI","domain":"App Development","difficulty":2,"q":"When creating a Unity Catalog function to be used as an agent tool, why do type hints and Google-style docstrings/comments on the function and its parameters matter so much?","options":["They speed up SQL execution of the function","They are required for the function to compile","They increase the vector search index quality","The LLM uses them to decide when to call the tool and how to generate the parameters"],"answer":3,"explain":"Function and parameter comments (docstrings) are critical for LLMs to call functions properly — the agent reads them to understand the tool's purpose and to format arguments correctly. Skipping them degrades tool-calling accuracy.","source":"docs.databricks.com/aws/en/agents/custom-agents/create-custom-tool"},{"id":"Q724","cert":"GAI","domain":"App Development","difficulty":3,"q":"You use VectorSearchRetrieverTool from databricks_langchain against a Direct Vector Access index (or a Delta Sync index with self-managed embeddings). What extra configuration is required compared to an index with Databricks-managed embeddings?","options":["You must specify the text column and an embedding model (e.g., DatabricksEmbeddings) so queries can be embedded","You must enable Change Data Feed on the index","You must pass the serving endpoint's API key in plain text","Nothing — the tool auto-detects the embedding model from the index"],"answer":0,"explain":"For direct-access indexes or Delta Sync indexes with self-managed embeddings, VectorSearchRetrieverTool requires you to specify text_column and an embedding model (embedding=...) such as DatabricksEmbeddings(endpoint='databricks-bge-large-en'), because Databricks does not manage query embedding for those index types.","source":"docs.databricks.com/aws/en/agents/custom-agents/unstructured-retrieval-tools"},{"id":"Q725","cert":"GAI","domain":"App Development","difficulty":1,"q":"In LangChain/LangGraph agent code on Databricks, which decorator turns a local Python function (e.g., get_current_time) into an agent tool?","options":["@mlflow.trace","@tool (from langchain_core.tools)","@data_loader","@uc_function"],"answer":1,"explain":"Local Python function tools are defined with the @tool decorator from LangChain (langchain_core.tools). The docstring describes the tool for the LLM. For external data/tools, Unity Catalog functions or MCP servers are preferred.","source":"docs.databricks.com/aws/en/agents/custom-agents/author-agent"},{"id":"Q726","cert":"GAI","domain":"App Development","difficulty":3,"q":"To conform to the MLflow retriever schema in a custom RAG retriever, what should the retriever function return?","options":["A plain string containing all concatenated chunks","A List[Document], using the Document metadata field for attributes like doc_uri and similarity_score","A Spark DataFrame of the source Delta table","A dictionary mapping chunk IDs to embedding vectors"],"answer":1,"explain":"To conform to the MLflow retriever schema, the retriever should return a List[Document] and put additional attributes (doc_uri, similarity_score, etc.) in the Document metadata field. Annotate it with @mlflow.trace(span_type='RETRIEVER') so MLflow logs retriever spans.","source":"docs.databricks.com/aws/en/agents/custom-agents/unstructured-retrieval-tools"},{"id":"Q727","cert":"GAI","domain":"App Development","difficulty":2,"q":"What does applying @mlflow.trace to functions in your agent code (e.g., retriever or parser methods) provide?","options":["MLflow tracing spans that record each function's inputs, outputs, and exceptions for monitoring and debugging","Automatic vector index syncing","Cost-based query optimization for SQL endpoints","Automatic retry logic for tool calls"],"answer":0,"explain":"The @mlflow.trace decorator creates a span when the function is invoked and ends when it returns; MLflow automatically records inputs, outputs, and exceptions. This gives per-step observability (e.g., RETRIEVER spans) for agents.","source":"docs.databricks.com/aws/en/agents/custom-agents/unstructured-retrieval-tools"},{"id":"Q728","cert":"GAI","domain":"App Development","difficulty":1,"q":"Which code correctly instantiates the LangChain chat model wrapper for a Databricks Model Serving endpoint?","options":["ChatOpenAI(model='databricks-meta-llama-3-70b-instruct')","ChatMlflow(endpoint='databricks-meta-llama-3-70b-instruct')","DatabricksChat(model='llama')","ChatDatabricks(endpoint='databricks-meta-llama-3-70b-instruct')"],"answer":3,"explain":"From the databricks-langchain package, ChatDatabricks(endpoint='...') is the Chat Model class that accesses chat endpoints hosted on Databricks Model Serving (including Foundation Model APIs endpoints), supporting tool calling and structured output.","source":"docs.databricks.com/aws/en/agents/custom-agents/author-agent"},{"id":"Q729","cert":"GAI","domain":"App Development","difficulty":2,"q":"In LangChain on Databricks, which class gives access to text-embedding endpoints hosted on Databricks Model Serving (e.g., databricks-bge-large-en)?","options":["DatabricksEmbeddings","DatabricksVectors","UCFunctionToolkit","VectorSearchRetrieverTool"],"answer":0,"explain":"DatabricksEmbeddings (from databricks-langchain) is the Embeddings class for Databricks-hosted embedding endpoints such as databricks-bge-large-en; the wrapped endpoint must have an OpenAI-compatible embeddings input/output format.","source":"docs.databricks.com/aws/en/agents/custom-agents/unstructured-retrieval-tools"},{"id":"Q730","cert":"GAI","domain":"App Development","difficulty":2,"q":"In RAG data preparation, what is the main purpose of adding overlap between consecutive chunks?","options":["It reduces storage cost of the vector index","It increases the embedding dimension of each chunk","It preserves context across chunk boundaries so sentences or ideas split between adjacent chunks are not lost at retrieval time","It enables hybrid keyword-similarity search automatically"],"answer":2,"explain":"Overlap (commonly ~10% of chunk size when starting around 200–500 token chunks) reduces the chance that sentences or concepts are abruptly cut at chunk boundaries, improving retrieval recall. Too-large chunks reduce precision; tune chunk size and overlap by evaluating retrieval quality.","source":"docs.databricks.com/aws/en/large-language-models/ai-functions"},{"id":"Q731","cert":"GAI","domain":"App Development","difficulty":2,"q":"Which sequence correctly describes the standard RAG pattern on Databricks?","options":["Chunk documents → embed chunks → index embeddings in AI Search → retrieve relevant chunks for the query → augment the prompt → generate the answer","Generate the answer → retrieve documents → embed the answer → index it","Embed full documents → chunk the embeddings → retrieve → retrain the LLM","Index documents → fine-tune the LLM on them → retrieve → generate"],"answer":0,"explain":"The canonical RAG flow: parse/chunk source documents, compute embeddings, store them in an AI Search index, retrieve the most similar chunks for the user query, append them to the prompt as context, and let the LLM generate a grounded answer. Reranking can improve retrieved-chunk relevance.","source":"docs.databricks.com/aws/en/ai-search/ai-search"},{"id":"Q732","cert":"GAI","domain":"App Development","difficulty":3,"q":"When logging a deployable AI agent with MLflow, what is the benefit of declaring dependent resources (such as the vector search index and serving endpoints) via the resources parameter?","options":["It disables Unity Catalog governance for the agent","Databricks automatically provisions access to those resources (e.g., grants the serving endpoint permission to use the vector search endpoint/index) when the agent is deployed","It embeds the resource data into the model artifact","It reduces token costs of the LLM"],"answer":1,"explain":"MLflow's deployable AI agents support specifying resources (vector search indexes, serving endpoints, UC functions). When deployed to Model Serving, Databricks automatically sets up the required dependencies/permissions so the agent can access them, keeping the deployment self-contained and governed.","source":"docs.databricks.com/aws/en/machine-learning/model-serving"},{"id":"Q733","cert":"GAI","domain":"App Development","difficulty":3,"q":"What is the correct order of steps to deploy a custom AI agent to a Databricks Model Serving endpoint?","options":["Create the serving endpoint → write agent code → log with MLflow → register the model","Register the model in UC → log the model with MLflow → write the agent code","Log the agent as an MLflow model (with dependencies/resources) → register it as a model version in Unity Catalog → create a serving endpoint that serves the registered model","Deploy straight from the notebook with mlflow.deployments.predict()"],"answer":2,"explain":"Agent serving is supported as a custom model: log the agent code as an MLflow model (packaging dependencies and resources), register the model in Unity Catalog, then create/point a Model Serving endpoint at the registered model version. The endpoint exposes a REST API for queries (also usable via ai_query).","source":"docs.databricks.com/aws/en/machine-learning/model-serving"},{"id":"Q734","cert":"GAI","domain":"App Development","difficulty":1,"q":"Which Foundation Model APIs mode does Databricks recommend as the easiest way to get started querying state-of-the-art open models?","options":["Pay-per-token foundation model endpoints","Provisioned throughput","AI Functions optimized models with fine-tuning","External models via Azure OpenAI"],"answer":0,"explain":"Pay-per-token is the easiest way to start accessing foundation models on Databricks — preconfigured endpoints appear in the Serving tab. For production/latency-sensitive workloads, Databricks recommends provisioned throughput (or priority pay-per-token).","source":"docs.databricks.com/aws/en/machine-learning/foundation-model-apis"},{"id":"Q735","cert":"GAI","domain":"App Development","difficulty":2,"q":"Your production workload needs performance guarantees, serves a fine-tuned model, and requires HIPAA compliance. Which Foundation Model APIs mode fits?","options":["Pay-per-token with default settings","Priority pay-per-token only","External models through a custom provider","Provisioned throughput"],"answer":3,"explain":"Provisioned throughput is recommended for production workloads, especially those requiring high throughput, performance guarantees, fine-tuned models, or additional security/compliance requirements such as HIPAA certifications.","source":"docs.databricks.com/aws/en/machine-learning/foundation-model-apis"},{"id":"Q736","cert":"GAI","domain":"App Development","difficulty":2,"q":"What is a key benefit of serving third-party LLMs (OpenAI, Anthropic, Cohere, etc.) as external models on Databricks Model Serving?","options":["The models are physically re-hosted inside your workspace storage","Centralized credential management — API keys are stored securely in one location (Databricks secrets) behind a unified endpoint, avoiding key exposure in code","External models are always free to query","It bypasses Unity Catalog governance entirely"],"answer":1,"explain":"External models are third-party models hosted outside Databricks. Model Serving provides a unified endpoint for LLM tasks (llm/v1/chat, completions, embeddings) and centralized credential management, storing API keys in one secure location so they are not exposed in code. AI Gateway can add governance/monitoring on top.","source":"docs.databricks.com/aws/en/machine-learning/foundation-models/external-models"},{"id":"Q737","cert":"GAI","domain":"App Development","difficulty":1,"q":"In the AI Playground, how do you compare responses from two different LLMs side-by-side?","options":["Open two browser tabs with the same prompt","Export the chat to a notebook and run it twice","Select + to add another model/endpoint and use the Sync checkboxes to synchronize the queries","Call ai_query() twice from a SQL editor"],"answer":2,"explain":"The AI Playground is a chat environment to interactively test, prompt, and compare LLMs. Select + in the upper-right to add an endpoint/model, choose a different model in the dropdown, and check Sync to run synchronized queries and compare responses side-by-side.","source":"docs.databricks.com/aws/en/large-language-models/ai-playground"},{"id":"Q738","cert":"GAI","domain":"App Development","difficulty":2,"q":"Which capability lets you prototype a tool-calling AI agent directly in the AI Playground?","options":["Select a model with the 'Tools enabled' label, open Tools, and attach tools such as a Unity Catalog function (e.g., system.ai.python_exec) or a vector search index, then chat to test the LLM + tools + system prompt combination","The Playground can only run single-turn completions without tools","You must first deploy an MLflow agent to a serving endpoint","Tools can only be attached after exporting to Databricks Apps"],"answer":0,"explain":"AI Playground supports prototyping tool-calling agents: pick a model with the Tools enabled label, select Tools (e.g., built-in UC function system.ai.python_exec), and test the combination of LLM, tools, and system prompt. Configurations can be exported as code or to a Databricks Apps agent.","source":"docs.databricks.com/aws/en/large-language-models/ai-playground"},{"id":"Q739","cert":"GAI","domain":"App Development","difficulty":2,"q":"Using AI Gateway (AI Guardrails) on a model serving endpoint, which built-in guardrails can you enable?","options":["Automatic fine-tuning, data labeling, and feature engineering","Index rebuilding, CDF, and partition management","Query caching, token bucketing, and schema enforcement","Safety filtering (blocking unsafe/harmful content), PII detection, plus topic and keyword controls"],"answer":3,"explain":"AI Guardrails on model serving endpoints include safety filtering (built on Llama Guard), PII detection (e.g., Presidio detecting credit cards, emails, phone numbers, bank accounts, SSNs), valid/invalid topics, and keyword filters. Blocked requests receive a default message; guardrails apply to model inputs/outputs.","source":"docs.databricks.com/aws/en/ai-gateway/overview-serving-endpoints"},{"id":"Q740","cert":"GAI","domain":"App Development","difficulty":3,"q":"You call ai_query() against a chat foundation model endpoint and need the model to return output conforming to a specific JSON structure. What should you use?","options":["The failOnError parameter set to false","The responseFormat parameter with a JSON schema (e.g., {\"type\": \"json_schema\", \"json_schema\": ...}) to enforce the output schema","The returnType parameter with a DDL string — it works for foundation chat models","modelParameters with temperature=0"],"answer":1,"explain":"For chat foundation models, ai_query supports responseFormat (DR 15.4+) to enforce structured output: a DDL-style JSON string or JSON string types text, json_object, or json_schema. returnType is for custom model endpoints without a model schema; temperature=0 only reduces randomness.","source":"docs.databricks.com/aws/en/sql/language-manual/functions/ai_query"},{"id":"Q801","cert":"GAI","domain":"Deployment","difficulty":1,"q":"Which of the following methods can be used to create a Databricks Model Serving endpoint that serves a custom model registered in Unity Catalog?","options":["Only the Serving UI and the REST API","The Serving UI, the REST API, the MLflow Deployments SDK, or the Databricks Workspace Client SDK","Only from inside a Databricks notebook using dbutils.serving","Only by exporting a Terraform template published in the Marketplace"],"answer":1,"explain":"Databricks supports creating custom model serving endpoints through the Serving UI, the REST API, the MLflow Deployments SDK (mlflow.deployments.get_deploy_client('databricks')), and the Databricks Workspace Client / real-time serving Python SDK. No notebook-only or Terraform-only restriction applies.","source":"docs.databricks.com/en/machine-learning/model-serving/create-manage-serving-endpoints"},{"id":"Q802","cert":"GAI","domain":"Deployment","difficulty":1,"q":"A team enables scale-to-zero on a Model Serving endpoint to reduce costs. What is the key trade-off Databricks documents for this setting?","options":["The endpoint can only be queried from inside the workspace once scaling is enabled","Scale-to-zero guarantees a minimum provisioned concurrency of 4 replicas at all times","Compute shuts down when idle, but the first requests after scale-up incur extra cold-start latency, and capacity is not guaranteed — so Databricks does not recommend it for production endpoints","Scale-to-zero is only available for endpoints serving external models"],"answer":2,"explain":"With scale-to-zero, resources are released when the endpoint is idle, saving cost. When traffic returns, the endpoint must scale back up, adding cold-start latency. Databricks notes scale-to-zero is not recommended for production endpoints because capacity is not guaranteed when scaled to zero.","source":"docs.databricks.com/en/machine-learning/model-serving/create-manage-serving-endpoints"},{"id":"Q803","cert":"GAI","domain":"Deployment","difficulty":2,"q":"When configuring Compute Scale-out for a custom model serving endpoint, which sizing guidance is correct?","options":["Scale-out size should roughly equal QPS × model run time; Small handles 0–4 concurrent requests, Medium 8–16, and Large 16–64","Scale-out size should equal the model's parameter count divided by 1,000","Small handles 0–40 concurrent requests, Medium 40–80, and Large 80–160","Compute Scale-out is fixed automatically and cannot be chosen by the user"],"answer":0,"explain":"Databricks guidance: the compute scale-out size corresponds to the number of simultaneous requests the served model can process and should be roughly QPS × model run time. Available sizes are Small (0–4 requests), Medium (8–16 requests), and Large (16–64 requests).","source":"docs.databricks.com/en/machine-learning/model-serving/create-manage-serving-endpoints"},{"id":"Q804","cert":"GAI","domain":"Deployment","difficulty":2,"q":"Your application needs token-by-token streamed output from a Model Serving endpoint that serves foundation models. Which approach does Databricks recommend?","options":["Export the endpoint to a Spark Structured Streaming sink and consume micro-batches","Query the endpoint with the OpenAI client against the OpenAI-compatible chat/completions API with streaming enabled (e.g., installing databricks-openai)","Streaming is not supported; responses are always returned as a single JSON object","Enable streaming by setting min_provisioned_concurrency to zero on the endpoint"],"answer":1,"explain":"Model Serving exposes a unified OpenAI-compatible API for Foundation Model APIs and external models. You use the OpenAI client (via the databricks-openai package, which configures auth automatically) specifying the endpoint name as the model, and stream chat/completions responses. Note that in agent inference tables, streaming responses only log fields compatible with ResponsesAgent, ChatAgent, and ChatCompletion schemas.","source":"docs.databricks.com/en/machine-learning/model-serving/score-foundation-models"},{"id":"Q805","cert":"GAI","domain":"Deployment","difficulty":2,"q":"Which GPU workload type matches a single A10G GPU with 24 GB of GPU memory?","options":["GPU_SMALL","MULTIGPU_MEDIUM","GPU_MEDIUM_8","GPU_MEDIUM"],"answer":3,"explain":"The GPU workload types are: GPU_SMALL = 1x T4 (16 GB), GPU_MEDIUM = 1x A10G (24 GB), MULTIGPU_MEDIUM = 4x A10G (96 GB), and GPU_MEDIUM_8 = 8x A10G (192 GB).","source":"docs.databricks.com/en/machine-learning/model-serving/create-manage-serving-endpoints"},{"id":"Q806","cert":"GAI","domain":"Deployment","difficulty":3,"q":"For GPU-based custom model endpoints, you set min_provisioned_concurrency to 12. According to Databricks documentation, how many replicas are provisioned?","options":["3 replicas, because the number of replicas equals the concurrency value divided by 4","12 replicas, one per concurrency unit","1 replica, because concurrency only affects request queueing on GPU endpoints","6 replicas, because each replica handles two concurrent requests"],"answer":0,"explain":"For GPU endpoints, the concurrency value determines the number of replicas: replicas = concurrency / 4. Databricks gives the explicit example that setting min_provisioned_concurrency to 12 provisions 3 replicas.","source":"docs.databricks.com/en/machine-learning/model-serving/create-manage-serving-endpoints"},{"id":"Q807","cert":"GAI","domain":"Deployment","difficulty":2,"q":"When creating a serving endpoint for an external model, which parameters must the external_model block in the served_entities configuration define?","options":["entity_name, entity_version, and min_provisioned_concurrency","instance_profile, environment variables, and traffic_config","min_provisioned_throughput, max_provisioned_throughput, and chunk_size","name, provider, and task (for example, llm/v1/chat), plus the provider config with credentials"],"answer":3,"explain":"The external_model field requires the model name (e.g., gpt-4o or claude-2), the provider (e.g., openai, anthropic), the task type (llm/v1/completions, llm/v1/chat, or llm/v1/embeddings), and a <provider>_config block holding details like the API key. min_provisioned_throughput belongs to provisioned throughput endpoints, not external models.","source":"docs.databricks.com/en/machine-learning/foundation-models/external-models"},{"id":"Q808","cert":"GAI","domain":"Deployment","difficulty":2,"q":"Which task types are supported for external model serving endpoints in Model Serving?","options":["llm/v1/completions, llm/v1/chat, and llm/v1/embeddings","llm/v1/chat, llm/v1/rerank, and llm/v1/fine-tune","llm/v1/completions, llm/v1/vision, and llm/v1/audio","Only llm/v1/chat is supported"],"answer":0,"explain":"External models support three task types: llm/v1/completions, llm/v1/chat, and llm/v1/embeddings. Vision tasks are covered by multimodal chat models, but the endpoint task taxonomy itself is these three.","source":"docs.databricks.com/en/machine-learning/foundation-models/external-models"},{"id":"Q809","cert":"GAI","domain":"Deployment","difficulty":1,"q":"What is the key security benefit of serving external models (such as OpenAI or Anthropic models) through Databricks Model Serving?","options":["It makes external providers charge less per token","Centralized credential management — API keys are stored in one secure location, so keys are not exposed in code and end users do not have to manage them","It removes the need for authentication on the serving endpoint","It automatically fine-tunes the external models on your data"],"answer":1,"explain":"Databricks support for external models provides centralized credential management: provider API keys are stored encrypted in one secure location (e.g., referenced via Databricks Secrets like {{secrets/scope/key}}), minimizing exposure of sensitive keys and preventing them from appearing in code.","source":"docs.databricks.com/en/machine-learni
