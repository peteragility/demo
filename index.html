<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter's Demo Site</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { background:#0d1117; color:#e6edf3; font-family:-apple-system,"Segoe UI",sans-serif; min-height:100vh; padding:48px 20px; }
.wrap { max-width:860px; margin:0 auto; }
h1 { font-size:2rem; color:#f0f6fc; margin-bottom:6px; }
.sub { color:#8b949e; font-size:.92rem; margin-bottom:36px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:14px; }
a.card { display:block; background:#161b22; border:1px solid #30363d; border-radius:14px; padding:18px 18px 16px; text-decoration:none; color:inherit; transition:transform .15s,border-color .15s; position:relative; }
a.card:hover { transform:translateY(-3px); border-color:#6e7681; }
.tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--c,#58a6ff); background:color-mix(in srgb, var(--c,#58a6ff) 14%, transparent); border-radius:20px; padding:3px 10px; margin-bottom:10px; }
.t { font-size:1.05rem; font-weight:600; color:#f0f6fc; margin-bottom:4px; line-height:1.35; }
.d { font-size:.84rem; color:#8b949e; line-height:1.45; }
.empty { color:#8b949e; padding:30px; text-align:center; grid-column:1/-1; }
footer { margin-top:40px; color:#484f58; font-size:.78rem; text-align:center; }
@media (max-width:600px){ h1{font-size:1.5rem} .grid{grid-template-columns:1fr} body{padding:32px 16px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚀 Peter's Demo Site</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="grid" id="grid"></div>
  <footer>auto-listed from manifest.json · <span id="count"></span></footer>
</div>
<script>
const base = location.pathname.replace(/\/[^\/]*$/, '/');
fetch(base + 'manifest.json', {cache:'no-store'})
  .then(r => r.json())
  .then(m => {
    const grid = document.getElementById('grid');
    document.getElementById('sub').textContent = m.generated ? `last updated ${m.generated}` : '';
    document.getElementById('count').textContent = `${m.pages.length} pages`;
    if (!m.pages.length) { grid.innerHTML = '<div class="empty">no pages yet</div>'; return; }
    grid.innerHTML = m.pages.map(p => `
      <a class="card" style="--c:${p.color||'#58a6ff'}" href="${base}${p.path}">
        ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
        <div class="t">${p.title}</div>
        <div class="d">${p.desc||''}</div>
      </a>`).join('');
  })
  .catch(() => { document.getElementById('grid').innerHTML = '<div class="empty">manifest.json not found</div>'; });
</script>
</body>
</html>
