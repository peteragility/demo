name: Site navigation and browser checks
on:
  push:
    paths: ['**/*.html', 'assets/**', 'scripts/**', 'databricks-sizing/**', 'lakehouse-quest/**', 'lakebase-content/facts.json', 'page-status/**', 'tests/**', 'demo-push.sh', 'manifest.json', '.github/workflows/*.yml']
  pull_request:
    paths: ['**/*.html', 'assets/**', 'scripts/**', 'databricks-sizing/**', 'lakehouse-quest/**', 'lakebase-content/facts.json', 'page-status/**', 'tests/**', 'demo-push.sh', 'manifest.json', '.github/workflows/*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check links, inline scripts and sharing metadata
        run: node scripts/check-site.mjs
      - name: Check scoped publishing
        run: node --test tests/*.test.cjs
      - name: Check Databricks sizing and regional pricing fallback
        run: |
          node --check databricks-sizing/engine.js
          node --check databricks-sizing/app.js
          node --test databricks-sizing/calculator.test.cjs
      - name: Validate question bank and imported progress
        run: node --test lakehouse-quest/progress.test.cjs
      - name: Check games, navigation and security regressions
        run: node scripts/browser-smoke.mjs
      - name: Check Databricks sizing, sharing and mobile comparison
        run: node databricks-sizing/browser.test.mjs
