name: Site navigation and browser checks
on:
  push:
    paths: ['**/*.html', 'assets/**', 'scripts/**', 'manifest.json', '.github/workflows/site-quality.yml']
  pull_request:
    paths: ['**/*.html', 'assets/**', 'scripts/**', 'manifest.json', '.github/workflows/site-quality.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check links, inline scripts and sharing metadata
        run: node scripts/check-site.mjs
      - name: Check scoped publishing
        run: node --test tests/publish-helper.test.cjs
      - name: Check games, navigation and security regressions
        run: node scripts/browser-smoke.mjs
